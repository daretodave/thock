  <title>thock hero, Wooting 80HE+ shipping update. A compact 75%-style keyboard case top-down silhouette with a coral rotary knob protruding at the upper right corner, the Lekker Knob Large callout, and a two-marker shipping timeline below the case, a solid coral dot for the ABS and Module units shipping late October 2026 and a hollow coral ring further right for the zinc and Lekker Knob Large variants following mid December 2026, joined by a dashed progression line</title>

  <!-- Coral wash behind the knob, upper right, the near-term news focal region -->
  <ellipse cx="905" cy="185" rx="190" ry="120" fill="oklch(0.68 0.165 28 / 0.10)" stroke="none"/>

  <!-- Coral wash behind the shipping timeline, the actual news hook -->
  <ellipse cx="600" cy="612" rx="470" ry="95" fill="oklch(0.68 0.165 28 / 0.08)" stroke="none"/>

  <!-- ============================================================
       Case outline, compact 75%-style top-down silhouette, chamfer
       language matching the family's other keyboard hero art
       (keychron-q16-he-8k-ceramic-tmr).
       ============================================================ -->
