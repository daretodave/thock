  <!-- ============================================================
       SHIPPING TIMELINE — two waves, the actual news hook. A
       filled coral dot for the near wave already shipping, a
       hollow coral ring for the later wave still ahead, joined
       by a dashed progression line.
       ============================================================ -->
  <line x1="220" y1="612" x2="880" y2="612" stroke-opacity="0.4"/>
  <line x1="420" y1="612" x2="740" y2="612" stroke="oklch(0.68 0.165 28)" stroke-width="2" stroke-dasharray="2 8" stroke-opacity="0.7"/>

  <!-- Wave 1, ABS and Module, shipping -->
  <circle cx="420" cy="612" r="9" fill="oklch(0.68 0.165 28)" stroke="none"/>
  <circle cx="420" cy="612" r="17" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.35" stroke-width="1.5"/>
  <g font-family="JetBrains Mono, monospace" font-size="16" text-anchor="middle" stroke="none">
