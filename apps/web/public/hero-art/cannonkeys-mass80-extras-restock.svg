<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 750"
     preserveAspectRatio="xMidYMid meet"
     fill="none"
     stroke="oklch(0.78 0.005 90)"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     role="img"
     aria-label="thock article hero art for the CannonKeys Mass80 extras restock — top-down 80 percent keyboard outline with a coral touchscreen module in the upper-right corner and a small coral restock tag reading EXTRAS, OCT 8 beneath the case">
  <title>thock hero — CannonKeys Mass80 extras restock, TKL-adjacent 80% outline with touchscreen module and dated restock tag</title>

  <!--
    News/vendor piece hero. Top-down 80%/TKL-adjacent case silhouette
    as the primary subject, per family convention. Two restrained
    narrative additions carry the article's thesis:
      1. A coral touchscreen module inset at the upper-right corner
         of the case, standing in for the Mass80's integrated display.
      2. A small dated "restock tag" beneath the case — a rounded
         pill with a clock glyph and OCT 8 text — literalizing the
         fixed-window extras sale rather than a new group buy.
    Single-splash discipline: coral is the only per-piece accent hue.
    The warm-bronze theme dot is the fixed family ornament, upper right.
  -->

  <!-- Case outline: 80%/TKL-adjacent rectangle, slightly inset corners -->
  <g>
    <path d="
      M 200 200
      L 1000 200
      L 1000 540
      L 200 540
      Z" />
    <!-- inner bezel inset -->
    <path d="
      M 224 222
      L 976 222
      L 976 518
      L 224 518
      Z" stroke-opacity="0.5"/>
  </g>

  <!-- Touchscreen module, upper-right — the Mass80's defining feature -->
  <g>
    <rect x="860" y="246" width="92" height="92" rx="10"
          fill="oklch(0.68 0.165 28 / 0.85)"
          stroke="oklch(0.60 0.17 28)"
          stroke-width="2"/>
    <!-- screen glyph lines, paler -->
    <line x1="876" y1="268" x2="936" y2="268" stroke="oklch(0.90 0.05 28 / 0.6)" stroke-width="2"/>
    <line x1="876" y1="286" x2="920" y2="286" stroke="oklch(0.90 0.05 28 / 0.6)" stroke-width="2"/>
    <circle cx="906" cy="312" r="10" stroke="oklch(0.90 0.05 28 / 0.6)" stroke-width="2"/>
  </g>

  <!-- Key grid, standard 80%-TKL cadence, five rows -->
  <g>
