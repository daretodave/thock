    <line x1="520" y1="628" x2="520" y2="619" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
    <line x1="520" y1="628" x2="527" y2="631" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
    <text x="548" y="624" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" letter-spacing="2" fill="oklch(0.68 0.165 28)" stroke="none">EXTRAS</text>
