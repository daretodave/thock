<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 750"
     preserveAspectRatio="xMidYMid meet"
     fill="none"
     stroke="oklch(0.78 0.005 90)"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     role="img"
     aria-label="thock article hero art for how to evaluate a group buy before you pay — a timeline arrow running left to right through four checkpoints, announced, live, closed, shipped, with a branch peeling off after closed toward a dimmer, dashed delayed checkpoint, marked by an ochre splash at the branch point">
  <title>thock hero — group-buy timeline with a branch toward a delayed checkpoint</title>

  <!-- ================================================================
       Guide-convention hero: annotated "row" reinterpreted as an
       annotated timeline per the article's own heroImageAlt. Main
       timeline runs announced -> live -> closed -> shipped. A single
       branch leaves the line just past "closed" (the point where most
       group buys actually stall — funding is done, production is not)
       and leads to a dimmer, dashed "delayed" checkpoint rendered in a
       hushed italic serif rather than the confident mono of the main
       line. An ochre focal dot marks the branch point itself; a faint
       ochre wash sits behind the whole delayed region. A few fading
       dashes trail off past "delayed" with no arrowhead, standing in
       for the open-ended wait rather than a resolved outcome.
       Background: transparent (light-mode safe per house style).
       Splash: ochre oklch(0.72 0.13 88). Theme: bronze oklch(0.80 0.135 75).
       ================================================================ -->

  <!-- Ochre wash behind the branch / delayed region -->
  <ellipse cx="860" cy="440" rx="230" ry="175" fill="oklch(0.72 0.13 88 / 0.09)" stroke="none"/>

  <!-- ============================================================
       MAIN TIMELINE — announced -> live -> closed -> shipped
  ============================================================ -->
  <line x1="140" y1="340" x2="1046" y2="340" stroke-opacity="0.8"/>
  <!-- open arrowhead at the line's end -->
  <path d="M 1034 328 L 1050 340 L 1034 352" stroke-opacity="0.85"/>

  <!-- Directional chevrons along the line, between checkpoints -->
  <g stroke-opacity="0.4" stroke-width="1.5">
    <path d="M 354 333 L 366 340 L 354 347"/>
    <path d="M 614 333 L 626 340 L 614 347"/>
    <path d="M 874 333 L 886 340 L 874 347"/>
  </g>

  <!-- Checkpoint nodes -->
  <g stroke-opacity="0.85">
    <circle cx="230" cy="340" r="9"/>
    <circle cx="490" cy="340" r="9"/>
    <circle cx="750" cy="340" r="9"/>
    <circle cx="1010" cy="340" r="9"/>
  </g>

  <!-- Checkpoint labels — confident mono, uppercase -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace" font-size="15" letter-spacing="1.6" fill="oklch(0.78 0.005 90)" fill-opacity="0.85" text-anchor="middle" stroke="none">
    <text x="230" y="378">ANNOUNCED</text>
    <text x="490" y="378">LIVE</text>
    <text x="750" y="378">CLOSED</text>
    <text x="1010" y="378">SHIPPED</text>
  </g>

  <!-- ============================================================
       BRANCH — peels off just past "closed", toward "delayed"
  ============================================================ -->
  <path d="M 757 346 C 806 372, 862 430, 900 494"
    stroke-opacity="0.42" stroke-dasharray="5 7"/>

  <!-- Ochre focal dot — marks the branch point -->
  <circle cx="774" cy="358" r="5" fill="oklch(0.72 0.13 88 / 0.9)" stroke="oklch(0.72 0.13 88)" stroke-width="1.4"/>

  <!-- Delayed checkpoint — dimmer, dashed, the unresolved branch -->
  <circle cx="900" cy="500" r="9" stroke-opacity="0.45" stroke-dasharray="3 4"/>
  <text x="900" y="538" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="18" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" text-anchor="middle" stroke="none">delayed</text>

  <!-- Fading trail past "delayed" — the open-ended wait, no arrowhead -->
  <g stroke-dasharray="3 6">
    <path d="M 908 508 L 936 532" stroke-opacity="0.26"/>
    <path d="M 942 538 L 966 558" stroke-opacity="0.16"/>
    <path d="M 972 564 L 992 582" stroke-opacity="0.08"/>
  </g>

  <!-- Bronze theme dot — family ornamental anchor -->
  <circle cx="1150" cy="70" r="6" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
