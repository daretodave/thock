<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#4A4540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock hero — switch cross-section, exploded housing with a foam pad wrapped around the stem and spring</title>

  <!-- ===== Background: warm paper, light-mode safe ===== -->
  <rect width="1200" height="750" fill="#F9F4EF" stroke="none"/>

  <!-- ===== Dusty-rose wash behind the switch column ===== -->
  <rect x="470" y="120" width="260" height="560" rx="18" fill="oklch(0.66 0.085 12 / 0.06)" stroke="none"/>

  <!-- ===== KEYCAP (topmost, lifted slightly to show the exploded gap) ===== -->
  <path d="
    M 520 96
    L 680 96
    Q 692 96 692 108
    L 692 152
    Q 692 164 680 164
    L 520 164
    Q 508 164 508 152
    L 508 108
    Q 508 96 520 96
    Z"
    stroke-opacity="0.85"/>
  <!-- keycap underside skirt hint -->
  <line x1="524" y1="164" x2="524" y2="176" stroke-opacity="0.4"/>
  <line x1="676" y1="164" x2="676" y2="176" stroke-opacity="0.4"/>
  <line x1="524" y1="176" x2="676" y2="176" stroke-opacity="0.4"/>

  <!-- Explode gap ticks: keycap to stem crown -->
  <line x1="600" y1="176" x2="600" y2="204" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>

  <!-- ===== TOP HOUSING shell (exploded upward off the bottom housing) ===== -->
  <path d="
    M 470 204
    L 730 204
    Q 744 204 744 218
    L 744 210
    L 744 218
    L 744 214
    L 744 214
    L 744 342
    Q 744 356 730 356
    L 470 356
    Q 456 356 456 342
    L 456 218
    Q 456 204 470 204
    Z"
    stroke-opacity="0.85"/>
  <!-- Top housing crown opening (stem passes through) -->
  <rect x="574" y="204" width="52" height="18" rx="3" stroke-opacity="0.55"/>
  <!-- Top housing inner cavity edge -->
  <rect x="480" y="228" width="240" height="112" rx="6" stroke-opacity="0.30"/>

  <!-- Stem crown poking above the top housing -->
  <path d="M 584 176 L 616 176 L 616 204 L 584 204 Z" stroke-opacity="0.9"/>
  <!-- Stem cross rails (cruciform, seen edge-on) -->
  <line x1="592" y1="176" x2="592" y2="204" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="608" y1="176" x2="608" y2="204" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Explode gap ticks: top housing to foam / lower stem -->
  <line x1="480" y1="360" x2="480" y2="388" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>
  <line x1="720" y1="360" x2="720" y2="388" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>

  <!-- ===== STEM SHAFT — descends through the foam pad into the spring ===== -->
  <line x1="600" y1="204" x2="600" y2="560" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="586" y="356" width="28" height="204" rx="4" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- stem slider rail hints -->
  <line x1="592" y1="356" x2="592" y2="560" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="608" y1="356" x2="608" y2="560" stroke-opacity="0.3" stroke-width="1"/>

  <!-- ===== BOTTOM HOUSING shell (holds rails, spring, contact leaves) ===== -->
  <path d="
    M 462 388
    L 738 388
    Q 750 388 750 400
    L 750 636
    Q 750 648 738 648
    L 462 648
    Q 450 648 450 636
    L 450 400
    Q 450 388 462 388
    Z"
    stroke-opacity="0.85"/>
  <!-- rail guide walls inside bottom housing -->
  <line x1="486" y1="404" x2="486" y2="632" stroke-opacity="0.24"/>
  <line x1="714" y1="404" x2="714" y2="632" stroke-opacity="0.24"/>

  <!-- ===== SPRING — coiled beneath the foam pad, around the lower stem shaft ===== -->
  <g stroke-opacity="0.62" stroke-width="1.5">
    <ellipse cx="600" cy="470" rx="34" ry="9"/>
    <ellipse cx="600" cy="492" rx="34" ry="9"/>
    <ellipse cx="600" cy="514" rx="34" ry="9"/>
    <ellipse cx="600" cy="536" rx="34" ry="9"/>
    <ellipse cx="600" cy="558" rx="34" ry="9"/>
    <ellipse cx="600" cy="580" rx="30" ry="8"/>
  </g>

  <!-- Spring seat at housing floor -->
  <path d="M 560 604 Q 600 616 640 604" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Contact leaves at the housing floor -->
  <path d="M 470 636 L 470 616 Q 470 606 480 606 L 520 606" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M 730 636 L 730 616 Q 730 606 720 606 L 680 606" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- ===== FOAM PAD — the hero layer, wrapped around the stem shaft mid-housing, sitting atop the spring ===== -->
  <!-- soft rounded ring, drawn as a slotted washer around the stem -->
  <g>
    <path d="
      M 540 430
      Q 540 410 560 410
      L 640 410
      Q 660 410 660 430
      L 660 452
      Q 660 472 640 472
      L 560 472
      Q 540 472 540 452
      Z"
      fill="oklch(0.66 0.085 12 / 0.26)"
      stroke="oklch(0.66 0.085 12)" stroke-opacity="0.95" stroke-width="2"/>
    <!-- inner bore where the stem shaft passes through -->
    <rect x="584" y="410" width="32" height="62" rx="6"
      fill="#F9F4EF" stroke="oklch(0.66 0.085 12)" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>

  <!-- foam texture: small dots suggesting open-cell pad material -->
  <g fill="oklch(0.66 0.085 12)" fill-opacity="0.32" stroke="none">
    <circle cx="556" cy="424" r="3"/>
    <circle cx="556" cy="440" r="3"/>
    <circle cx="556" cy="456" r="3"/>
    <circle cx="644" cy="424" r="3"/>
    <circle cx="644" cy="440" r="3"/>
    <circle cx="644" cy="456" r="3"/>
    <circle cx="572" cy="418" r="2.5"/>
    <circle cx="628" cy="418" r="2.5"/>
    <circle cx="572" cy="464" r="2.5"/>
    <circle cx="628" cy="464" r="2.5"/>
  </g>

  <!-- Accent bloom around the foam pad -->
  <path d="
      M 540 430
      Q 540 410 560 410
      L 640 410
      Q 660 410 660 430
      L 660 452
      Q 660 472 640 472
      L 560 472
      Q 540 472 540 452
      Z"
      stroke="oklch(0.66 0.085 12)" stroke-opacity="0.14" stroke-width="10" fill="none"/>

  <!-- ===== Explode gap ticks: bottom housing to PCB ===== -->
  <line x1="486" y1="652" x2="486" y2="674" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>
  <line x1="714" y1="652" x2="714" y2="674" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>

  <!-- ===== PCB pins ===== -->
  <rect x="470" y="678" width="260" height="20" rx="3" stroke-opacity="0.5"/>
  <line x1="530" y1="698" x2="530" y2="718" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="670" y1="698" x2="670" y2="718" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="600" y1="698" x2="600" y2="710" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- ===== Section labels, left margin ===== -->
  <g font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace"
     font-size="11" fill="#4A4540" fill-opacity="0.45"
     text-anchor="end" letter-spacing="0.04em" stroke="none">
    <text x="430" y="134">keycap</text>
    <text x="430" y="284">top</text>
    <text x="430" y="298">housing</text>
    <text x="430" y="522">bottom</text>
    <text x="430" y="536">housing</text>
    <text x="430" y="692">PCB</text>
  </g>

  <!-- ===== Left bracket — foam sits between the stem crown and the spring coils ===== -->
  <g stroke="oklch(0.80 0.135 75)" stroke-width="1.5" stroke-opacity="0.55" fill="none">
    <line x1="410" y1="410" x2="438" y2="410"/>
    <line x1="410" y1="472" x2="438" y2="472"/>
    <line x1="410" y1="410" x2="410" y2="472"/>
    <line x1="410" y1="441" x2="426" y2="441"/>
  </g>

  <!-- ===== Callout: bronze leader from label to the foam pad ===== -->
  <g stroke="oklch(0.80 0.135 75)" stroke-width="1.5" stroke-opacity="0.85" fill="none">
    <path d="M 860 300 L 800 300 L 668 424"/>
    <path d="M 668 424 L 658 416 M 668 424 L 662 434"/>
  </g>
  <circle cx="860" cy="300" r="4" fill="oklch(0.80 0.135 75)" stroke="none"/>

  <text x="860" y="270"
    font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace"
    font-size="13" fill="oklch(0.80 0.135 75)" fill-opacity="0.95"
    letter-spacing="0.04em" text-anchor="middle" stroke="none">foam</text>
  <text x="860" y="286"
    font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace"
    font-size="13" fill="oklch(0.80 0.135 75)" fill-opacity="0.95"
    letter-spacing="0.04em" text-anchor="middle" stroke="none">pad</text>

  <!-- ===== Dusty-rose tick marks at the foam pad's housing boundary ===== -->
  <g stroke="oklch(0.66 0.085 12)" stroke-width="2" stroke-opacity="0.65">
    <line x1="540" y1="402" x2="540" y2="418"/>
    <line x1="660" y1="402" x2="660" y2="418"/>
  </g>

  <!-- ===== Bronze theme dot — upper-right ornamental anchor ===== -->
  <circle cx="1146" cy="52" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
