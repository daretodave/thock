<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="#4A4540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock hero — switch pin approaching then seated in a hot-swap PCB socket, with a pin-fatigue tradeoff callout</title>

  <!-- ================================================================
       Canvas:  1200 × 750   Stroke: 2px warm charcoal on warm paper
       Background   #F9F4EF  warm paper (light-mode safe)
       Stroke       #4A4540  warm charcoal
       Splash       coral  #ed695c  (oklch 0.68 0.165 28) — the spring
       contact leaves inside the socket, the hero focal element.
       Bronze theme oklch(0.80 0.135 75) — upper-right ornament dot.

       Subject: two mirrored panels of the same switch/socket pair —
       LEFT: pins hovering above open, relaxed contact leaves (approach).
       RIGHT: pins fully seated, leaves flexed and gripping the pin,
       contact made — no solder. A dashed "swap" arrow bridges the two.
       A small lower-center callout depicts the tradeoff: a pin bent out
       of true after repeated insert/remove cycles — the durability cost
       traded against solder-free convenience.
       ================================================================ -->

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="750" fill="#F9F4EF" stroke="none"/>

  <!-- Faint technical-sheet guide lines -->
  <g stroke="#4A4540" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="223" x2="1200" y2="223"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
  </g>

  <!-- Wide coral washes behind each panel (right — the "seated" panel —
       reads slightly stronger since it is the hero moment) -->
  <ellipse cx="320" cy="320" rx="150" ry="170" fill="#ed695c" fill-opacity="0.04" stroke="none"/>
  <ellipse cx="880" cy="320" rx="150" ry="170" fill="#ed695c" fill-opacity="0.07" stroke="none"/>

  <!-- Faint vertical divider guide -->
  <line x1="600" y1="60" x2="600" y2="386" stroke="#4A4540" stroke-opacity="0.08" stroke-dasharray="2 8"/>

  <!-- ================================================================
       LEFT PANEL — approach (contacts open, pins not yet engaged)
       ================================================================ -->

  <!-- Switch housing floor (the underside slab pins protrude from) -->
  <rect x="220" y="60" width="200" height="100" rx="8" fill="#4A4540" fill-opacity="0.02" stroke="#4A4540" stroke-opacity="0.82"/>
  <line x1="220" y1="100" x2="420" y2="100" stroke-opacity="0.22"/>

  <!-- Outer plastic locating pins (short, neutral) -->
  <g stroke="#4A4540" stroke-opacity="0.4" stroke-width="1.4">
    <line x1="235" y1="160" x2="235" y2="210"/>
    <line x1="405" y1="160" x2="405" y2="210"/>
  </g>

  <!-- Contact pins — stop short of the socket, hovering -->
  <g stroke="#4A4540" stroke-opacity="0.78" stroke-width="2.2">
    <line x1="275" y1="160" x2="275" y2="230"/>
    <line x1="365" y1="160" x2="365" y2="230"/>
  </g>

  <!-- Air gap — dashed alignment guide showing the intended drop path -->
  <g stroke="#4A4540" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="3 6">
    <line x1="275" y1="230" x2="275" y2="290"/>
    <line x1="365" y1="230" x2="365" y2="290"/>
  </g>

  <!-- Motion chevron indicating downward travel -->
  <path d="M 312 250 L 320 262 L 328 250" stroke="#ed695c" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Socket housing (beveled entry mouth) -->
  <path d="M 250 300 L 265 290 L 375 290 L 390 300 L 390 360 L 250 360 Z"
    fill="#4A4540" fill-opacity="0.02" stroke="#4A4540" stroke-opacity="0.7"/>

  <!-- Relaxed contact leaves — open, not yet touching a pin -->
  <g stroke="#ed695c" stroke-width="2" stroke-opacity="0.5" fill="none">
    <path d="M 267 300 L 275 320 L 267 340"/>
    <path d="M 373 300 L 365 320 L 373 340"/>
  </g>

  <!-- PCB -->
  <rect x="230" y="360" width="180" height="26" rx="3" stroke="#4A4540" stroke-opacity="0.55"/>
  <g stroke="#4A4540" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="250" y1="373" x2="290" y2="373"/>
    <line x1="350" y1="373" x2="390" y2="373"/>
  </g>

  <!-- Caption -->
  <text x="320" y="410" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="#4A4540" fill-opacity="0.6" letter-spacing="0.02em" text-anchor="middle" stroke="none">approach — contacts open</text>

  <!-- ================================================================
       RIGHT PANEL — seated (contact made, no solder)
       ================================================================ -->

  <!-- Switch housing floor -->
  <rect x="780" y="60" width="200" height="100" rx="8" fill="#4A4540" fill-opacity="0.02" stroke="#4A4540" stroke-opacity="0.82"/>
  <line x1="780" y1="100" x2="980" y2="100" stroke-opacity="0.22"/>

  <!-- Outer plastic locating pins -->
  <g stroke="#4A4540" stroke-opacity="0.4" stroke-width="1.4">
    <line x1="795" y1="160" x2="795" y2="210"/>
    <line x1="965" y1="160" x2="965" y2="210"/>
  </g>

  <!-- Contact pins — fully inserted, running through the socket to the
       contact depth -->
  <g stroke="#4A4540" stroke-opacity="0.78" stroke-width="2.2">
    <line x1="835" y1="160" x2="835" y2="335"/>
    <line x1="925" y1="160" x2="925" y2="335"/>
  </g>

  <!-- Contact glow halo behind the flexed leaves -->
  <ellipse cx="880" cy="335" rx="90" ry="42" fill="#ed695c" fill-opacity="0.10" stroke="none"/>

  <!-- Socket housing (beveled entry mouth) -->
  <path d="M 810 300 L 825 290 L 935 290 L 950 300 L 950 360 L 810 360 Z"
    fill="#4A4540" fill-opacity="0.02" stroke="#4A4540" stroke-opacity="0.7"/>

  <!-- Flexed contact leaves — bowed in, gripping the pin -->
  <g stroke="#ed695c" stroke-width="3" stroke-opacity="0.95" fill="none">
    <path d="M 822 300 Q 832 320 835 335 Q 832 350 822 360"/>
    <path d="M 938 300 Q 928 320 925 335 Q 928 350 938 360"/>
  </g>

  <!-- Contact points — where the leaf actually touches the pin -->
  <g fill="#ed695c" stroke="none">
    <circle cx="835" cy="335" r="4"/>
    <circle cx="925" cy="335" r="4"/>
  </g>

  <!-- PCB -->
  <rect x="790" y="360" width="180" height="26" rx="3" stroke="#4A4540" stroke-opacity="0.55"/>
  <g stroke="#4A4540" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="810" y1="373" x2="850" y2="373"/>
    <line x1="910" y1="373" x2="950" y2="373"/>
  </g>

  <!-- Caption -->
  <text x="880" y="410" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="#ed695c" fill-opacity="0.85" letter-spacing="0.02em" text-anchor="middle" stroke="none">seated — contact made</text>

  <!-- ================================================================
       CENTER — "swap" arrow bridging the two states
       ================================================================ -->
  <g stroke="#4A4540" stroke-opacity="0.5" stroke-width="2">
    <line x1="520" y1="210" x2="670" y2="210" stroke-dasharray="4 6"/>
    <path d="M 670 210 L 656 202 M 670 210 L 656 218" stroke-opacity="0.6"/>
  </g>
  <text x="600" y="192" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="#ed695c" fill-opacity="0.75" letter-spacing="0.06em" text-anchor="middle" stroke="none">hot-swap</text>

  <!-- ================================================================
       TRADEOFF CALLOUT — repeated swaps risk bending the pin
       ================================================================ -->
  <g stroke="#ed695c" stroke-opacity="0.14" stroke-width="1.4" stroke-dasharray="2 7">
    <path d="M 320 360 L 460 460 L 585 470" fill="none"/>
    <path d="M 880 360 L 720 460 L 615 470" fill="none"/>
  </g>

  <path d="M 600 466 L 600 494 L 618 506 L 606 524"
    stroke="#4A4540" stroke-opacity="0.75" stroke-width="2.2" fill="none"/>
  <circle cx="618" cy="506" r="3.5" fill="#ed695c" stroke="none" opacity="0.9"/>

  <text x="600" y="550" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="#4A4540" fill-opacity="0.6" letter-spacing="0.02em" text-anchor="middle" stroke="none">repeated swaps → pin fatigue</text>

  <!-- ================================================================
       MARGIN SECTION LABELS (left, faint)
       ================================================================ -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace" font-size="11"
     fill="#4A4540" fill-opacity="0.32" text-anchor="end" letter-spacing="0.04em" stroke="none">
    <text x="150" y="114">switch</text>
    <text x="150" y="330">socket</text>
    <text x="150" y="377">PCB</text>
  </g>

  <!-- ================================================================
       ARTICLE TITLE (restrained, matches family footer convention)
       ================================================================ -->
  <text x="600" y="706" font-family="Newsreader, serif" font-size="22" font-style="italic"
    fill="#4A4540" stroke="none" text-anchor="middle" opacity="0.78">hot-swap sockets</text>
  <text x="600" y="732" font-family="IBM Plex Sans, sans-serif" font-size="14"
    fill="#4A4540" stroke="none" text-anchor="middle" opacity="0.48">no solder · pin fatigue · tradeoffs</text>

  <!-- Bronze theme dot — upper-right ornamental anchor -->
  <circle cx="1158" cy="42" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
