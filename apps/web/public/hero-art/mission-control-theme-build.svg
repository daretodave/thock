      <rect x="348" y="244" width="34" height="34" rx="3"/>
      <rect x="386" y="244" width="34" height="34" rx="3"/>
      <rect x="424" y="244" width="34" height="34" rx="3"/>
      <rect x="462" y="244" width="34" height="34" rx="3"/>
      <rect x="500" y="244" width="34" height="34" rx="3"/>
      <rect x="538" y="244" width="34" height="34" rx="3"/>
      <rect x="576" y="244" width="34" height="34" rx="3"/>
    </g>

    <!-- Bottom row: modifiers + spacebar, variable widths -->
    <g stroke-opacity="0.75">
      <rect x="158" y="286" width="46" height="34" rx="3"/>
      <rect x="208" y="286" width="34" height="34" rx="3"/>
      <rect x="246" y="286" width="34" height="34" rx="3"/>
      <rect x="284" y="286" width="214" height="34" rx="3"/>
      <rect x="502" y="286" width="34" height="34" rx="3"/>
      <rect x="540" y="286" width="34" height="34" rx="3"/>
      <rect x="578" y="286" width="46" height="34" rx="3"/>
    </g>

    <!-- Nav cluster: 3 x 2, separated by the TKL gap -->
    <g stroke-opacity="0.75">
      <rect x="650" y="118" width="34" height="34" rx="3"/>
      <rect x="688" y="118" width="34" height="34" rx="3"/>
      <rect x="726" y="118" width="34" height="34" rx="3"/>
      <rect x="650" y="160" width="34" height="34" rx="3"/>
      <rect x="688" y="160" width="34" height="34" rx="3"/>
      <rect x="726" y="160" width="34" height="34" rx="3"/>
    </g>

    <!-- Arrow cluster: inverted-T -->
    <g stroke-opacity="0.75">
      <rect x="688" y="244" width="34" height="34" rx="3"/>
      <rect x="650" y="286" width="34" height="34" rx="3"/>
      <rect x="688" y="286" width="34" height="34" rx="3"/>
      <rect x="726" y="286" width="34" height="34" rx="3"/>
    </g>
