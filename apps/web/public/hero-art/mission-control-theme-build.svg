<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A retro TKL keyboard case with thick bezels and gasket-mount tabs, a dashed leader connecting it to a Kailh Box White click-bar switch cross-section, and a row of tall SA-profile keycap side silhouettes below with one dusty-rose accent cap bearing a tiny star mark, all tied together as a single theme-spotlight build.">
  <title>thock hero — mission control theme build: Class80 TKL, SA Godspeed keycaps, Kailh Box White switches</title>

  <!-- ================================================================
       Canvas:  1200 x 750
       Subject: theme-spotlight build pairing three parts — a retro
                CNC-aluminum TKL case (thick bezels, gasket mount),
                a Kailh Box White click-bar switch cross-section, and
                a row of tall SA-profile keycap side silhouettes in a
                two-tone (outline vs washed-fill) rhythm standing in
                for the steel-blue / cream space-exploration colorway.
       Palette:
         Stroke   oklch(0.78 0.005 90)  warm-grey, 2px
         Splash   oklch(0.64 0.085 14)  dusty rose (click + hero cap)
         Bronze   oklch(0.80 0.135 75)  theme accent (top-right dot)
       Background: transparent (light-mode safe per house style).
  ================================================================ -->

  <!-- Faint wide washes behind the two splash anchors -->
  <ellipse cx="990" cy="248" rx="95" ry="78" fill="oklch(0.64 0.085 14 / 0.06)" stroke="none"/>
  <ellipse cx="505" cy="610" rx="115" ry="95" fill="oklch(0.64 0.085 14 / 0.05)" stroke="none"/>

  <!-- ================================================================
       CASE — retro TKL, thick bezel, gasket mount
       ================================================================ -->
  <g>
    <!-- Outer shell -->
    <rect x="110" y="70" width="700" height="290" rx="24"/>
    <!-- Gasket channel (dashed ring between outer shell and inner bezel) -->
    <rect x="127" y="87" width="666" height="256" rx="18" stroke-dasharray="2 6" stroke-opacity="0.22"/>
    <!-- Thick inner bezel -->
    <rect x="144" y="104" width="632" height="222" rx="12" stroke-opacity="0.45"/>

    <!-- Gasket mount tabs, left and right, mid-height -->
    <rect x="90" y="200" width="20" height="30" rx="4" stroke-dasharray="2 4" stroke-opacity="0.55"/>
    <rect x="800" y="200" width="20" height="30" rx="4" stroke-dasharray="2 4" stroke-opacity="0.55"/>

    <!-- Main field: 12 columns x 4 rows -->
    <g stroke-opacity="0.75">
      <rect x="158" y="118" width="34" height="34" rx="3"/>
      <rect x="196" y="118" width="34" height="34" rx="3"/>
      <rect x="234" y="118" width="34" height="34" rx="3"/>
      <rect x="272" y="118" width="34" height="34" rx="3"/>
      <rect x="310" y="118" width="34" height="34" rx="3"/>
      <rect x="348" y="118" width="34" height="34" rx="3"/>
      <rect x="386" y="118" width="34" height="34" rx="3"/>
      <rect x="424" y="118" width="34" height="34" rx="3"/>
      <rect x="462" y="118" width="34" height="34" rx="3"/>
      <rect x="500" y="118" width="34" height="34" rx="3"/>
      <rect x="538" y="118" width="34" height="34" rx="3"/>
      <rect x="576" y="118" width="34" height="34" rx="3"/>

      <rect x="158" y="160" width="34" height="34" rx="3"/>
      <rect x="196" y="160" width="34" height="34" rx="3"/>
      <rect x="234" y="160" width="34" height="34" rx="3"/>
      <rect x="272" y="160" width="34" height="34" rx="3"/>
      <rect x="310" y="160" width="34" height="34" rx="3"/>
      <rect x="348" y="160" width="34" height="34" rx="3"/>
      <rect x="386" y="160" width="34" height="34" rx="3"/>
      <rect x="424" y="160" width="34" height="34" rx="3"/>
      <rect x="462" y="160" width="34" height="34" rx="3"/>
      <rect x="500" y="160" width="34" height="34" rx="3"/>
      <rect x="538" y="160" width="34" height="34" rx="3"/>
      <rect x="576" y="160" width="34" height="34" rx="3"/>

      <rect x="158" y="202" width="34" height="34" rx="3"/>
      <rect x="196" y="202" width="34" height="34" rx="3"/>
      <rect x="234" y="202" width="34" height="34" rx="3"/>
      <rect x="272" y="202" width="34" height="34" rx="3"/>
      <rect x="310" y="202" width="34" height="34" rx="3"/>
      <rect x="348" y="202" width="34" height="34" rx="3"/>
      <rect x="386" y="202" width="34" height="34" rx="3"/>
      <rect x="424" y="202" width="34" height="34" rx="3"/>
      <rect x="462" y="202" width="34" height="34" rx="3"/>
      <rect x="500" y="202" width="34" height="34" rx="3"/>
      <rect x="538" y="202" width="34" height="34" rx="3"/>
      <rect x="576" y="202" width="34" height="34" rx="3"/>

      <rect x="158" y="244" width="34" height="34" rx="3"/>
      <rect x="196" y="244" width="34" height="34" rx="3"/>
      <rect x="234" y="244" width="34" height="34" rx="3"/>
      <rect x="272" y="244" width="34" height="34" rx="3"/>
