<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A compact 65 percent gasket-mount keyboard case on the left with a dashed o-ring seam at its edge, a row of short Cherry-profile keycap side silhouettes in the center with one cap's top surface divided into a tiny bento-box compartment grid in terracotta, desaturated navy, and pink, and a tactile switch cross-section on the right with sparkly flecks across its polycarbonate housings and a bump marked near the top of the stem's travel, all tied together with one terracotta splash as a single build-of-the-week composition.">
  <title>thock hero — build of the week: Bakeneko65, GMK Bentō R2 keycaps, Tecsee Sapphire V2 switches</title>

  <!-- ================================================================
       Canvas:  1200 x 750
       Subject: build-of-the-week parts pairing — a compact 65% aluminum
                gasket-mount case (Bakeneko65), a Cherry-profile
                doubleshot keycap set in the bento-box colorway
                (GMK Bento R2), and a tactile switch with sparkly
                polycarbonate housings (Tecsee Sapphire V2).
       Palette:
         Stroke   oklch(0.78 0.005 90)  warm-grey, 2px
         Splash   oklch(0.63 0.12 38)   muted terracotta (dominant)
         Navy     oklch(0.34 0.05 255)  desaturated, secondary only
         Pink     oklch(0.75 0.09 350)  soft pink, secondary only
         Bronze   oklch(0.80 0.135 75)  theme accent (top-right dot)
       Background: transparent (light-mode safe per house style).
  ================================================================ -->

  <!-- Faint wide washes behind the two splash anchors -->
  <ellipse cx="497" cy="590" rx="90" ry="72" fill="oklch(0.63 0.12 38 / 0.06)" stroke="none"/>
  <ellipse cx="1000" cy="205" rx="100" ry="80" fill="oklch(0.63 0.12 38 / 0.05)" stroke="none"/>

  <!-- ================================================================
       CASE — Bakeneko65, compact 65 percent, gasket mount
       ================================================================ -->
  <g>
    <!-- Outer shell -->
    <rect x="110" y="70" width="672" height="290" rx="20"/>
    <!-- Gasket channel — dashed o-ring seam between outer shell and inner bezel -->
    <rect x="127" y="87" width="638" height="256" rx="14" stroke-dasharray="2 6" stroke-opacity="0.22"/>
    <!-- Thick inner bezel -->
    <rect x="144" y="104" width="604" height="222" rx="10" stroke-opacity="0.45"/>

    <!-- Gasket mount tabs, left and right, mid-height, with a tiny o-ring cross-section circle in each -->
    <rect x="90" y="200" width="20" height="30" rx="4" stroke-dasharray="2 4" stroke-opacity="0.55"/>
    <circle cx="100" cy="215" r="3" stroke-opacity="0.5"/>
    <rect x="792" y="200" width="20" height="30" rx="4" stroke-dasharray="2 4" stroke-opacity="0.55"/>
    <circle cx="802" cy="215" r="3" stroke-opacity="0.5"/>

    <!-- Main field: 13 columns x 4 rows -->
    <g stroke-opacity="0.75">
      <rect x="158" y="118" width="34" height="34" rx="3"/>
      <rect x="196" y="118" width="34" height="34" rx="3"/>
      <rect x="234" y="118" width="34" height="34" rx="3"/>
      <rect x="272" y="118" width="34" height="34" rx="3"/>
      <rect x="310" y="118" width="34" height="34" rx="3"/>
      <rect x="348" y="118" width="34" height="34" rx="3"/>
      <rect x="386" y="118" width="34" height="34" rx="3"/>
      <rect x="424" y="118" width="34" height="34" rx="3"/>
      <rect x="462" y="118" width="34" height="34" rx="3"/>
      <rect x="500" y="118" width="34" height="34" rx="3"/>
      <rect x="538" y="118" width="34" height="34" rx="3"/>
      <rect x="576" y="118" width="34" height="34" rx="3"/>
      <rect x="614" y="118" width="34" height="34" rx="3"/>

      <rect x="158" y="160" width="34" height="34" rx="3"/>
      <rect x="196" y="160" width="34" height="34" rx="3"/>
      <rect x="234" y="160" width="34" height="34" rx="3"/>
      <rect x="272" y="160" width="34" height="34" rx="3"/>
      <rect x="310" y="160" width="34" height="34" rx="3"/>
      <rect x="348" y="160" width="34" height="34" rx="3"/>
      <rect x="386" y="160" width="34" height="34" rx="3"/>
      <rect x="424" y="160" width="34" height="34" rx="3"/>
      <rect x="462" y="160" width="34" height="34" rx="3"/>
      <rect x="500" y="160" width="34" height="34" rx="3"/>
      <rect x="538" y="160" width="34" height="34" rx="3"/>
      <rect x="576" y="160" width="34" height="34" rx="3"/>
      <rect x="614" y="160" width="34" height="34" rx="3"/>

      <rect x="158" y="202" width="34" height="34" rx="3"/>
      <rect x="196" y="202" width="34" height="34" rx="3"/>
      <rect x="234" y="202" width="34" height="34" rx="3"/>
      <rect x="272" y="202" width="34" height="34" rx="3"/>
      <rect x="310" y="202" width="34" height="34" rx="3"/>
      <rect x="348" y="202" width="34" height="34" rx="3"/>
      <rect x="386" y="202" width="34" height="34" rx="3"/>
      <rect x="424" y="202" width="34" height="34" rx="3"/>
      <rect x="462" y="202" width="34" height="34" rx="3"/>
      <rect x="500" y="202" width="34" height="34" rx="3"/>
      <rect x="538" y="202" width="34" height="34" rx="3"/>
      <rect x="576" y="202" width="34" height="34" rx="3"/>
      <rect x="614" y="202" width="34" height="34" rx="3"/>

      <rect x="158" y="244" width="34" height="34" rx="3"/>
      <rect x="196" y="244" width="34" height="34" rx="3"/>
      <rect x="234" y="244" width="34" height="34" rx="3"/>
      <rect x="272" y="244" width="34" height="34" rx="3"/>
      <rect x="310" y="244" width="34" height="34" rx="3"/>
      <rect x="348" y="244" width="34" height="34" rx="3"/>
      <rect x="386" y="244" width="34" height="34" rx="3"/>
      <rect x="424" y="244" width="34" height="34" rx="3"/>
      <rect x="462" y="244" width="34" height="34" rx="3"/>
      <rect x="500" y="244" width="34" height="34" rx="3"/>
      <rect x="538" y="244" width="34" height="34" rx="3"/>
      <rect x="576" y="244" width="34" height="34" rx="3"/>
      <rect x="614" y="244" width="34" height="34" rx="3"/>
    </g>

    <!-- Bottom row: modifiers + spacebar, variable widths -->
    <g stroke-opacity="0.75">
      <rect x="158" y="286" width="46" height="34" rx="3"/>
      <rect x="208" y="286" width="34" height="34" rx="3"/>
      <rect x="246" y="286" width="34" height="34" rx="3"/>
      <rect x="284" y="286" width="210" height="34" rx="3"/>
      <rect x="498" y="286" width="34" height="34" rx="3"/>
      <rect x="536" y="286" width="34" height="34" rx="3"/>
      <rect x="574" y="286" width="46" height="34" rx="3"/>
    </g>

    <!-- Right nav column — del / pgup / pgdn, stacked, no numpad, no F row -->
    <g stroke-opacity="0.75">
      <rect x="662" y="118" width="34" height="34" rx="3"/>
      <rect x="662" y="160" width="34" height="34" rx="3"/>
      <rect x="662" y="202" width="34" height="34" rx="3"/>
    </g>

    <!-- Arrow cluster: inverted-T, tucked directly under the nav column, no gap -->
    <g stroke-opacity="0.75">
      <rect x="662" y="244" width="34" height="34" rx="3"/>
      <rect x="624" y="286" width="34" height="34" rx="3"/>
      <rect x="662" y="286" width="34" height="34" rx="3"/>
      <rect x="700" y="286" width="34" height="34" rx="3"/>
    </g>
  </g>

  <text x="120" y="382" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="oklch(0.58 0.006 90)" letter-spacing="0.03em" stroke="none">bakeneko65</text>

  <!-- ================================================================
       CHERRY-PROFILE KEYCAP ROW — GMK Bento R2, doubleshot ABS
       ================================================================ -->
  <g>
    <!-- cap 0 — white base, cream wash -->
    <path d="M 150 660 L 150 652 L 164 606 Q 180 596 196 606 L 210 652 L 210 660 Z"
      fill="oklch(0.78 0.005 90 / 0.10)" stroke-opacity="0.75"/>

    <!-- cap 1 — plain base outline -->
    <path d="M 310 660 L 310 652 L 324 606 Q 340 596 356 606 L 370 652 L 370 660 Z"
      stroke-opacity="0.9"/>

    <!-- cap 2 — hero cap, terracotta splash wash -->
    <path d="M 470 660 L 470 652 L 484 606 Q 500 596 516 606 L 530 652 L 530 660 Z"
      fill="oklch(0.63 0.12 38 / 0.14)" stroke="oklch(0.63 0.12 38)" stroke-opacity="0.95"/>
    <!-- bento compartment grid on the hero cap's top surface — doubleshot outer ring
         plus an inner divider, the four cells naming the set's white / dark-blue / pink
         colorway plus the dominant terracotta splash without introducing a fourth hue -->
    <rect x="484" y="580" width="32" height="17" rx="2" stroke="oklch(0.63 0.12 38)" stroke-width="1.6" stroke-opacity="0.95"/>
    <line x1="500" y1="580" x2="500" y2="597" stroke="oklch(0.63 0.12 38)" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="484" y1="588.5" x2="516" y2="588.5" stroke="oklch(0.63 0.12 38)" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="486" y="582" width="12" height="4.5" fill="oklch(0.63 0.12 38)" stroke="none" opacity="0.85"/>
    <rect x="502" y="582" width="12" height="4.5" fill="oklch(0.34 0.05 255)" stroke="none" opacity="0.85"/>
    <rect x="486" y="590.5" width="12" height="4.5" fill="oklch(0.75 0.09 350)" stroke="none" opacity="0.85"/>

    <!-- cap 3 — plain base outline -->
    <path d="M 630 660 L 630 652 L 644 606 Q 660 596 676 606 L 690 652 L 690 660 Z"
      stroke-opacity="0.9"/>

    <!-- cap 4 — white base, cream wash -->
    <path d="M 790 660 L 790 652 L 804 606 Q 820 596 836 606 L 850 652 L 850 660 Z"
      fill="oklch(0.78 0.005 90 / 0.10)" stroke-opacity="0.75"/>

    <!-- cap 5 — plain base outline -->
    <path d="M 950 660 L 950 652 L 964 606 Q 980 596 996 606 L 1010 652 L 1010 660 Z"
      stroke-opacity="0.9"/>

    <!-- desk line under the row -->
    <line x1="130" y1="660" x2="1040" y2="660" stroke-opacity="0.18"/>
  </g>

  <!-- Connector — case bottom row to the hero keycap -->
  <path d="M 397 320 Q 440 430 500 578" stroke="oklch(0.63 0.12 38)" stroke-width="1.4" stroke-dasharray="2 6" stroke-opacity="0.55" fill="none"/>
  <circle cx="397" cy="320" r="3" fill="none" stroke="oklch(0.63 0.12 38)" stroke-opacity="0.8"/>
  <circle cx="500" cy="578" r="3" fill="oklch(0.63 0.12 38)" stroke="none"/>

  <text x="600" y="702" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="oklch(0.58 0.006 90)" letter-spacing="0.03em" text-anchor="middle" stroke="none">gmk bento r2</text>

  <!-- ================================================================
       LEADER — hero cap to switch callout (terracotta)
       ================================================================ -->
  <g stroke="oklch(0.63 0.12 38)" stroke-width="1.6" stroke-dasharray="2 6" stroke-opacity="0.8" fill="none">
    <path d="M 706 128 L 780 128 L 850 165 L 895 188"/>
  </g>
  <circle cx="706" cy="128" r="4" fill="none" stroke="oklch(0.63 0.12 38)" stroke-opacity="0.9"/>
  <path d="M 895 188 L 883 182 M 895 188 L 887 196" stroke="oklch(0.63 0.12 38)" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- ================================================================
       SWITCH CALLOUT — Tecsee Sapphire V2, tactile, sparkly PC/PC housings
       ================================================================ -->
  <g>
    <!-- Top housing — sparkly polycarbonate -->
    <rect x="910" y="150" width="180" height="140" rx="10" stroke-opacity="0.85"/>
    <!-- Cruciform stem aperture -->
    <line x1="990" y1="150" x2="990" y2="164" stroke-opacity="0.55"/>
    <line x1="978" y1="157" x2="1002" y2="157" stroke-opacity="0.55"/>

    <!-- Sparkle flecks scattered across the top housing — the "sparkly PC" texture cue -->
    <g stroke="none">
      <circle cx="928" cy="170" r="1.4" fill="oklch(0.78 0.005 90)" opacity="0.55"/>
      <circle cx="1052" cy="178" r="1.2" fill="oklch(0.78 0.005 90)" opacity="0.45"/>
      <circle cx="945" cy="255" r="1.5" fill="oklch(0.78 0.005 90)" opacity="0.5"/>
      <circle cx="1030" cy="268" r="1.2" fill="oklch(0.78 0.005 90)" opacity="0.4"/>
      <circle cx="960" cy="200" r="1.6" fill="oklch(0.63 0.12 38)" opacity="0.65"/>
      <circle cx="1040" cy="230" r="1.3" fill="oklch(0.63 0.12 38)" opacity="0.55"/>
      <circle cx="1065" cy="255" r="1.3" fill="oklch(0.78 0.005 90)" opacity="0.4"/>
      <circle cx="922" cy="270" r="1.2" fill="oklch(0.78 0.005 90)" opacity="0.45"/>
    </g>

    <!-- Stem, upper segment down to the bump -->
    <line x1="990" y1="164" x2="990" y2="196" stroke-opacity="0.6"/>

    <!-- Tactile bump — positioned near the TOP of the stroke, per spec -->
    <path d="M 990 196 Q 1010 202 1010 214 Q 1010 224 990 228" stroke-opacity="0.85"/>
    <circle cx="1008" cy="212" r="3" fill="oklch(0.63 0.12 38)" stroke="none"/>

    <!-- Stem, lower segment continuing past the bump to the spring -->
    <line x1="990" y1="228" x2="990" y2="300" stroke-opacity="0.5"/>

    <!-- Travel reference ruler along the right margin, tick at the bump's position near the top -->
    <line x1="1096" y1="164" x2="1096" y2="340" stroke-opacity="0.25" stroke-dasharray="2 5"/>
    <line x1="1090" y1="164" x2="1102" y2="164" stroke-opacity="0.4"/>
    <line x1="1090" y1="212" x2="1102" y2="212" stroke="oklch(0.63 0.12 38)" stroke-opacity="0.9"/>
    <line x1="1090" y1="340" x2="1102" y2="340" stroke-opacity="0.4"/>
    <text x="1108" y="216" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
      font-size="11" fill="oklch(0.63 0.12 38)" fill-opacity="0.9" letter-spacing="0.03em" stroke="none">bump</text>

    <!-- Spring -->
    <g stroke-opacity="0.6">
      <ellipse cx="990" cy="345" rx="14" ry="5"/>
      <ellipse cx="990" cy="357" rx="14" ry="5"/>
      <ellipse cx="990" cy="369" rx="14" ry="5"/>
    </g>

    <!-- Bottom housing — sparkly polycarbonate -->
    <rect x="930" y="390" width="120" height="55" rx="8" stroke-opacity="0.85"/>
    <g stroke="none">
      <circle cx="948" cy="408" r="1.3" fill="oklch(0.78 0.005 90)" opacity="0.5"/>
      <circle cx="1028" cy="420" r="1.3" fill="oklch(0.63 0.12 38)" opacity="0.55"/>
      <circle cx="1010" cy="405" r="1.1" fill="oklch(0.78 0.005 90)" opacity="0.4"/>
    </g>

    <!-- PCB pins + strip -->
    <line x1="960" y1="445" x2="960" y2="469" stroke-opacity="0.6"/>
    <line x1="1020" y1="445" x2="1020" y2="469" stroke-opacity="0.6"/>
    <rect x="940" y="469" width="100" height="16" rx="2" stroke-opacity="0.55"/>
  </g>

  <text x="990" y="515" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace"
    font-size="12" fill="oklch(0.58 0.006 90)" letter-spacing="0.03em" text-anchor="middle" stroke="none">tecsee sapphire v2</text>

  <!-- ================================================================
       BRONZE THEME DOT — upper-right ornamental anchor (family convention)
       ================================================================ -->
  <circle cx="1148" cy="70" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
  <circle cx="1132" cy="80" r="2.2" fill="oklch(0.63 0.12 38)" stroke="none" opacity="0.8"/>
</svg>
