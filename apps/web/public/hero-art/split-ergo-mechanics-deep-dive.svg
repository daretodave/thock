<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock hero — split ergo mechanics: top-down silhouette of two tented split keyboard halves angled outward, faint columnar-stagger column lines, the two thumb clusters picked out in dusty rose</title>

  <!-- Dusty-rose splash washes under the two thumb clusters. oklch(0.65 0.08 18)
       is a hair warmer than the damping piece's dusty rose (hue 12) so the two
       rose deep-dives stay distinct in the gallery. -->
  <ellipse cx="435" cy="365" rx="100" ry="48" fill="oklch(0.65 0.08 18 / 0.16)" stroke="none"/>
  <ellipse cx="765" cy="365" rx="100" ry="48" fill="oklch(0.65 0.08 18 / 0.16)" stroke="none"/>

  <!-- ════════════════════════════════════════════════════════════════════════════
       COMPOSITION: two halves seen from above, splayed outward 14 degrees each.
         The left half is authored once in local coordinates (body 300 x 250,
         six columns of three keys with a columnar stagger, a three-key thumb
         cluster fanned off the inner bottom corner) and placed with a rotate.
         The right half is the same geometry mirrored across x 600.
         Tenting is implied two ways: a faint offset rim along each outer edge
         (the raised side) and a small front-elevation glyph below the halves
         showing the two tent planes meeting at the center.
       ════════════════════════════════════════════════════════════════════════════ -->

  <defs>
    <g id="half">
      <!-- Body outline -->
      <path d="
        M 16 0
        L 284 0
        Q 300 0 300 16
        L 300 234
        Q 300 250 284 250
        L 16 250
        Q 0 250 0 234
        L 0 16
        Q 0 0 16 0
        Z" />
      <!-- Raised outer rim, the tented high side -->
      <path d="M 10 -10 L 290 -10" stroke-opacity="0.28"/>
      <path d="M -10 10 L -10 240" stroke-opacity="0.28"/>

      <!-- Column lines, columnar stagger: pinky low, middle high, index low again -->
      <g stroke-opacity="0.2" stroke-dasharray="2 6">
        <line x1="34" y1="8" x2="34" y2="242"/>
        <line x1="80" y1="8" x2="80" y2="242"/>
        <line x1="126" y1="8" x2="126" y2="242"/>
        <line x1="172" y1="8" x2="172" y2="242"/>
        <line x1="218" y1="8" x2="218" y2="242"/>
        <line x1="264" y1="8" x2="264" y2="242"/>
      </g>

      <!-- Keys. Column offsets: 36, 24, 8, 0, 10, 24 -->
      <g stroke-opacity="0.85">
        <rect x="14" y="50" width="40" height="40" rx="4"/>
        <rect x="14" y="96" width="40" height="40" rx="4"/>
        <rect x="14" y="142" width="40" height="40" rx="4"/>

        <rect x="60" y="38" width="40" height="40" rx="4"/>
        <rect x="60" y="84" width="40" height="40" rx="4"/>
        <rect x="60" y="130" width="40" height="40" rx="4"/>

        <rect x="106" y="22" width="40" height="40" rx="4"/>
        <rect x="106" y="68" width="40" height="40" rx="4"/>
        <rect x="106" y="114" width="40" height="40" rx="4"/>

        <rect x="152" y="14" width="40" height="40" rx="4"/>
        <rect x="152" y="60" width="40" height="40" rx="4"/>
        <rect x="152" y="106" width="40" height="40" rx="4"/>

        <rect x="198" y="24" width="40" height="40" rx="4"/>
        <rect x="198" y="70" width="40" height="40" rx="4"/>
        <rect x="198" y="116" width="40" height="40" rx="4"/>

        <rect x="244" y="38" width="40" height="40" rx="4"/>
        <rect x="244" y="84" width="40" height="40" rx="4"/>
        <rect x="244" y="130" width="40" height="40" rx="4"/>
      </g>

      <!-- Stagger trace across the home row -->
      <path d="M 34 116 L 80 104 L 126 88 L 172 80 L 218 90 L 264 104" stroke-opacity="0.3" stroke-dasharray="3 4"/>

      <!-- Thumb cluster, fanned off the inner bottom corner -->
      <g transform="translate(206 212) rotate(18)">
        <path d="
          M 4 -8
          L 148 -8
          Q 158 -8 158 2
          L 158 46
          Q 158 56 148 56
          L 4 56
          Q -6 56 -6 46
          L -6 2
          Q -6 -8 4 -8
          Z" stroke="oklch(0.65 0.08 18)" stroke-opacity="0.7"/>
        <g fill="oklch(0.65 0.08 18 / 0.32)" stroke="oklch(0.65 0.08 18)">
          <rect x="6" y="4" width="40" height="40" rx="4"/>
          <rect x="52" y="4" width="40" height="40" rx="4"/>
          <rect x="98" y="4" width="40" height="40" rx="4"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- Left half: rotated outward (counterclockwise) -->
  <g transform="translate(110 180) rotate(-14)">
    <use href="#half"/>
  </g>
  <!-- Right half: the same geometry mirrored across x 600 -->
  <g transform="translate(1200 0) scale(-1 1)">
    <g transform="translate(110 180) rotate(-14)">
      <use href="#half"/>
    </g>
  </g>

  <!-- Centerline between the halves -->
  <line x1="600" y1="120" x2="600" y2="470" stroke-dasharray="4 8" stroke-opacity="0.25"/>

  <!-- Focal anchor on the left thumb cluster -->
  <circle cx="477" cy="368" r="6.5" fill="oklch(0.65 0.08 18 / 0.95)" stroke="oklch(0.65 0.08 18)"/>
  <circle cx="477" cy="368" r="12" stroke="oklch(0.65 0.08 18)" stroke-opacity="0.5"/>

  <!-- ══ TENT GLYPH, front elevation ══ -->
  <g transform="translate(600 600)">
    <!-- Desk line -->
    <line x1="-260" y1="24" x2="260" y2="24" stroke-opacity="0.35"/>
    <!-- Two tent planes: outer edges on the desk, inner (thumb) edges raised -->
    <path d="M -240 24 L -60 -22" />
    <path d="M 240 24 L 60 -22" />
    <!-- Tenting legs under the raised inner edges -->
    <line x1="-60" y1="-22" x2="-60" y2="24" stroke-opacity="0.4"/>
    <line x1="60" y1="-22" x2="60" y2="24" stroke-opacity="0.4"/>
    <!-- Tent angle arc at the right outer foot -->
    <path d="M 200 24 A 40 40 0 0 1 201 14" stroke-opacity="0.45"/>
    <!-- Thumb cluster echo at the raised inner edges -->
    <circle cx="-72" cy="-16" r="3" fill="oklch(0.65 0.08 18)" stroke="oklch(0.65 0.08 18)"/>
    <circle cx="72" cy="-16" r="3" fill="oklch(0.65 0.08 18)" stroke="oklch(0.65 0.08 18)"/>
  </g>

  <!-- ══ LEFT MARGIN TIER TICKS ══ -->
  <g stroke-opacity="0.28">
    <line x1="60" y1="180" x2="72" y2="180"/>
    <line x1="60" y1="368" x2="72" y2="368"/>
    <line x1="60" y1="604" x2="72" y2="604"/>
  </g>
  <line x1="66" y1="180" x2="66" y2="604" stroke-opacity="0.14" stroke-dasharray="2 6"/>

  <!-- ══ LABELS ══ -->
  <text x="110" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" stroke="none" letter-spacing="0.05em">LEFT HALF · SPLAYED OUTWARD</text>
  <text x="890" y="96" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" stroke="none" letter-spacing="0.05em">RIGHT HALF</text>
  <text x="476" y="452" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.65 0.08 18)" fill-opacity="0.85" stroke="none" letter-spacing="0.05em">THUMB CLUSTERS</text>
  <text x="92" y="300" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" stroke="none" letter-spacing="0.05em" transform="rotate(-90 92 300)">COLUMNAR STAGGER</text>
  <text x="858" y="612" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" stroke="none" letter-spacing="0.05em">TENT ANGLE</text>
  <text x="310" y="568" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" fill-opacity="0.5" stroke="none" letter-spacing="0.05em">FRONT VIEW · TENTED</text>

  <!-- ══ JetBrains Mono technical value ══ -->
  <text x="110" y="738" font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="oklch(0.78 0.005 90)" fill-opacity="0.38" stroke="none" letter-spacing="0.03em">SPLIT ERGO — SPLAY, COLUMNAR STAGGER, TENTING, THUMB CLUSTERS: FOUR MECHANICS, ONE POSTURE</text>

  <!-- ══ BRONZE THEME DOT, upper-right margin ══ -->
  <circle cx="1148" cy="92" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
