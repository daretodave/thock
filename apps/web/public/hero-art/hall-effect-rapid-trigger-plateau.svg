<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock hero — Hall-effect/rapid-trigger tracker sparkline climbing hard through July then flattening at its ceiling (score 97)</title>

  <!-- Terracotta wash beneath the plateau segment, signaling the flattened-at-ceiling region -->
  <ellipse cx="985" cy="270" rx="260" ry="140" fill="oklch(0.62 0.12 45 / 0.10)" stroke="none"/>

  <!-- Ceiling reference line: dashed, warm-grey, sits just above the plateau -->
  <line x1="110" y1="200" x2="1090" y2="200" stroke-dasharray="4 5" stroke-opacity="0.4"/>
  <line x1="110" y1="192" x2="110" y2="208" stroke-opacity="0.4"/>
  <line x1="1090" y1="192" x2="1090" y2="208" stroke-opacity="0.4"/>

  <!-- Baseline axis with per-point tick marks (chart-silhouette convention) -->
  <line x1="110" y1="660" x2="1090" y2="660" stroke-opacity="0.3"/>
  <g stroke-opacity="0.3">
    <line x1="150"  y1="655" x2="150"  y2="665"/>
    <line x1="279"  y1="655" x2="279"  y2="665"/>
    <line x1="407"  y1="655" x2="407"  y2="665"/>
    <line x1="536"  y1="655" x2="536"  y2="665"/>
    <line x1="664"  y1="655" x2="664"  y2="665"/>
    <line x1="793"  y1="655" x2="793"  y2="665"/>
    <line x1="921"  y1="655" x2="921"  y2="665"/>
    <line x1="1050" y1="655" x2="1050" y2="665"/>
  </g>

  <!-- Sparkline: 8 weekly tracker points climbing hard through July, then flattening at the ceiling -->
  <!-- Points map score 82,85,87,91,94,95,97,97 across a 75-100 domain -->
  <polyline
    points="150,502 279,452 407,418 536,351 664,301 793,284 921,250 1050,250"
    stroke="oklch(0.62 0.12 45)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Data point dots along the climb -->
  <circle cx="150" cy="502" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="279" cy="452" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="407" cy="418" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="536" cy="351" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="664" cy="301" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="793" cy="284" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="921" cy="250" r="5" fill="oklch(0.62 0.12 45)" stroke="none"/>

  <!-- Focal dot: the plateau's anchor point, latest week held flat at score 97 -->
  <circle cx="1050" cy="250" r="9" fill="oklch(0.62 0.12 45)" stroke="none"/>
  <circle cx="1050" cy="250" r="17" fill="none" stroke="oklch(0.62 0.12 45)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Bronze theme dot: upper-right ornamental anchor -->
  <circle cx="1132" cy="60" r="7" fill="oklch(0.80 0.135 75)" stroke="none" opacity="0.9"/>
</svg>
