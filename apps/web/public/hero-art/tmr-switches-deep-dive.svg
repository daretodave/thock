<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock hero — TMR switch cross-section: stem-mounted magnet over a layered tunnel-magnetoresistance sensor stack on the PCB, with electrons shown tunneling through the ultra-thin insulating barrier layer rather than a field arcing through open space</title>

  <!-- ================================================================
       Canvas:  1200 x 750
       Subject: magnet-and-sensor cross-section, focused on the sensing
                layer (not spring/stem mechanics). Companion piece to
                magnetic-switches-deep-dive.svg (Hall-effect sibling);
                this piece swaps that piece's field-arc motif for a
                layered tunnel-junction stack with tunneling electrons,
                since TMR's sensitivity story is about a stacked thin-
                film sensor reading flux through a barrier, not a coil
                reading a field arcing through open air.
       Palette:
         Stroke   oklch(0.78 0.005 90)  warm-grey, 2px (housing, PCB)
         Splash   oklch(0.70 0.15 24)   coral (magnet, TMR stack,
                                         tunneling glyphs, focal anchor)
         Bronze   oklch(0.80 0.135 75)  theme accent (top-right only)
       Background: transparent (light-mode safe per house style).
       Splash hue note: coral hue 24, chosen to sit clear of this
       piece's two closest siblings in the corpus: the Hall-effect
       deep-dive magnetic-switches-deep-dive.svg (muted terracotta,
       hue 45) and the two other TMR-adjacent pieces already in the
       gallery, keychron-q16-he-8k-ceramic-tmr.svg (ochre, hue 85) and
       cherry-xtrfy-tmr-pivot.svg (muted terracotta, hue 40). Coral is
       unused across all three, keeping this piece visually distinct.
  ================================================================ -->

  <!-- Coral wash behind the magnet / sensor-stack interface, the
       piece's focal region; the article's claim is that sensitivity
       lives entirely in that thin stack, not in open-field geometry. -->
  <ellipse cx="460" cy="520" rx="230" ry="80" fill="oklch(0.70 0.15 24 / 0.14)" stroke="none"/>

  <!-- ================================================================
       SWITCH HOUSING, MX-style trapezoidal silhouette, profile cut-
       away. Deliberately plainer than a full mechanical deep-dive
       (no LED notch, no clip-nub detail) since this article is about
       the sensing layer, not housing mechanics.
  ================================================================ -->

  <!-- Top housing (stem-mount face) -->
  <g>
    <path d="
      M 340 190
      L 580 190
      L 598 318
      L 322 318
      Z" />
    <path d="
      M 354 204
      L 566 204
      L 582 312
      L 338 312
      Z" stroke-opacity="0.4"/>
    <!-- Cruciform stem aperture -->
    <path d="
      M 432 190
      L 488 190
      L 492 200
      L 478 200
      L 478 209
      L 462 209
      L 462 200
      L 458 200
      L 458 209
      L 442 209
      L 442 200
      L 428 200
      Z" stroke-opacity="0.7"/>
  </g>

  <!-- Bottom housing -->
  <g>
    <path d="
      M 322 326
      L 598 326
      L 580 462
      L 340 462
      Z" />
    <path d="
      M 338 340
      L 582 340
      L 566 452
      L 354 452
      Z" stroke-opacity="0.4"/>
    <line x1="382" y1="462" x2="382" y2="482" stroke-opacity="0.6"/>
    <line x1="538" y1="462" x2="538" y2="482" stroke-opacity="0.6"/>
    <line x1="460" y1="462" x2="460" y2="480" stroke-opacity="0.45"/>
  </g>

  <!-- ================================================================
       STEM + SPRING + MAGNET, the moving assembly. The magnet sits on
       the stem's underside; as the key presses, it moves closer to
       the sensor stack below, changing the flux the stack reads.
  ================================================================ -->

  <!-- Stem -->
  <g>
    <path d="
      M 442 209
      L 478 209
      L 478 221
      L 488 221
      L 488 233
      L 432 233
      L 432 221
      L 442 221
      Z" />
    <path d="
      M 442 233
      L 478 233
      L 478 364
      L 442 364
      Z" />
    <line x1="460" y1="241" x2="460" y2="360" stroke-opacity="0.4" stroke-dasharray="2 4"/>
  </g>

  <!-- Spring, compression coil, family convention -->
  <g>
    <ellipse cx="460" cy="378" rx="26" ry="5" stroke-opacity="0.7"/>
    <ellipse cx="460" cy="388" rx="26" ry="5" stroke-opacity="0.7"/>
    <ellipse cx="460" cy="398" rx="26" ry="5" stroke-opacity="0.7"/>
    <ellipse cx="460" cy="408" rx="26" ry="5" stroke-opacity="0.7"/>
    <line x1="460" y1="374" x2="460" y2="414" stroke-opacity="0.3" stroke-dasharray="2 4"/>
  </g>

  <!-- Magnet, mounted on stem underside, coral, N/S split -->
  <g>
    <rect x="438" y="364" width="44" height="22" fill="oklch(0.70 0.15 24 / 0.18)" stroke="oklch(0.70 0.15 24)" stroke-width="2"/>
    <line x1="438" y1="375" x2="482" y2="375" stroke="oklch(0.70 0.15 24)" stroke-opacity="0.65"/>
    <g stroke="oklch(0.70 0.15 24)" stroke-opacity="0.9" stroke-width="1.4">
      <path d="M 456 368 L 456 372 M 456 368 L 460 372 M 460 368 L 460 372"/>
      <path d="M 462 379 C 461 378, 459 378, 458 379 C 457 380, 458 381, 460 381 C 462 381, 463 382, 462 383 C 461 384, 459 384, 458 383"/>
    </g>
  </g>

  <!-- Small sensing-gap bracket between magnet and sensor stack, calling
       out that TMR reads a usable signal across a narrower gap than a
       Hall pad needs, which is the article's sensitivity claim. -->
  <g stroke-opacity="0.55">
    <line x1="500" y1="386" x2="500" y2="470" stroke-dasharray="3 4"/>
    <line x1="493" y1="386" x2="507" y2="386"/>
    <line x1="493" y1="470" x2="507" y2="470"/>
  </g>

  <!-- ================================================================
       PCB + TMR SENSOR STACK
       A slim PCB substrate below the switch. The sensor itself is
       drawn as a layered thin-film stack rather than a single pad,
       the structural idea the whole piece hinges on: a pinned
       ferromagnetic layer, an ultra-thin insulating tunnel barrier,
       and a free ferromagnetic layer whose moment rotates with the
       magnet's field, changing the tunneling current through the
       barrier.
  ================================================================ -->
  <g>
    <!-- PCB substrate -->
    <line x1="220" y1="500" x2="780" y2="500"/>
    <line x1="220" y1="500" x2="220" y2="518" stroke-opacity="0.55"/>
    <line x1="780" y1="500" x2="780" y2="518" stroke-opacity="0.55"/>
    <line x1="220" y1="518" x2="780" y2="518" stroke-opacity="0.55"/>
    <line x1="230" y1="509" x2="770" y2="509" stroke-opacity="0.22" stroke-dasharray="2 6"/>

    <!-- TMR stack, three thin stacked layers directly beneath the
         magnet: free layer (top), tunnel barrier (middle, finest),
         pinned layer (bottom). Coral so it reads as the active
         sense element, same convention as the Hall pad in the
         sibling piece but structurally distinct. -->
    <g>
      <rect x="436" y="470" width="48" height="7" fill="oklch(0.70 0.15 24 / 0.75)" stroke="oklch(0.70 0.15 24)"/>
      <rect x="436" y="477" width="48" height="3" fill="oklch(0.70 0.15 24 / 0.95)" stroke="oklch(0.70 0.15 24)" stroke-width="1"/>
      <rect x="436" y="480" width="48" height="7" fill="oklch(0.70 0.15 24 / 0.55)" stroke="oklch(0.70 0.15 24)"/>
    </g>

    <!-- Tunneling glyphs, small coral dots with short vertical arrows
         threading straight through the barrier layer rather than
         arcing around it, the family's visual swap for this piece. -->
    <g stroke="oklch(0.70 0.15 24)" stroke-opacity="0.85" stroke-width="1.4">
      <circle cx="446" cy="474" r="1.6" fill="oklch(0.70 0.15 24)" stroke="none"/>
      <path d="M 446 474 L 446 484" stroke-dasharray="1.5 2"/>
      <path d="M 446 484 L 443 481 M 446 484 L 449 481"/>

      <circle cx="460" cy="473" r="1.6" fill="oklch(0.70 0.15 24)" stroke="none"/>
      <path d="M 460 473 L 460 485" stroke-dasharray="1.5 2"/>
      <path d="M 460 485 L 457 482 M 460 485 L 463 482"/>

      <circle cx="474" cy="474" r="1.6" fill="oklch(0.70 0.15 24)" stroke="none"/>
      <path d="M 474 474 L 474 484" stroke-dasharray="1.5 2"/>
      <path d="M 474 484 L 471 481 M 474 484 L 477 481"/>
    </g>

    <!-- Pin leads into the substrate -->
    <line x1="445" y1="487" x2="445" y2="500" stroke="oklch(0.70 0.15 24)" stroke-opacity="0.6"/>
    <line x1="460" y1="487" x2="460" y2="500" stroke="oklch(0.70 0.15 24)" stroke-opacity="0.6"/>
    <line x1="475" y1="487" x2="475" y2="500" stroke="oklch(0.70 0.15 24)" stroke-opacity="0.6"/>

    <!-- Sense traces leaving the stack toward the controller -->
    <g stroke-opacity="0.5">
      <line x1="484" y1="495" x2="540" y2="495"/>
      <line x1="540" y1="495" x2="540" y2="524"/>
      <line x1="540" y1="524" x2="640" y2="524"/>
      <line x1="436" y1="495" x2="380" y2="495"/>
      <line x1="380" y1="495" x2="380" y2="524"/>
      <line x1="380" y1="524" x2="280" y2="524"/>
    </g>
  </g>

  <!-- ================================================================
       MAGNIFIED CALLOUT, a small zoomed ring on the stack with a
       dashed leader to an enlarged stack diagram in the open right
       third of the canvas, naming the three layers implicitly by
       position (no text per house style, structure carries it).
  ================================================================ -->
  <g stroke-opacity="0.5">
    <circle cx="460" cy="480" r="30" stroke-dasharray="3 4"/>
    <path d="M 486 462 C 600 400, 740 380, 820 360" stroke-dasharray="3 4"/>
  </g>

  <g transform="translate(820,260)">
    <circle r="86" stroke-opacity="0.3"/>
    <rect x="-56" y="-14" width="112" height="16" fill="oklch(0.70 0.15 24 / 0.75)" stroke="oklch(0.70 0.15 24)"/>
    <rect x="-56" y="2" width="112" height="7" fill="oklch(0.70 0.15 24 / 0.95)" stroke="oklch(0.70 0.15 24)" stroke-width="1"/>
    <rect x="-56" y="9" width="112" height="16" fill="oklch(0.70 0.15 24 / 0.55)" stroke="oklch(0.70 0.15 24)"/>
    <g stroke="oklch(0.70 0.15 24)" stroke-opacity="0.9" stroke-width="1.6">
      <path d="M -34 -14 L -34 25" stroke-dasharray="2 3"/>
      <path d="M -34 25 L -37 21 M -34 25 L -31 21"/>
      <path d="M 0 -14 L 0 25" stroke-dasharray="2 3"/>
      <path d="M 0 25 L -3 21 M 0 25 L 3 21"/>
      <path d="M 34 -14 L 34 25" stroke-dasharray="2 3"/>
      <path d="M 34 25 L 31 21 M 34 25 L 37 21"/>
    </g>
    <!-- Tier ticks on the magnified view's left margin, naming the
         three layers by position: free (top), barrier (middle,
         thinnest), pinned (bottom). -->
    <g stroke-opacity="0.4">
      <line x1="-70" y1="-6" x2="-62" y2="-6"/>
      <line x1="-70" y1="5" x2="-62" y2="5"/>
      <line x1="-70" y1="17" x2="-62" y2="17"/>
    </g>
  </g>

  <!-- Focal anchor, splash dot + ring at the magnet/sensor interface,
       family convention across the deep-dives hero set. -->
  <circle cx="460" cy="440" r="6.5" fill="oklch(0.70 0.15 24 / 0.95)" stroke="oklch(0.70 0.15 24)"/>
  <circle cx="460" cy="440" r="13" stroke="oklch(0.70 0.15 24)" stroke-opacity="0.5" fill="none"/>

  <!-- Didactic tier ticks on the left margin, family convention. -->
  <g stroke-opacity="0.3">
    <line x1="160" y1="221" x2="170" y2="221"/>
    <line x1="160" y1="298" x2="170" y2="298"/>
    <line x1="160" y1="375" x2="170" y2="375"/>
    <line x1="160" y1="495" x2="170" y2="495"/>
  </g>

  <!-- Brass-bronze theme dot, family-conventional ornamental anchor,
       top-right margin. Matches every other deep-dives hero. -->
  <circle cx="1148" cy="92" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
