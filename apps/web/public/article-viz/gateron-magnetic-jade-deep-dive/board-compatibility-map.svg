<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Two-column fit map. Wooting 60HE on the left accepts the KS-20 family — KS-20 White, KS-20 Orange, Magnetic Jade, Magnetic Jade Pro — marked with coral ticks. Keychron Q1 HE on the right accepts the KS-37 family — Gateron Double-Rail Magnetic and Jade Mini E. Warm-red crossed lines mark Magnetic Jade as not supported in the Keychron column and the KS-37 series as not compatible with the Wooting column</title>

  <!-- Title -->
  <text x="600" y="44" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Same brand, same colour, two magnet families</text>

  <!-- Left column: Wooting 60HE / KS-20 family -->
  <rect x="70" y="86" width="470" height="330" rx="12" fill="oklch(0.78 0.005 90 / 0.04)" stroke-opacity="0.6"/>
  <text x="305" y="122" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">Wooting 60HE</text>
  <text x="305" y="144" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">KS-20 family</text>
  <line x1="100" y1="160" x2="510" y2="160" stroke-opacity="0.3"/>

  <!-- Left list with coral ticks -->
  <path d="M 118 204 L 127 213 L 143 195" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="162" y="210" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none">KS-20 White</text>
  <path d="M 118 250 L 127 259 L 143 241" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="162" y="256" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none">KS-20 Orange</text>
  <path d="M 118 296 L 127 305 L 143 287" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="162" y="302" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="oklch(0.68 0.165 28)" stroke="none">Magnetic Jade (KS-20T)</text>
  <path d="M 118 342 L 127 351 L 143 333" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="162" y="348" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none">Magnetic Jade Pro</text>
  <text x="305" y="394" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">tested fits per the 60HE compatibility guide</text>

  <!-- Right column: Keychron Q1 HE / KS-37 family -->
  <rect x="660" y="86" width="470" height="330" rx="12" fill="oklch(0.78 0.005 90 / 0.04)" stroke-opacity="0.6"/>
  <text x="895" y="122" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">Keychron Q1 HE</text>
  <text x="895" y="144" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">KS-37 family</text>
  <line x1="690" y1="160" x2="1100" y2="160" stroke-opacity="0.3"/>

  <!-- Right list with coral ticks -->
  <path d="M 708 204 L 717 213 L 733 195" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="752" y="210" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none">Gateron Double-Rail Magnetic (stock)</text>
  <path d="M 708 250 L 717 259 L 733 241" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="752" y="256" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none">Jade Mini E</text>
  <text x="752" y="278" font-family="Newsreader, serif" font-size="12" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">dual rail, north pole to LED</text>

  <!-- Not-supported: Magnetic Jade -> Keychron column (warm-red) -->
  <path d="M 540 300 L 660 300" stroke="oklch(0.62 0.13 25)" stroke-dasharray="6 5"/>
  <path d="M 588 288 L 612 312 M 612 288 L 588 312" stroke="oklch(0.62 0.13 25)" stroke-width="3"/>
  <text x="600" y="336" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle">Magnetic Jade: not supported</text>
  <text x="600" y="352" font-family="Newsreader, serif" font-size="12" font-style="italic" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle" opacity="0.85">per Keychron's Q1 HE listing</text>

  <!-- Not-compatible: KS-37 series -> Wooting column (warm-red) -->
  <path d="M 660 204 L 540 204" stroke="oklch(0.62 0.13 25)" stroke-dasharray="6 5"/>
  <path d="M 588 192 L 612 216 M 612 192 L 588 216" stroke="oklch(0.62 0.13 25)" stroke-width="3"/>
  <text x="600" y="240" font-family="IBM Plex Sans, sans-serif" font-size="12" font-weight="600" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle">KS-37 series: not compatible</text>
  <text x="600" y="256" font-family="Newsreader, serif" font-size="12" font-style="italic" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle" opacity="0.85">with Wooting's PCB</text>

  <!-- Footnote -->
  <text x="600" y="462" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">match the family code before matching the colour</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
