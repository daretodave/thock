<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Matrix comparing full-size, TKL, 75%, 65%, and 60% keyboard layouts across numpad, function row, navigation cluster, arrow cluster, and approximate key count</title>

  <!-- Column headers -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75" letter-spacing="0.04em">
    <text x="40" y="46">SIZE</text>
    <text x="330" y="46" text-anchor="middle">NUMPAD</text>
    <text x="490" y="46" text-anchor="middle">FUNCTION ROW</text>
    <text x="660" y="46" text-anchor="middle">NAV CLUSTER</text>
    <text x="820" y="46" text-anchor="middle">ARROWS</text>
    <text x="1000" y="46" text-anchor="middle">KEY COUNT</text>
  </g>
  <line x1="20" y1="60" x2="1180" y2="60" stroke-opacity="0.3"/>

  <!-- Row dividers -->
  <g stroke-opacity="0.15" stroke-dasharray="3 7">
    <line x1="20" y1="140" x2="1180" y2="140"/>
    <line x1="20" y1="220" x2="1180" y2="220"/>
    <line x1="20" y1="300" x2="1180" y2="300"/>
    <line x1="20" y1="380" x2="1180" y2="380"/>
  </g>

  <!-- ══ ROW 1: FULL-SIZE ══════════════════════════════════════════ -->
  <text x="40" y="105" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">Full-size</text>
  <circle cx="330" cy="98" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <circle cx="490" cy="98" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <circle cx="660" cy="98" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <circle cx="820" cy="98" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="1000" y="103" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">~104</text>

  <!-- ══ ROW 2: TKL ═════════════════════════════════════════════════ -->
  <text x="40" y="185" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">TKL</text>
  <circle cx="330" cy="178" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="490" cy="178" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <circle cx="660" cy="178" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <circle cx="820" cy="178" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="1000" y="183" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">~87</text>

  <!-- ══ ROW 3: 75% ═════════════════════════════════════════════════ -->
  <text x="40" y="265" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">75%</text>
  <circle cx="330" cy="258" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="490" cy="258" r="8" fill="oklch(0.78 0.10 80)" fill-opacity="0.55" stroke="oklch(0.78 0.10 80)"/>
  <circle cx="660" cy="258" r="8" fill="oklch(0.78 0.10 80)" fill-opacity="0.55" stroke="oklch(0.78 0.10 80)"/>
  <circle cx="820" cy="258" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="1000" y="263" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">~80&#8211;84</text>

  <!-- ══ ROW 4: 65% ═════════════════════════════════════════════════ -->
  <text x="40" y="345" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">65%</text>
  <circle cx="330" cy="338" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="490" cy="338" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="660" cy="338" r="8" fill="oklch(0.78 0.10 80)" fill-opacity="0.55" stroke="oklch(0.78 0.10 80)"/>
  <circle cx="820" cy="338" r="8" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="1000" y="343" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">~66&#8211;68</text>

  <!-- ══ ROW 5: 60% ═════════════════════════════════════════════════ -->
  <text x="40" y="425" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.10 80)" stroke="none" font-weight="600">60%</text>
  <circle cx="330" cy="418" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="490" cy="418" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="660" cy="418" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <circle cx="820" cy="418" r="8" stroke-dasharray="3 4" stroke-opacity="0.6"/>
  <text x="1000" y="423" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">~61</text>

  <!-- Legend -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">
    <circle cx="44" cy="470" r="6" fill="oklch(0.78 0.10 80)" stroke="none"/>
    <text x="58" y="474">dedicated key</text>
    <circle cx="200" cy="470" r="6" fill="oklch(0.78 0.10 80)" fill-opacity="0.55" stroke="oklch(0.78 0.10 80)"/>
    <text x="214" y="474">partial cluster</text>
    <circle cx="370" cy="470" r="6" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    <text x="384" y="474">removed, layer-only</text>
  </g>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="30" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
