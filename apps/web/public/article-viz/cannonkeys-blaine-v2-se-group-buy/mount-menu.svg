<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>The Blaine V2: SE's three included mount hardware options — top mount, single-sided gasket, and o-ring — one kit built three different ways</title>

  <!-- Title -->
  <text x="600" y="48" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="19" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.90">one kit, three mount hardware options in the box</text>

  <!-- Top mount card -->
  <g>
    <rect x="100" y="120" width="300" height="230" rx="10" stroke-opacity="0.55"/>
    <text x="250" y="153" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">firmer · more direct</text>
    <text x="250" y="188" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">top mount</text>
    <!-- Mini cross-section: plate screwed direct to top case -->
    <g stroke-opacity="0.65">
      <rect x="150" y="230" width="200" height="14"/>
      <line x1="170" y1="244" x2="170" y2="264"/>
      <line x1="250" y1="244" x2="250" y2="264"/>
      <line x1="330" y1="244" x2="330" y2="264"/>
      <rect x="150" y="270" width="200" height="14"/>
    </g>
    <text x="250" y="320" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">rigid plate perimeter,</text>
    <text x="250" y="336" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">screwed to top case</text>
  </g>

  <!-- Single-sided gasket card (highlighted — the hybrid) -->
  <g>
    <rect x="450" y="120" width="300" height="230" rx="10" fill="oklch(0.68 0.165 28 / 0.10)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="3"/>
    <text x="600" y="153" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">the hybrid middle</text>
    <text x="600" y="188" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">single-sided gasket</text>
    <!-- Mini cross-section: compliant top, rigid bottom -->
    <g>
      <rect x="500" y="230" width="200" height="14" stroke-opacity="0.65"/>
      <circle cx="520" cy="254" r="4" fill="oklch(0.68 0.165 28 / 0.3)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="1.5"/>
      <circle cx="600" cy="254" r="4" fill="oklch(0.68 0.165 28 / 0.3)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="1.5"/>
      <circle cx="680" cy="254" r="4" fill="oklch(0.68 0.165 28 / 0.3)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="1.5"/>
      <line x1="520" y1="264" x2="520" y2="270" stroke-opacity="0.65"/>
      <line x1="680" y1="264" x2="680" y2="270" stroke-opacity="0.65"/>
      <rect x="500" y="270" width="200" height="14" stroke-opacity="0.65"/>
    </g>
    <text x="600" y="320" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">compliant top, rigid</text>
    <text x="600" y="336" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">bottom, PCB floats</text>
  </g>

  <!-- O-ring card -->
  <g>
    <rect x="800" y="120" width="300" height="230" rx="10" stroke-opacity="0.55"/>
    <text x="950" y="153" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">softest · most cushioned</text>
    <text x="950" y="188" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">o-ring</text>
    <!-- Mini cross-section: continuous ring, no screws -->
    <g stroke-opacity="0.65">
      <rect x="850" y="230" width="200" height="14"/>
      <path d="M 860 254 Q 950 246 1040 254" stroke-dasharray="3 4"/>
      <rect x="850" y="270" width="200" height="14"/>
    </g>
    <text x="950" y="320" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">continuous dampening ring,</text>
    <text x="950" y="336" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">no screws touch the plate</text>
  </g>

  <!-- Feel spectrum arrow -->
  <line x1="150" y1="400" x2="1050" y2="400" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.55" stroke-width="1.5"/>
    </marker>
  </defs>
  <text x="150" y="424" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" opacity="0.5">top mount — firmer</text>
  <text x="1050" y="424" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.5">o-ring — softer</text>

  <!-- Caption -->
  <text x="600" y="465" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">one purchase, three builds — the buyer decides the feel</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="38" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
