<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Cross-section comparison of a soldered switch joint versus a hot-swap socket joint on the same PCB footprint</title>

  <text x="600" y="60" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">same electrical job, two different bonds</text>

  <!-- ============ LEFT PANEL — soldered ============ -->
  <text x="300" y="100" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">soldered</text>

  <!-- PCB left -->
  <rect x="140" y="330" width="320" height="26" stroke-opacity="0.85" fill="oklch(0.78 0.005 90 / 0.05)"/>
  <text x="90" y="347" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.6">PCB</text>

  <!-- Through-hole -->
  <rect x="286" y="330" width="10" height="26" stroke-opacity="0.5"/>
  <rect x="304" y="330" width="10" height="26" stroke-opacity="0.5"/>

  <!-- Solder fillet, coral -->
  <path d="M 280 330 Q 291 316 302 330" fill="none" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <path d="M 298 330 Q 309 316 320 330" fill="none" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>

  <!-- Switch legs left -->
  <line x1="291" y1="230" x2="291" y2="330" stroke-width="2.5"/>
  <line x1="309" y1="230" x2="309" y2="330" stroke-width="2.5"/>

  <!-- Switch housing left -->
  <rect x="240" y="150" width="120" height="80" rx="8" stroke-width="2.5"/>
  <text x="300" y="143" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">switch</text>

  <!-- Fused / permanent label -->
  <line x1="330" y1="330" x2="370" y2="330" stroke="oklch(0.68 0.165 28)" stroke-width="1.5"/>
  <text x="374" y="325" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none">fused</text>
  <text x="374" y="341" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.8">permanent — no removal</text>

  <!-- ============ DIVIDER ============ -->
  <line x1="600" y1="90" x2="600" y2="420" stroke-opacity="0.18" stroke-dasharray="6 4"/>

  <!-- ============ RIGHT PANEL — hot-swap ============ -->
  <text x="900" y="100" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">hot-swap</text>

  <!-- PCB right -->
  <rect x="740" y="360" width="320" height="26" stroke-opacity="0.85" fill="oklch(0.78 0.005 90 / 0.05)"/>
  <text x="1112" y="377" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" opacity="0.6">PCB</text>

  <!-- Socket receptacle body, coral outline -->
  <rect x="866" y="326" width="68" height="40" rx="5" stroke="oklch(0.68 0.165 28)" stroke-width="2.5"/>
  <text x="900" y="318" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.9">socket</text>

  <!-- Switch legs right, seated in socket -->
  <line x1="891" y1="230" x2="891" y2="360" stroke-width="2.5"/>
  <line x1="909" y1="230" x2="909" y2="360" stroke-width="2.5"/>

  <!-- Switch housing right -->
  <rect x="840" y="150" width="120" height="80" rx="8" stroke-width="2.5"/>
  <text x="900" y="143" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">switch</text>

  <!-- Second switch, lifted free beside it -->
  <g transform="translate(150 -40)">
    <rect x="840" y="150" width="90" height="66" rx="7" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="871" y1="216" x2="871" y2="236" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="889" y1="216" x2="889" y2="236" stroke-width="2" stroke-opacity="0.7"/>
  </g>
  <text x="1105" y="160" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">pulled</text>

  <!-- Removable label -->
  <line x1="934" y1="346" x2="974" y2="346" stroke="oklch(0.68 0.165 28)" stroke-width="1.5"/>
  <text x="978" y="341" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none">spring-held</text>
  <text x="978" y="357" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.8">removable — no iron needed</text>

  <!-- Bottom caption -->
  <text x="600" y="450" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">the switch leg is the same — what holds it is different</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
