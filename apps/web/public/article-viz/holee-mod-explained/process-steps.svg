<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Four-step process for the Holee mod, performed once per switch: open, cut, seat, close and test</title>

  <!-- Panel dividers -->
  <line x1="300" y1="60" x2="300" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>
  <line x1="600" y1="60" x2="600" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>
  <line x1="900" y1="60" x2="900" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>

  <!-- Step numbers -->
  <text x="70" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">1</text>
  <text x="370" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">2</text>
  <text x="670" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">3</text>
  <text x="970" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">4</text>

  <!-- Panel 1: open -->
  <path d="M 90 150 L 220 150 L 220 190 L 235 210 L 75 210 L 90 190 Z" stroke-opacity="0.55"/>
  <path d="M 75 235 L 235 235 L 235 275 L 75 275 Z" stroke-opacity="0.85"/>
  <path d="M 130 205 L 130 240" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <path d="M 180 205 L 180 240" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <g stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7">
    <path d="M 220 150 L 250 130"/>
  </g>
  <text x="155" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">open</text>
  <text x="155" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">switch opener separates housing</text>

  <!-- Panel 2: cut -->
  <rect x="380" y="170" width="120" height="70" rx="4" fill="oklch(0.78 0.10 80 / 0.12)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="405" y="195" width="30" height="14" rx="2" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)" stroke-width="2"/>
  <g stroke-opacity="0.6">
    <line x1="500" y1="180" x2="530" y2="160"/>
    <line x1="500" y1="200" x2="530" y2="200"/>
  </g>
  <text x="455" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">cut</text>
  <text x="455" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">small foam pad sized to the target zone</text>

  <!-- Panel 3: seat -->
  <path d="M 675 195 L 825 195 L 825 250 L 675 250 Z" stroke-opacity="0.8"/>
  <line x1="720" y1="200" x2="720" y2="245" stroke-opacity="0.4"/>
  <line x1="760" y1="200" x2="760" y2="245" stroke-opacity="0.4"/>
  <rect x="730" y="232" width="34" height="12" rx="2" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)" stroke-width="2"/>
  <!-- tweezers -->
  <path d="M 810 175 L 785 215 M 800 175 L 780 220" stroke-opacity="0.6"/>
  <text x="750" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">seat</text>
  <text x="750" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">pad placed with tweezers around the stem base</text>

  <!-- Panel 4: close and test -->
  <path d="M 980 190 L 1130 190 L 1130 250 L 980 250 Z" stroke-opacity="0.85"/>
  <rect x="1030" y="228" width="34" height="12" rx="2" fill="oklch(0.78 0.10 80 / 0.4)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7" stroke-width="1.5"/>
  <path d="M 1090 165 L 1090 190" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.8"/>
  <path d="M 1082 172 L 1090 165 L 1098 172" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.8"/>
  <text x="1055" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">close + test</text>
  <text x="1055" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">housing snapped shut, stroke checked by hand</text>

  <!-- Caption -->
  <text x="600" y="400" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">repeat once per switch — there is no batch step</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="42" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
