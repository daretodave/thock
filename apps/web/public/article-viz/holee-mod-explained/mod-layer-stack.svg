<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Five foam and dampening mods mapped to the layer of the keyboard stack each one occupies, with the Holee mod shown inside a switch cross-section</title>

  <!-- Outer case shell -->
  <path d="M 220 120 L 980 120 L 980 560 L 220 560 Z" stroke-opacity="0.75"/>
  <path d="M 250 150 L 950 150 L 950 530 L 250 530 Z" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- 1. Keycap band -->
  <rect x="270" y="160" width="660" height="14" stroke-opacity="0.8"/>
  <text x="600" y="172" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">keycap</text>

  <!-- 2. Switch cutaway zone -->
  <rect x="270" y="190" width="660" height="150" stroke-opacity="0.45" stroke-dasharray="3 5"/>

  <!-- switch top housing -->
  <path d="M 460 205 L 700 205 L 700 250 L 715 270 L 445 270 L 460 250 Z" stroke-opacity="0.8"/>
  <!-- switch bottom housing -->
  <path d="M 445 278 L 715 278 L 715 320 L 445 320 Z" stroke-opacity="0.8"/>
  <!-- stem -->
  <line x1="565" y1="220" x2="565" y2="312" stroke-opacity="0.45"/>
  <line x1="600" y1="220" x2="600" y2="312" stroke-opacity="0.45"/>
  <!-- spring hint -->
  <path d="M 470 300 L 478 292 L 486 300 L 494 292 L 502 300 L 510 292" stroke-opacity="0.4"/>

  <!-- amber foam pad inside housing, seated near stem base -->
  <rect x="520" y="296" width="60" height="16" rx="3" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)" stroke-width="2.5" stroke-opacity="0.95"/>

  <text x="600" y="345" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">Holee mod — inside the housing, around the stem base</text>

  <!-- 3. PCB band -->
  <rect x="270" y="370" width="660" height="14" stroke-opacity="0.8"/>
  <text x="600" y="382" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">PCB</text>

  <!-- tape mod dashed strips on PCB back -->
  <rect x="270" y="386" width="660" height="6" fill="oklch(0.78 0.005 90 / 0.10)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="18 4"/>

  <!-- 4. PE foam band -->
  <rect x="270" y="404" width="660" height="16" fill="oklch(0.78 0.005 90 / 0.08)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- 5. case bottom + standoff -->
  <rect x="270" y="470" width="660" height="40" fill="oklch(0.78 0.005 90 / 0.06)" stroke-opacity="0.6"/>
  <rect x="560" y="440" width="30" height="30" stroke-opacity="0.55"/>
  <ellipse cx="575" cy="438" rx="16" ry="5" fill="oklch(0.78 0.005 90 / 0.2)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Right-side callouts -->
  <g stroke-opacity="0.5">
    <line x1="930" y1="167" x2="1030" y2="167"/>
    <line x1="715" y1="298" x2="1030" y2="230"/>
    <line x1="930" y1="389" x2="1030" y2="389"/>
    <line x1="930" y1="412" x2="1030" y2="412"/>
    <line x1="590" y1="440" x2="1030" y2="460"/>
  </g>
  <text x="1040" y="171" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">under-keycap O-ring (separate mod)</text>
  <text x="1040" y="220" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.95">Holee mod</text>
  <text x="1040" y="236" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">inside the switch</text>
  <text x="1040" y="393" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">tape mod</text>
  <text x="1040" y="416" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">PE foam</text>
  <text x="1040" y="450" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">thock's O-ring mod</text>
  <text x="1040" y="466" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">(standoff cushion)</text>

  <!-- Caption -->
  <text x="600" y="600" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">four mods work from outside the switch — one works from inside it</text>

  <!-- Amber theme accent dot mirrors splash color; bronze theme dot upper-right -->
  <circle cx="1170" cy="42" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
