<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Two side-by-side boxes. Left, Hall-effect: magnet approach generates a voltage, sensor reads voltage directly. Right, TMR, in coral: magnet approach rotates a layer inside a tunnel junction, sensor reads a change in resistance. A caption beneath both notes the finer-resolution claim is vendor-stated, not yet independently verified.</title>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="28" r="6" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>

  <!-- Left box: Hall-effect, muted -->
  <rect x="100" y="60" width="440" height="220" rx="12" opacity="0.75"/>
  <text x="320" y="95" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85" font-weight="600">Hall-effect</text>

  <!-- magnet + sensor glyph, left -->
  <rect x="280" y="115" width="80" height="24" rx="4" opacity="0.7"/>
  <line x1="320" y1="139" x2="320" y2="180" stroke-dasharray="3 4" opacity="0.5"/>
  <rect x="290" y="180" width="60" height="18" rx="3" opacity="0.7"/>
  <path d="M 360 189 L 400 189" stroke-opacity="0.6"/>
  <path d="M 392 182 L 400 189 L 392 196" stroke-opacity="0.6"/>

  <text x="320" y="225" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">magnet approach generates</text>
  <text x="320" y="245" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">a voltage</text>
  <text x="320" y="270" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">sensor reads voltage directly</text>

  <!-- Right box: TMR, coral -->
  <rect x="660" y="60" width="440" height="220" rx="12" stroke="oklch(0.68 0.165 28)" stroke-width="2.4" fill="oklch(0.68 0.165 28 / 0.08)"/>
  <text x="880" y="95" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">TMR</text>

  <!-- magnet + tunnel junction glyph, right -->
  <rect x="840" y="115" width="80" height="24" rx="4" fill="oklch(0.68 0.165 28 / 0.25)" stroke="oklch(0.68 0.165 28)"/>
  <line x1="880" y1="139" x2="880" y2="165" stroke="oklch(0.68 0.165 28)" stroke-dasharray="3 4" stroke-opacity="0.7"/>
  <!-- tunnel junction: two layers + thin barrier -->
  <rect x="850" y="165" width="60" height="12" rx="2" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.6"/>
  <rect x="850" y="177" width="60" height="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.9"/>
  <rect x="850" y="181" width="60" height="12" rx="2" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.45"/>
  <path d="M 910 187 L 950 187" stroke="oklch(0.68 0.165 28)"/>
  <path d="M 942 180 L 950 187 L 942 194" stroke="oklch(0.68 0.165 28)"/>

  <text x="880" y="225" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.9">magnet approach rotates a layer</text>
  <text x="880" y="245" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.9">inside a tunnel junction</text>
  <text x="880" y="270" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.75">sensor reads a resistance change</text>

  <!-- Caption beneath both -->
  <text x="600" y="335" font-family="Newsreader, serif" font-style="italic" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">vendor-stated finer-resolution claim — not yet independently verified</text>
</svg>
