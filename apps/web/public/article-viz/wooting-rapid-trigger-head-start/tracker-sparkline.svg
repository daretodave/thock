<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Wooting Trends Tracker score, W32 through W39 — values 40, 45, 52, 58, 63, 68, 74, 80 — an unbroken eight-week climb ending as the tracker's top mover for the period</title>

  <!-- Title -->
  <text x="600" y="54" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Wooting — Trends Tracker, W32 → W39</text>

  <!-- Chart area: x from 180 to 1080, y from 100 (score 100) to 370 (score 0), 2.7px per score point -->
  <!-- 40 -> 262 / 45 -> 249 / 52 -> 230 / 58 -> 213 / 63 -> 200 / 68 -> 186 / 74 -> 170 / 80 -> 154 -->
  <!-- x positions, 8 weeks equally spaced: 200, 320, 440, 560, 680, 800, 920, 1040 -->

  <!-- Horizontal grid lines -->
  <line x1="180" y1="370" x2="1080" y2="370" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="180" y1="289" x2="1080" y2="289" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.12"/>
  <line x1="180" y1="208" x2="1080" y2="208" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.12"/>
  <line x1="180" y1="127" x2="1080" y2="127" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.12"/>

  <!-- Ceiling marker near score 100 -->
  <line x1="180" y1="100" x2="1080" y2="100" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="1080" y="93" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.5">tracker ceiling ~100</text>

  <!-- Y-axis labels -->
  <text x="168" y="374" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.45">0</text>
  <text x="168" y="293" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.4">30</text>
  <text x="168" y="212" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.4">60</text>
  <text x="168" y="131" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.4">90</text>

  <!-- Subtle fill below line -->
  <polygon
    points="200,262 320,249 440,230 560,213 680,200 800,186 920,170 1040,154 1040,370 200,370"
    fill="oklch(0.68 0.165 28 / 0.08)"
    stroke="none"
  />

  <!-- Bracket marking the full eight-week swing -->
  <line x1="200" y1="90" x2="1040" y2="90" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="200" y1="90" x2="200" y2="98" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="1040" y1="90" x2="1040" y2="98" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.6" stroke-width="2"/>
  <text x="620" y="78" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.85">+40 over eight weeks</text>

  <!-- Coral data line -->
  <polyline
    points="200,262 320,249 440,230 560,213 680,200 800,186 920,170 1040,154"
    stroke="oklch(0.68 0.165 28)"
    stroke-width="3"
    stroke-opacity="0.95"
    fill="none"
  />

  <!-- Data dots — small grey for non-terminal weeks -->
  <circle cx="200" cy="262" r="4.5" fill="oklch(0.68 0.165 28 / 0.35)" stroke="oklch(0.68 0.165 28)" opacity="0.7"/>
  <circle cx="320" cy="249" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>
  <circle cx="440" cy="230" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>
  <circle cx="560" cy="213" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>
  <circle cx="680" cy="200" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>
  <circle cx="800" cy="186" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>
  <circle cx="920" cy="170" r="4" fill="oklch(0.78 0.005 90)" stroke="oklch(0.78 0.005 90)" opacity="0.45"/>

  <!-- Terminal dot W39 — filled coral, labelled -->
  <circle cx="1040" cy="154" r="10" fill="oklch(0.68 0.165 28)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.9"/>
  <text x="1060" y="150" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.68 0.165 28)" stroke="none" font-weight="600">80</text>
  <text x="1060" y="167" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">top mover, W39</text>

  <!-- Start label -->
  <text x="200" y="290" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.7">40</text>

  <!-- X-axis week labels -->
  <text x="200"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W32</text>
  <text x="320"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W33</text>
  <text x="440"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W34</text>
  <text x="560"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W35</text>
  <text x="680"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W36</text>
  <text x="800"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W37</text>
  <text x="920"  y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">W38</text>
  <text x="1040" y="395" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">W39</text>

  <!-- Caption annotation -->
  <text x="600" y="432" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">a hardware refresh, riding a firmware reputation built over four and a half years</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
