<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Two ways to color a polycarbonate housing — dye compounded into the resin melt versus a coating applied after molding</title>

  <!-- Panel divider -->
  <line x1="600" y1="70" x2="600" y2="460" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Panel headers -->
  <text x="300" y="50" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">MASS-DYED</text>
  <text x="900" y="50" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">POST-MOLD COATING</text>

  <!-- PANEL A: mass-dyed -->
  <g>
    <!-- step 1: pellets mixing -->
    <circle cx="190" cy="120" r="7" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)"/>
    <circle cx="212" cy="112" r="7" fill="none"/>
    <circle cx="208" cy="134" r="7" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)"/>
    <circle cx="232" cy="124" r="7" fill="none"/>
    <text x="260" y="128" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">1 — dye compounded into resin pellets</text>

    <line x1="300" y1="150" x2="300" y2="190" stroke-opacity="0.5"/>
    <path d="M 294 182 L 300 190 L 306 182" stroke-opacity="0.5"/>

    <!-- step 2: extruder barrel -->
    <rect x="200" y="195" width="200" height="50" rx="6" stroke-opacity="0.8"/>
    <g stroke-opacity="0.35">
      <line x1="215" y1="210" x2="385" y2="210"/>
      <line x1="215" y1="230" x2="385" y2="230"/>
    </g>
    <text x="300" y="265" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">2 — melt mixed uniformly in the barrel</text>

    <line x1="300" y1="280" x2="300" y2="320" stroke-opacity="0.5"/>
    <path d="M 294 312 L 300 320 L 306 312" stroke-opacity="0.5"/>

    <!-- step 3: molded housing, uniform tint through cross-section -->
    <path d="M 210 330 L 390 330 L 390 350 L 410 420 L 190 420 L 210 350 Z" fill="oklch(0.78 0.10 80 / 0.22)" stroke-opacity="0.9"/>
    <g stroke="oklch(0.78 0.10 80)" stroke-opacity="0.4" stroke-dasharray="2 5">
      <line x1="215" y1="360" x2="385" y2="360"/>
      <line x1="210" y1="385" x2="390" y2="385"/>
      <line x1="200" y1="408" x2="400" y2="408"/>
    </g>
    <text x="300" y="445" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">3 — color runs through the full cross-section</text>
  </g>

  <!-- PANEL B: post-mold coating -->
  <g opacity="0.9">
    <!-- step 1: clear molded part -->
    <path d="M 810 195 L 990 195 L 990 215 L 1010 285 L 790 285 L 810 215 Z" stroke-opacity="0.85"/>
    <text x="900" y="310" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">1 — part molds in a base resin color</text>

    <line x1="900" y1="325" x2="900" y2="360" stroke-opacity="0.5"/>
    <path d="M 894 352 L 900 360 L 906 352" stroke-opacity="0.5"/>

    <!-- step 2: spray/dip -->
    <path d="M 900 365 c -10 10 -10 22 0 32 c 10 -10 10 -22 0 -32 Z" stroke-opacity="0.7"/>
    <text x="900" y="420" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">2 — dip or spray coat applied after</text>

    <line x1="900" y1="435" x2="900" y2="455" stroke-opacity="0.5"/>

    <!-- step 3: thin colored shell with wear ticks at rail contact -->
    <path d="M 810 455 L 990 455 L 990 462 L 810 462 Z" stroke-opacity="0.9" stroke-dasharray="2 4"/>
    <g stroke="oklch(0.62 0.13 25)" stroke-opacity="0.75">
      <line x1="835" y1="450" x2="835" y2="467"/>
      <line x1="900" y1="450" x2="900" y2="467"/>
      <line x1="965" y1="450" x2="965" y2="467"/>
    </g>
    <text x="900" y="488" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle" opacity="0.9">3 — thin surface layer, wears at rail contact</text>
  </g>

  <!-- Baseline -->
  <line x1="90" y1="500" x2="1110" y2="500" stroke-opacity="0.3"/>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="40" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
