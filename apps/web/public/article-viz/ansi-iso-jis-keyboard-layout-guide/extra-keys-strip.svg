<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Six labeled keycap glyphs showing the extra key positions ISO and JIS layouts carry that ANSI does not — the shared ISO extra key, and four JIS-only keys: Yen, Ro, Muhenkan/Henkan, and Kana</title>

  <text x="40" y="45" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600" letter-spacing="0.03em" opacity="0.85">KEY POSITIONS AN ANSI KEYCAP SET HAS NOTHING FOR</text>
  <line x1="40" y1="60" x2="1160" y2="60" stroke-opacity="0.2"/>

  <!-- Glyph 1: ISO extra key -->
  <rect x="60" y="100" width="140" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="130" y="152" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">\ |</text>
  <text x="130" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">ISO extra key</text>
  <text x="130" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">ISO + JIS</text>

  <!-- Glyph 2: Yen -->
  <rect x="235" y="100" width="140" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="305" y="155" font-family="IBM Plex Sans, sans-serif" font-size="26" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">¥</text>
  <text x="305" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Yen</text>
  <text x="305" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">JIS only</text>

  <!-- Glyph 3: Ro -->
  <rect x="410" y="100" width="140" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="480" y="152" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">Ro</text>
  <text x="480" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Ro</text>
  <text x="480" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">JIS only</text>

  <!-- Glyph 4: Muhenkan -->
  <rect x="585" y="100" width="180" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="675" y="152" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">MUHENKAN</text>
  <text x="675" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Non-conversion</text>
  <text x="675" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">JIS only</text>

  <!-- Glyph 5: Henkan -->
  <rect x="785" y="100" width="180" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="875" y="152" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">HENKAN</text>
  <text x="875" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Conversion</text>
  <text x="875" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">JIS only</text>

  <!-- Glyph 6: Kana -->
  <rect x="985" y="100" width="155" height="90" rx="10" fill="oklch(0.78 0.10 80)" fill-opacity="0.12" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="1062" y="152" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">KANA</text>
  <text x="1062" y="215" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Input toggle</text>
  <text x="1062" y="233" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" font-weight="600">JIS only</text>

  <!-- Footnote -->
  <text x="40" y="300" font-family="Newsreader, serif" font-style="italic" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">Six real key positions. An ANSI base kit has a keycap for none of them.</text>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="25" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
