<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock inline viz — Mass80 timeline from group-buy open to extras restock</title>

  <!-- Baseline -->
  <line x1="80" y1="220" x2="1120" y2="220" stroke-opacity="0.55"/>

  <!-- Markers: GB open, GB close, estimated delivery window (span), extras sale -->
  <!-- GB open: 2026-02-03 -->
  <circle cx="160" cy="220" r="8" fill="oklch(0.68 0.165 28)" stroke="oklch(0.68 0.165 28)"/>
  <line x1="160" y1="220" x2="160" y2="150" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="160" y="124" font-family="IBM Plex Sans, sans-serif" font-size="18" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">GB opens</text>
  <text x="160" y="148" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">2026-02-03</text>

  <!-- GB close: 2026-02-24 -->
  <circle cx="380" cy="220" r="8" fill="oklch(0.68 0.165 28)" stroke="oklch(0.68 0.165 28)"/>
  <line x1="380" y1="220" x2="380" y2="150" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="380" y="124" font-family="IBM Plex Sans, sans-serif" font-size="18" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">GB closes</text>
  <text x="380" y="148" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">2026-02-24</text>

  <!-- Estimated delivery window: Sep-Oct 2026, rendered as a span -->
  <line x1="760" y1="220" x2="920" y2="220" stroke="oklch(0.78 0.005 90)" stroke-width="4" stroke-opacity="0.75"/>
  <circle cx="760" cy="220" r="7" fill="none" stroke="oklch(0.78 0.005 90)"/>
  <circle cx="920" cy="220" r="7" fill="none" stroke="oklch(0.78 0.005 90)"/>
  <line x1="840" y1="220" x2="840" y2="150" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="840" y="124" font-family="IBM Plex Sans, sans-serif" font-size="18" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">estimated delivery</text>
  <text x="840" y="148" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">Sep–Oct 2026</text>

  <!-- Extras sale: 2026-10-08, 3PM ET — the focal event -->
  <circle cx="1040" cy="220" r="11" fill="oklch(0.68 0.165 28)" stroke="oklch(0.60 0.17 28)" stroke-width="2.5"/>
  <circle cx="1040" cy="220" r="19" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.4"/>
  <line x1="1040" y1="220" x2="1040" y2="280" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="1040" y="310" font-family="IBM Plex Sans, sans-serif" font-size="19" text-anchor="middle" fill="oklch(0.68 0.165 28)" stroke="none" font-weight="700">Extras sale</text>
  <text x="1040" y="336" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" text-anchor="middle" fill="oklch(0.68 0.165 28)" stroke="none">2026-10-08 · 3PM ET</text>

  <!-- Connecting travel arc between GB close and extras sale, labelled "seven months" -->
  <path d="M 380 260 Q 710 340 1040 260" stroke-opacity="0.3" stroke-dasharray="2 8"/>
  <text x="710" y="372" font-family="Newsreader, serif" font-style="italic" font-size="17" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">seven months between close and extras</text>

  <!-- Theme dot -->
  <circle cx="1168" cy="36" r="5" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
