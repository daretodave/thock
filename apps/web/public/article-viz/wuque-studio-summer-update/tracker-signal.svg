<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Line chart of Wuque Studio's vendor tracker signal across eight weeks, W26 through W33 of 2026, starting at 13, declining through the summer to a trough of negative 8 in W32, and recovering to negative 2 in W33</title>

  <text x="600" y="40" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">Wuque Studio's tracker signal, last eight weeks</text>

  <!-- axis -->
  <line x1="100" y1="60" x2="100" y2="340" stroke-opacity="0.3"/>
  <line x1="100" y1="200" x2="1100" y2="200" stroke-opacity="0.15" stroke-dasharray="3 5"/>
  <text x="88" y="204" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.4">0</text>

  <!-- trend line -->
  <path d="M120,100 L257,110 L394,129 L531,262 L669,252 L806,262 L943,300 L1080,243" stroke="oklch(0.68 0.165 28)" stroke-width="3" fill="none"/>

  <!-- markers -->
  <circle cx="120" cy="100" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="257" cy="110" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="394" cy="129" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="531" cy="262" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="669" cy="252" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="806" cy="262" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="943" cy="300" r="4" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.7"/>
  <circle cx="1080" cy="243" r="6" fill="oklch(0.68 0.165 28)" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>

  <!-- value labels -->
  <text x="120" y="84" font-family="JetBrains Mono, monospace" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">13</text>
  <text x="943" y="320" font-family="JetBrains Mono, monospace" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">-8</text>
  <text x="1080" y="227" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">-2</text>

  <!-- week ticks -->
  <text x="120" y="366" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">W26</text>
  <text x="257" y="366" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">W27</text>
  <text x="394" y="366" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">W28</text>
  <text x="531" y="366" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">W29</text>
  <text x="669" y="366" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">W30</text>
