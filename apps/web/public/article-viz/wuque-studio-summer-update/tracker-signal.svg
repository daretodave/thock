  <text x="600" y="400" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.9">still net negative on the week, but recovering off the summer trough</text>

