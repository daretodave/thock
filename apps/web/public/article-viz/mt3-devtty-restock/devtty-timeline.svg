<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Timeline from the original 2017 /dev/tty release to later double-shot MT3 runs to the August 2026 restock</title>

  <text x="600" y="52" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">nine years, one profile, back on the shelf</text>

  <!-- Timeline axis -->
  <line x1="120" y1="168" x2="1100" y2="168" stroke-opacity="0.52"/>

  <!-- Catalog-life bar spanning the set's active life -->
  <rect x="210" y="160" width="830" height="16" fill="oklch(0.78 0.10 80 / 0.14)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Milestone 1: original release, 2017-04-01 -->
  <line x1="210" y1="126" x2="210" y2="210" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.95" stroke-width="3"/>
  <circle cx="210" cy="168" r="10" fill="oklch(0.78 0.10 80 / 0.24)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.95" stroke-width="3"/>
  <text x="210" y="118" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">original release</text>
  <text x="210" y="234" font-family="Newsreader, serif" font-size="17" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">2017-04-01</text>
  <text x="210" y="256" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.62">dye-sub PBT, Drop + Matt3o</text>

  <!-- Milestone 2: later double-shot ABS MT3 runs, undated / dashed marker -->
  <line x1="610" y1="132" x2="610" y2="204" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="610" cy="168" r="8" fill="none" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="610" y="122" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.62">later Drop MT3 runs</text>
  <text x="610" y="228" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.62">double-shot ABS,</text>
  <text x="610" y="248" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.62">undated, no exact year</text>

  <!-- Milestone 3: restock, 2026-08-24 -->
  <line x1="1040" y1="126" x2="1040" y2="210" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.95" stroke-width="3"/>
  <circle cx="1040" cy="168" r="10" fill="oklch(0.78 0.10 80 / 0.24)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.95" stroke-width="3"/>
  <text x="1040" y="118" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">catalog restock</text>
  <text x="1040" y="234" font-family="Newsreader, serif" font-size="17" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">2026-08-24</text>
  <text x="1040" y="256" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.62">status: in-stock</text>

  <!-- Bottom rule -->
  <line x1="120" y1="300" x2="1100" y2="300" stroke-opacity="0.2"/>
  <text x="600" y="322" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">same tooling, same colorway, back on Drop's shelf nine years on</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
