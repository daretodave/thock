<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Cross-section comparing dye-sub PBT legend construction against double-shot ABS legend construction, with a relative tooling-cost bar under each</title>

  <text x="600" y="46" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">two ways to put a legend on a cap</text>

  <!-- Divider -->
  <line x1="600" y1="80" x2="600" y2="400" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- LEFT: dye-sub PBT cross-section -->
  <text x="300" y="100" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">dye-sub PBT (/dev/tty, 2017)</text>

  <!-- Cap shell outline, side cutaway -->
  <path d="M 200 260 L 220 150 L 380 150 L 400 260 Z" stroke-opacity="0.85"/>
  <!-- Single homogeneous fill: one plastic shot -->
  <path d="M 205 255 L 224 155 L 376 155 L 395 255 Z" fill="oklch(0.78 0.10 80 / 0.10)" stroke="none"/>
  <!-- Dye penetration band near the top surface -->
  <path d="M 232 168 L 368 168 L 362 182 L 238 182 Z" fill="oklch(0.78 0.10 80 / 0.55)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="300" y="205" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">dye sublimated into</text>
  <text x="300" y="220" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">the surface, one shot</text>

  <text x="300" y="285" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">single mold cavity per keycap</text>

  <!-- Cost bar, low -->
  <rect x="240" y="330" width="120" height="18" rx="3" fill="oklch(0.78 0.10 80 / 0.30)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7"/>
  <text x="300" y="368" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">lower tooling cost</text>

  <!-- RIGHT: double-shot ABS cross-section -->
  <text x="900" y="100" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">double-shot ABS (later MT3 runs)</text>

  <path d="M 800 260 L 820 150 L 980 150 L 1000 260 Z" stroke-opacity="0.85"/>
  <path d="M 805 255 L 824 155 L 976 155 L 995 255 Z" fill="oklch(0.78 0.005 90 / 0.06)" stroke="none"/>
  <!-- Inserted second-shot legend plastic, distinct cavity -->
  <path d="M 860 155 L 940 155 L 950 195 L 850 195 Z" fill="oklch(0.78 0.10 80 / 0.45)" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="900" y="215" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">second plastic shot,</text>
  <text x="900" y="230" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">dedicated legend cavity</text>

  <text x="900" y="285" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">two mold cavities per keycap</text>

  <!-- Cost bar, high -->
  <rect x="840" y="300" width="120" height="48" rx="3" fill="oklch(0.62 0.13 25 / 0.20)" stroke="oklch(0.62 0.13 25)" stroke-opacity="0.65"/>
  <text x="900" y="368" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">higher tooling cost</text>

  <!-- Baseline -->
  <line x1="120" y1="400" x2="1080" y2="400" stroke-opacity="0.2"/>
  <text x="600" y="430" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">the 2017 run chose the cheaper path to prove the shape first</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
