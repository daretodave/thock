<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock inline viz — Paper80 x Whatever Studio catalog-fact strip, five labelled chips</title>

  <!-- Row 1 of three chips -->
  <g>
    <rect x="60" y="60" width="330" height="90" rx="12"/>
    <text x="80" y="92" font-family="IBM Plex Sans, sans-serif" font-size="14" letter-spacing="1" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">LAYOUT</text>
    <text x="80" y="122" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(0.78 0.005 90)" stroke="none">80% · ANSI or ISO</text>
  </g>
  <g>
    <rect x="420" y="60" width="330" height="90" rx="12"/>
    <text x="440" y="92" font-family="IBM Plex Sans, sans-serif" font-size="14" letter-spacing="1" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">CASE MATERIAL</text>
    <text x="440" y="122" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(0.78 0.005 90)" stroke="none">CNC aluminum</text>
  </g>
  <g>
    <rect x="780" y="60" width="330" height="90" rx="12"/>
    <text x="800" y="92" font-family="IBM Plex Sans, sans-serif" font-size="14" letter-spacing="1" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">MOUNT</text>
    <text x="800" y="122" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(0.78 0.005 90)" stroke="none">Lock-hole gasket</text>
  </g>

  <!-- Row 2 of two chips -->
  <g>
    <rect x="60" y="180" width="330" height="90" rx="12"/>
    <text x="80" y="212" font-family="IBM Plex Sans, sans-serif" font-size="14" letter-spacing="1" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">PLATE</text>
    <text x="80" y="242" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(0.78 0.005 90)" stroke="none">PC or aluminum</text>
  </g>
  <!-- Highlighted chip: the signature fold feature, ochre -->
  <g>
    <rect x="420" y="180" width="690" height="90" rx="12" fill="oklch(0.72 0.10 75 / 0.12)" stroke="oklch(0.72 0.10 75)" stroke-width="2.5"/>
    <text x="440" y="212" font-family="IBM Plex Sans, sans-serif" font-size="14" letter-spacing="1" fill="oklch(0.72 0.10 75)" stroke="none">SIGNATURE FEATURE</text>
    <text x="440" y="242" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" fill="oklch(0.72 0.10 75)" stroke="none" font-weight="700">Paper-airplane mid-case fold</text>
  </g>

  <!-- Caption line -->
  <text x="600" y="330" font-family="Newsreader, serif" font-style="italic" font-size="17" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">A standard 80% spec sheet with one unusual line.</text>

  <!-- Theme dot -->
  <circle cx="1168" cy="24" r="5" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
