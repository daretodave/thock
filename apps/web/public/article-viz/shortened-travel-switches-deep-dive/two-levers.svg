<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Two side-by-side force-versus-travel panels sharing the same axes. Left panel, labeled spring weight lever: two curves plotted over an identical travel distance, a lighter curve and a heavier curve stacked above it, with a bracket reading same distance, different force. Right panel, labeled travel lever: a single shared force curve plotted twice, once running the full standard distance and once cut off earlier at a shorter distance with the cut point marked in coral, with a bracket reading same force curve, different distance.</title>

  <!-- ================================================================
       Canvas: 1200 x 480
       Subject: two conceptual force-vs-travel panels isolating the two
                levers — spring weight (left) and travel distance (right).
       Palette:
         Stroke  oklch(0.78 0.005 90)  warm-grey, 2px
         Splash  oklch(0.68 0.165 28)  coral (the lever being changed in
                 each panel + bronze dot)
       Background: transparent. No numeric values plotted — illustrative
       only, per the article's own distinction between the two levers.
  ================================================================ -->

  <!-- Panel titles -->
  <text x="320" y="48" font-family="IBM Plex Sans" font-size="20" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">Spring weight lever</text>
  <text x="860" y="48" font-family="IBM Plex Sans" font-size="20" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">Travel lever</text>

  <!-- ===================== PANEL A: spring weight ===================== -->
  <g>
    <!-- Axes -->
    <line x1="140" y1="400" x2="140" y2="110" stroke-opacity="0.4"/>
    <line x1="140" y1="400" x2="500" y2="400" stroke-opacity="0.4"/>
    <text x="320" y="428" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">travel distance (same span)</text>
    <text x="118" y="255" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6" transform="rotate(-90 118 255)">force</text>

    <!-- Lighter spring curve -->
    <path d="M 140 380 Q 320 350 500 220" stroke-width="2.5" stroke-opacity="0.85"/>
    <text x="505" y="224" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none">lighter spring</text>

    <!-- Heavier spring curve, coral, raised throughout -->
    <path d="M 140 320 Q 320 280 500 140" stroke="oklch(0.68 0.165 28)" stroke-width="2.5" stroke-opacity="0.95"/>
    <text x="505" y="144" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none">heavier spring</text>

    <!-- Vertical same-distance ticks at start and end -->
    <line x1="140" y1="400" x2="140" y2="415" stroke-opacity="0.35"/>
    <line x1="500" y1="400" x2="500" y2="415" stroke-opacity="0.35"/>
    <line x1="140" y1="408" x2="500" y2="408" stroke-dasharray="3 5" stroke-opacity="0.3"/>
  </g>
  <text x="320" y="460" font-family="Newsreader" font-style="italic" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">same distance, different force</text>

  <!-- ===================== PANEL B: travel distance ===================== -->
  <g>
    <!-- Axes -->
    <line x1="680" y1="400" x2="680" y2="110" stroke-opacity="0.4"/>
    <line x1="680" y1="400" x2="1040" y2="400" stroke-opacity="0.4"/>
    <text x="860" y="428" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">travel distance (shortened on the right)</text>
    <text x="658" y="255" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6" transform="rotate(-90 658 255)">force</text>

    <!-- Full-length curve, standard travel, warm-grey, faint continuation past the cutoff -->
    <path d="M 680 380 Q 860 320 1040 160" stroke-width="2.5" stroke-opacity="0.85"/>
    <text x="1045" y="164" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none">standard length</text>

    <!-- Identical curve shape, coral, cut short -->
    <path d="M 680 380 Q 790 346 880 266" stroke="oklch(0.68 0.165 28)" stroke-width="3" stroke-opacity="0.95"/>
    <!-- Faint dashed continuation of the same curve shape beyond the cutoff, showing it's the same curve, just not reached -->
    <path d="M 880 266 Q 960 200 1040 160" stroke="oklch(0.68 0.165 28)" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.35"/>

    <!-- Cutoff marker -->
    <line x1="880" y1="400" x2="880" y2="266" stroke="oklch(0.68 0.165 28)" stroke-dasharray="3 4" stroke-opacity="0.6"/>
    <circle cx="880" cy="266" r="6" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <text x="890" y="250" font-family="IBM Plex Sans" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none">shortened stroke stops here</text>
  </g>
  <text x="860" y="460" font-family="Newsreader" font-style="italic" font-size="15" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.9">same force curve, different distance</text>

  <!-- Theme dot -->
  <circle cx="1132" cy="50" r="7" fill="oklch(0.80 0.135 75)" stroke="none" opacity="0.9"/>
</svg>
