<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock inline viz — three Class80 mount configurations compared: top mount, PCB gasket mount with plate, and plateless PCB gasket</title>

  <!-- Column headers -->
  <text x="235" y="56" font-family="Newsreader, serif" font-style="italic" font-size="22" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">top mount</text>
  <text x="600" y="56" font-family="Newsreader, serif" font-style="italic" font-size="22" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">PCB gasket + plate</text>
  <text x="965" y="56" font-family="Newsreader, serif" font-style="italic" font-size="22" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">plateless PCB gasket</text>

  <!-- Column 1: top mount — plate bolted flush to case top, no gap -->
  <rect x="80" y="90" width="310" height="230" rx="10" stroke-opacity="0.85"/>
  <rect x="110" y="110" width="250" height="24" rx="3" stroke-opacity="0.9"/>
  <text x="235" y="127" font-family="IBM Plex Sans, sans-serif" font-size="12" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">plate — bolted to case</text>
  <line x1="120" y1="134" x2="120" y2="150" stroke-opacity="0.7"/>
  <line x1="350" y1="134" x2="350" y2="150" stroke-opacity="0.7"/>
  <rect x="140" y="150" width="190" height="60" rx="3" stroke-opacity="0.6" stroke-dasharray="3 5"/>
  <text x="235" y="184" font-family="IBM Plex Sans, sans-serif" font-size="12" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">PCB hangs off plate</text>
  <text x="235" y="256" font-family="IBM Plex Sans, sans-serif" font-size="15" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">firm, no give</text>
  <text x="235" y="282" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">direct case-to-plate feel</text>

  <!-- Column 2: PCB gasket mount with plate — plate floats on gasket pads, highlighted bronze -->
  <rect x="445" y="90" width="310" height="230" rx="10" fill="oklch(0.80 0.135 75 / 0.10)" stroke="oklch(0.80 0.135 75)" stroke-width="2.5"/>
  <rect x="475" y="112" width="30" height="14" rx="3" fill="oklch(0.80 0.135 75)" stroke="none"/>
  <rect x="690" y="112" width="30" height="14" rx="3" fill="oklch(0.80 0.135 75)" stroke="none"/>
  <rect x="505" y="150" width="190" height="60" rx="3" stroke-opacity="0.85"/>
  <text x="600" y="184" font-family="IBM Plex Sans, sans-serif" font-size="12" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">plate floats on gasket</text>
  <rect x="475" y="222" width="30" height="14" rx="3" fill="oklch(0.80 0.135 75)" stroke="none"/>
  <rect x="690" y="222" width="30" height="14" rx="3" fill="oklch(0.80 0.135 75)" stroke="none"/>
  <text x="600" y="266" font-family="IBM Plex Sans, sans-serif" font-size="15" text-anchor="middle" fill="oklch(0.80 0.135 75)" stroke="none" font-weight="700">soft, uniform</text>
  <text x="600" y="292" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">the gasket-mount signature</text>

  <!-- Column 3: plateless PCB gasket — no plate, PCB on gasket pads alone -->
  <rect x="810" y="90" width="310" height="230" rx="10" stroke-opacity="0.85"/>
  <text x="965" y="150" font-family="IBM Plex Sans, sans-serif" font-size="12" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.45" font-style="italic">(no plate)</text>
  <rect x="870" y="170" width="190" height="44" rx="3" stroke-opacity="0.85"/>
  <text x="965" y="196" font-family="IBM Plex Sans, sans-serif" font-size="12" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">PCB on gasket pads alone</text>
  <text x="965" y="258" font-family="IBM Plex Sans, sans-serif" font-size="15" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">loose, bouncy</text>
  <text x="965" y="284" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">no plate backing the switches</text>

  <!-- Footer note -->
  <text x="600" y="400" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">all three ship under the same Class80 nameplate</text>

  <!-- Theme dot -->
  <circle cx="1168" cy="30" r="5" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
