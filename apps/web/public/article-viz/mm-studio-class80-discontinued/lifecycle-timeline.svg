<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>thock inline viz — MM Studio Class80 lifecycle timeline from R1 release to discontinued status with no R3 confirmed</title>

  <!-- Baseline -->
  <line x1="60" y1="220" x2="1140" y2="220" stroke-opacity="0.55"/>

  <!-- R1 release: 2022-09-01 -->
  <circle cx="140" cy="220" r="9" fill="oklch(0.80 0.135 75)" stroke="oklch(0.70 0.14 75)" stroke-width="2"/>
  <line x1="140" y1="220" x2="140" y2="150" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="140" y="124" font-family="IBM Plex Sans, sans-serif" font-size="17" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">Class80 R1 release</text>
  <text x="140" y="148" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none">2022-09-01</text>

  <!-- R1 sold out: undated, dashed marker -->
  <circle cx="410" cy="220" r="7" fill="none" stroke="oklch(0.78 0.005 90)" stroke-dasharray="2 3"/>
  <line x1="410" y1="220" x2="410" y2="280" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="410" y="306" font-family="IBM Plex Sans, sans-serif" font-size="16" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">R1 sold out</text>
  <text x="410" y="328" font-family="Newsreader, serif" font-style="italic" font-size="14" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">undated in record</text>

  <!-- R2 succeeds R1: undated, dashed marker -->
  <circle cx="680" cy="220" r="7" fill="none" stroke="oklch(0.78 0.005 90)" stroke-dasharray="2 3"/>
  <line x1="680" y1="220" x2="680" y2="150" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="680" y="124" font-family="IBM Plex Sans, sans-serif" font-size="16" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600">R2 succeeds R1</text>
  <text x="680" y="146" font-family="Newsreader, serif" font-style="italic" font-size="14" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">undated in record</text>

  <!-- Status updated to discontinued: 2026-05-09, the focal event -->
  <circle cx="950" cy="220" r="11" fill="oklch(0.80 0.135 75)" stroke="oklch(0.70 0.14 75)" stroke-width="2.5"/>
  <circle cx="950" cy="220" r="19" stroke="oklch(0.80 0.135 75)" stroke-opacity="0.4"/>
  <line x1="950" y1="220" x2="950" y2="280" stroke-opacity="0.4" stroke-dasharray="3 6"/>
  <text x="950" y="310" font-family="IBM Plex Sans, sans-serif" font-size="17" text-anchor="middle" fill="oklch(0.80 0.135 75)" stroke="none" font-weight="700">Status: discontinued</text>
  <text x="950" y="332" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" text-anchor="middle" fill="oklch(0.80 0.135 75)" stroke="none">2026-05-09</text>

  <!-- No R3 confirmed: end marker, question mark -->
  <circle cx="1100" cy="220" r="7" fill="none" stroke="oklch(0.78 0.005 90)" stroke-dasharray="1 4" stroke-opacity="0.6"/>
  <text x="1100" y="196" font-family="Newsreader, serif" font-size="20" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">?</text>
  <line x1="1100" y1="220" x2="1100" y2="150" stroke-opacity="0.3" stroke-dasharray="2 5"/>
  <text x="1100" y="128" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">no R3</text>
  <text x="1100" y="146" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="middle" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">confirmed</text>

  <!-- Theme dot -->
  <circle cx="1168" cy="36" r="5" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
