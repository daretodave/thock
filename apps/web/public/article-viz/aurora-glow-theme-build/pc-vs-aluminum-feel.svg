<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Side-by-side cross-section comparing a dense aluminum gasket case, labeled heft and resonant low end, against the Aurora's polycarbonate gasket case, labeled lighter, bouncier, and translucent to glow. Both show the same gasket-mount floating plate.</title>

  <text x="60" y="50" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6" letter-spacing="0.08em">SAME GASKET MOUNT, TWO SHELL MATERIALS</text>

  <!-- divider -->
  <line x1="600" y1="80" x2="600" y2="420" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- LEFT: aluminum case, solid heavy shading -->
  <path d="M 120 400 L 120 150 Q 120 110 170 110 L 470 110 Q 520 110 520 150 L 520 400" fill="oklch(0.78 0.005 90)" fill-opacity="0.18" stroke-opacity="0.95" stroke-width="5"/>
  <text x="120" y="96" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85" letter-spacing="0.04em">ALUMINUM GASKET CASE</text>

  <!-- floating plate, gasket mount -->
  <rect x="190" y="270" width="260" height="22" rx="6" stroke-opacity="0.85"/>
  <line x1="190" y1="292" x2="170" y2="320" stroke-opacity="0.5" stroke-dasharray="2 5"/>
  <line x1="450" y1="292" x2="470" y2="320" stroke-opacity="0.5" stroke-dasharray="2 5"/>
  <text x="190" y="330" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">gasket boundary, floating plate</text>

  <text x="190" y="370" font-family="Newsreader, serif" font-style="italic" font-size="19" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.9">heft, resonant low end</text>
  <text x="190" y="392" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">dense shell, opaque to light</text>

  <!-- RIGHT: Aurora PC case, translucent hatching -->
  <path d="M 680 400 L 680 150 Q 680 110 730 110 L 1030 110 Q 1080 110 1080 150 L 1080 400" stroke-opacity="0.75" stroke-dasharray="1 0"/>
  <g stroke="oklch(0.78 0.10 80)" stroke-opacity="0.3">
    <line x1="700" y1="140" x2="730" y2="110"/>
    <line x1="730" y1="150" x2="770" y2="110"/>
    <line x1="760" y1="180" x2="810" y2="130"/>
    <line x1="790" y1="220" x2="850" y2="160"/>
    <line x1="950" y1="130" x2="1000" y2="80"/>
    <line x1="980" y1="170" x2="1030" y2="120"/>
    <line x1="1000" y1="210" x2="1060" y2="150"/>
  </g>
  <text x="680" y="96" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.95" letter-spacing="0.04em">AURORA — POLYCARBONATE GASKET CASE</text>

  <rect x="750" y="270" width="260" height="22" rx="6" stroke-opacity="0.85"/>
  <line x1="750" y1="292" x2="730" y2="320" stroke-opacity="0.5" stroke-dasharray="2 5"/>
  <line x1="1010" y1="292" x2="1030" y2="320" stroke-opacity="0.5" stroke-dasharray="2 5"/>
  <text x="750" y="330" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">gasket boundary, floating plate</text>

  <text x="750" y="370" font-family="Newsreader, serif" font-style="italic" font-size="19" fill="oklch(0.78 0.10 80)" stroke="none">lighter, bouncier, glow-diffusing</text>
  <text x="750" y="392" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">frosted shell, translucent to light</text>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
