<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Timeline from the Gateron Magnetic Jade's 2022 release, through the August 2026 deep dive whose prose already described hall-effect sensing, to the November 2026 structured sensing field backfill</title>

  <text x="600" y="44" font-family="Newsreader, serif" font-size="19" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">the prose led the schema by about two and a half months</text>

  <!-- Timeline axis -->
  <line x1="110" y1="180" x2="1100" y2="180" stroke-opacity="0.5"/>

  <!-- Milestone 1: original release, dashed, unlabeled significance -->
  <line x1="180" y1="150" x2="180" y2="210" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <circle cx="180" cy="180" r="7" fill="none" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="180" y="138" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">original release</text>
  <text x="180" y="244" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">2022-09-01</text>

  <!-- Milestone 2: deep-dive publication, description already says hall-effect -->
  <line x1="650" y1="128" x2="650" y2="232" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="3"/>
  <circle cx="650" cy="180" r="10" fill="oklch(0.68 0.165 28 / 0.22)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="3"/>
  <text x="650" y="114" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">description already says hall-effect</text>
  <text x="650" y="258" font-family="Newsreader, serif" font-size="17" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">2026-08-21</text>
  <text x="650" y="280" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">deep-dive publishes on prose alone</text>

  <!-- Bracket between milestone 2 and 3 -->
  <path d="M 680 100 L 1030 100" stroke-opacity="0.4" stroke-dasharray="2 5"/>
  <path d="M 680 100 L 680 112" stroke-opacity="0.4"/>
  <path d="M 1030 100 L 1030 112" stroke-opacity="0.4"/>
  <text x="855" y="88" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">roughly two and a half months</text>

  <!-- Milestone 3: sensing field backfilled -->
  <line x1="1030" y1="128" x2="1030" y2="232" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="3"/>
  <circle cx="1030" cy="180" r="10" fill="oklch(0.68 0.165 28 / 0.22)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.95" stroke-width="3"/>
  <text x="1030" y="114" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">sensing field backfilled</text>
  <text x="1030" y="258" font-family="Newsreader, serif" font-size="17" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">2026-11-06</text>
  <text x="1030" y="280" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">schema catches up to the prose</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="24" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
