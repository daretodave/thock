<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Catalog record fields for the Gateron Magnetic Jade before and after the 2026-11-06 backfill, with the new sensing field highlighted</title>

  <text x="600" y="42" font-family="Newsreader, serif" font-size="19" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">one new row, nothing else moved</text>

  <!-- Field rows: label left, value right, divider line -->
  <!-- Row 1: type -->
  <line x1="90" y1="86" x2="1110" y2="86" stroke-opacity="0.22"/>
  <text x="90" y="78" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">type</text>
  <text x="1110" y="78" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">linear</text>

  <!-- Row 2: housing -->
  <line x1="90" y1="132" x2="1110" y2="132" stroke-opacity="0.22"/>
  <text x="90" y="124" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">housing</text>
  <text x="1110" y="124" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">PC top / nylon bottom</text>

  <!-- Row 3: stem -->
  <line x1="90" y1="178" x2="1110" y2="178" stroke-opacity="0.22"/>
  <text x="90" y="170" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">stem</text>
  <text x="1110" y="170" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">POM</text>

  <!-- Row 4: spring / travel -->
  <line x1="90" y1="224" x2="1110" y2="224" stroke-opacity="0.22"/>
  <text x="90" y="216" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">spring / travel</text>
  <text x="1110" y="216" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">30-50gf, 3.5mm</text>

  <!-- Row 5: status -->
  <line x1="90" y1="270" x2="1110" y2="270" stroke-opacity="0.22"/>
  <text x="90" y="262" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">status</text>
  <text x="1110" y="262" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">in-production</text>

  <!-- Row 6: NEW sensing field, highlighted coral -->
  <rect x="78" y="296" width="1044" height="56" rx="8" fill="oklch(0.68 0.165 28 / 0.14)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.7"/>
  <text x="104" y="330" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.95">sensing</text>
  <rect x="200" y="312" width="42" height="22" rx="4" fill="oklch(0.68 0.165 28)" stroke="none"/>
  <text x="221" y="328" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.17 0.01 90)" stroke="none" text-anchor="middle" font-weight="600">NEW</text>
  <text x="1096" y="330" font-family="JetBrains Mono, monospace" font-size="15" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="end" opacity="0.95">hall-effect</text>

  <!-- Row 7: updatedAt -->
  <text x="90" y="392" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">updatedAt</text>
  <text x="1110" y="392" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.85">2026-11-06</text>

  <text x="600" y="432" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">commit a8f4f006 — backfill sensing hall-effect on gateron-magnetic-jade</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="24" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
