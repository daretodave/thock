<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Grid of eighteen switch glyphs representing every record in the switch catalog, with only the Gateron Magnetic Jade filled in coral to mark the one record carrying a sensing field</title>

  <text x="600" y="42" font-family="Newsreader, serif" font-size="19" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">one of eighteen switch records can be queried by sensing type</text>

  <!-- 6 columns x 3 rows of switch glyphs, simple rounded-rect "switch" shapes -->
  <!-- Row 1 -->
  <g>
    <rect x="90" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="270" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="450" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="630" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="810" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="990" y="90" width="110" height="70" rx="8" stroke-opacity="0.4"/>
  </g>
  <!-- Row 2 -->
  <g>
    <rect x="90" y="180" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="270" y="180" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="450" y="180" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <!-- Highlighted: Gateron Magnetic Jade -->
    <rect x="630" y="180" width="110" height="70" rx="8" fill="oklch(0.68 0.165 28 / 0.2)" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.9" stroke-width="2.5"/>
    <rect x="810" y="180" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="990" y="180" width="110" height="70" rx="8" stroke-opacity="0.4"/>
  </g>
  <!-- Row 3 -->
  <g>
    <rect x="90" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="270" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="450" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="630" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="810" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
    <rect x="990" y="270" width="110" height="70" rx="8" stroke-opacity="0.4"/>
  </g>

  <!-- Label under highlighted glyph -->
  <text x="685" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">Magnetic Jade</text>
  <text x="685" y="362" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">sensing: hall-effect</text>

  <text x="600" y="400" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">the other seventeen records have no sensing field at all, set or unset</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="24" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
