<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Exploded cross-section of a switch split into four separate parts, each able to originate from a different switch line</title>

  <!-- vertical alignment guide -->
  <line x1="420" y1="60" x2="420" y2="560" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- 1. Top housing -->
  <path d="M 300 80 L 540 80 L 540 130 L 560 155 L 280 155 L 300 130 Z" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="420" y="118" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">top housing</text>

  <!-- connector -->
  <line x1="420" y1="155" x2="420" y2="200" stroke-opacity="0.3" stroke-dasharray="3 5"/>

  <!-- 2. Stem -->
  <path d="M 385 205 L 455 205 L 455 225 L 435 235 L 435 300 L 405 300 L 405 235 L 385 225 Z" stroke-opacity="0.85"/>
  <text x="420" y="320" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">stem</text>

  <line x1="420" y1="325" x2="420" y2="360" stroke-opacity="0.3" stroke-dasharray="3 5"/>

  <!-- 3. Spring -->
  <path d="M 395 365 L 445 375 L 395 385 L 445 395 L 395 405 L 445 415" stroke-opacity="0.85"/>
  <text x="420" y="435" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">spring</text>

  <line x1="420" y1="440" x2="420" y2="470" stroke-opacity="0.3" stroke-dasharray="3 5"/>

  <!-- 4. Bottom housing -->
  <path d="M 290 475 L 550 475 L 550 530 L 290 530 Z" stroke-opacity="0.85"/>
  <text x="420" y="508" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">bottom housing</text>

  <!-- right-side donor callouts -->
  <g stroke-opacity="0.45">
    <line x1="560" y1="115" x2="700" y2="115"/>
    <line x1="455" y1="215" x2="700" y2="250"/>
    <line x1="445" y1="390" x2="700" y2="390"/>
    <line x1="550" y1="502" x2="700" y2="510"/>
  </g>
  <text x="712" y="112" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.95">from switch A</text>
  <text x="712" y="128" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">acoustic shell, pole fit</text>

  <text x="712" y="247" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8">from switch B</text>
  <text x="712" y="263" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">tactile bump or linear profile</text>

  <text x="712" y="387" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8">from switch C</text>
  <text x="712" y="403" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">actuation and bottom-out weight</text>

  <text x="712" y="507" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8">from switch D</text>
  <text x="712" y="523" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">base tolerance, rail fit</text>

  <!-- Caption -->
  <text x="600" y="580" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">the Holy Panda only needed to mix two of these four</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="42" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
