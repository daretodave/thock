<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Four-step process for building a frankenswitch: pick the host housing, source the donor part, test-fit before committing, then bench-test a small batch before scaling up</title>

  <!-- Panel dividers -->
  <line x1="300" y1="60" x2="300" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>
  <line x1="600" y1="60" x2="600" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>
  <line x1="900" y1="60" x2="900" y2="360" stroke-opacity="0.2" stroke-dasharray="5 5"/>

  <!-- Step numbers -->
  <text x="70" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">1</text>
  <text x="370" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">2</text>
  <text x="670" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">3</text>
  <text x="970" y="90" font-family="Newsreader, serif" font-size="28" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.9">4</text>

  <!-- Panel 1: pick host housing -->
  <path d="M 100 160 L 220 160 L 220 200 L 100 200 Z" stroke-opacity="0.85"/>
  <path d="M 100 160 L 115 145 L 235 145 L 220 160 Z" stroke-opacity="0.55"/>
  <circle cx="160" cy="135" r="5" fill="oklch(0.78 0.10 80 / 0.6)" stroke="oklch(0.78 0.10 80)" stroke-width="2"/>
  <text x="160" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">pick host housing</text>
  <text x="160" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">chosen for the acoustic shell you want</text>

  <!-- Panel 2: source donor part -->
  <path d="M 410 170 L 460 190 L 410 210 L 410 230 L 460 210" stroke-opacity="0.6"/>
  <rect x="465" y="175" width="40" height="18" rx="2" fill="oklch(0.78 0.10 80 / 0.5)" stroke="oklch(0.78 0.10 80)" stroke-width="2"/>
  <text x="460" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">source donor part</text>
  <text x="460" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">a stem, housing, or spring from elsewhere</text>

  <!-- Panel 3: test-fit one switch -->
  <path d="M 700 190 L 850 190 L 850 230 L 700 230 Z" stroke-opacity="0.8"/>
  <line x1="740" y1="195" x2="740" y2="225" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="800" y1="195" x2="800" y2="225" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M 860 180 L 880 160 M 860 160 L 880 180" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.7"/>
  <text x="775" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">test-fit one</text>
  <text x="775" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">check pole spacing and wobble by hand</text>

  <!-- Panel 4: bench-test batch then scale -->
  <rect x="990" y="195" width="20" height="24" stroke-opacity="0.7"/>
  <rect x="1015" y="195" width="20" height="24" stroke-opacity="0.7"/>
  <rect x="1040" y="195" width="20" height="24" fill="oklch(0.78 0.10 80 / 0.4)" stroke="oklch(0.78 0.10 80)" stroke-width="1.8"/>
  <path d="M 1075 200 L 1100 200 L 1100 215 L 1115 215" stroke-opacity="0.5"/>
  <text x="1040" y="320" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">bench-test, then scale</text>
  <text x="1040" y="340" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">small batch first, full board after</text>

  <!-- Caption -->
  <text x="600" y="400" font-family="Newsreader, serif" font-size="15" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">test-fit before you commit — one bad combo on 90 switches is a long afternoon</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="42" r="4" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
