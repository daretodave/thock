<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" fill="none">
  <defs>
    <style>
      .label { font-family: 'IBM Plex Sans', sans-serif; fill: oklch(0.78 0.005 90); }
      .title { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; fill: oklch(0.30 0.01 90); }
      .note { font-family: 'IBM Plex Sans', sans-serif; fill: oklch(0.45 0.01 90); }
      .mono { font-family: 'JetBrains Mono', monospace; fill: oklch(0.45 0.01 90); }
    </style>
  </defs>

  <circle cx="1160" cy="30" r="8" fill="oklch(0.80 0.135 75)" />

  <!-- column x origins: 50, 330, 610, 890 ; column width 260 -->

  <!-- titles -->
  <text x="180" y="50" class="title" font-size="21" text-anchor="middle">Durock T1</text>
  <text x="460" y="50" class="title" font-size="21" text-anchor="middle">Boba U4T</text>
  <text x="740" y="50" class="title" font-size="21" text-anchor="middle">Holy Panda X</text>
  <text x="1020" y="50" class="title" font-size="21" text-anchor="middle">Gateron Lanes</text>

  <!-- baselines -->
  <line x1="60" y1="260" x2="310" y2="260" stroke="oklch(0.78 0.005 90)" stroke-width="1.5" opacity="0.5" />
  <line x1="340" y1="260" x2="590" y2="260" stroke="oklch(0.78 0.005 90)" stroke-width="1.5" opacity="0.5" />
  <line x1="620" y1="260" x2="870" y2="260" stroke="oklch(0.78 0.005 90)" stroke-width="1.5" opacity="0.5" />
  <line x1="900" y1="260" x2="1150" y2="260" stroke="oklch(0.78 0.005 90)" stroke-width="1.5" opacity="0.5" />

  <!-- Glyph 1: T1 — steep narrow spike, wide spread after -->
  <path d="M 70 260 L 130 135 L 160 145 L 210 260 L 300 260" stroke="oklch(0.78 0.005 90)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="130" cy="135" r="7" fill="oklch(0.78 0.10 80)" />

  <!-- Glyph 2: U4T — D-shaped plateau -->
  <path d="M 350 260 L 390 150 L 490 150 L 530 260 L 580 260" stroke="oklch(0.78 0.005 90)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="440" cy="150" r="7" fill="oklch(0.78 0.10 80)" />

  <!-- Glyph 3: HPX — smooth rounded arc, blends into baseline late -->
  <path d="M 630 260 C 670 185 700 150 750 150 C 800 150 840 200 860 260" stroke="oklch(0.78 0.005 90)" stroke-width="2.4" stroke-linecap="round" fill="none" />
  <circle cx="750" cy="150" r="7" fill="oklch(0.78 0.10 80)" />

  <!-- Glyph 4: Lanes — sharp narrow spike, steeper drop-off than T1 -->
  <path d="M 910 260 L 955 128 L 972 134 L 1010 260 L 1140 260" stroke="oklch(0.78 0.005 90)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="955" cy="128" r="7" fill="oklch(0.78 0.10 80)" />

  <!-- annotations -->
  <text x="180" y="300" class="note" font-size="14.5" text-anchor="middle">steep leading shoulder,</text>
  <text x="180" y="320" class="note" font-size="14.5" text-anchor="middle">short arc, fast release</text>
  <text x="180" y="348" class="mono" font-size="14.5" text-anchor="middle">55g &#8594; 67g &#8212; 12g spread</text>

  <text x="460" y="300" class="note" font-size="14.5" text-anchor="middle">rounded shoulder holds</text>
  <text x="460" y="320" class="note" font-size="14.5" text-anchor="middle">contact across an extended arc</text>
  <text x="460" y="348" class="mono" font-size="14.5" text-anchor="middle">62g &#8594; 68g &#8212; 6g spread</text>

  <text x="740" y="300" class="note" font-size="14.5" text-anchor="middle">gentle entry, long dwell,</text>
  <text x="740" y="320" class="note" font-size="14.5" text-anchor="middle">blends into bottom-out</text>
  <text x="740" y="348" class="mono" font-size="14.5" text-anchor="middle">60g &#8594; 67g &#8212; 7g spread</text>

  <text x="1020" y="300" class="note" font-size="14.5" text-anchor="middle">stepped leg front-loads</text>
  <text x="1020" y="320" class="note" font-size="14.5" text-anchor="middle">the crossing, stiff spring</text>
  <text x="1020" y="348" class="mono" font-size="14.5" text-anchor="middle">55g &#8594; 62g &#8212; 7g spread</text>

  <line x1="60" y1="400" x2="1150" y2="400" stroke="oklch(0.78 0.005 90)" stroke-width="1" stroke-dasharray="3 7" opacity="0.4" />
  <text x="600" y="432" class="label" font-size="15" text-anchor="middle" font-style="italic">same contact leaf, four leg shapes approaching it differently</text>
</svg>
