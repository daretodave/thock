<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Two horizontal timeline bars comparing QMK and ZMK's wireless design origin — QMK starts as a wired firmware with Bluetooth grafted on later; ZMK starts with Bluetooth and Zephyr built in from the first commit</title>

  <!-- Section header -->
  <text x="600" y="55" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">bolted-on versus built-in</text>

  <!-- ══ ROW 1: QMK ══════════════════════════════════════════ -->
  <text x="110" y="130" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600" letter-spacing="0.06em">QMK</text>

  <line x1="150" y1="150" x2="1050" y2="150" stroke-opacity="0.5"/>
  <circle cx="150" cy="150" r="6" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7"/>
  <text x="150" y="180" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" opacity="0.75">wired-firmware origin, 2015</text>

  <!-- Bluetooth grafted on later, shorter segment -->
  <line x1="780" y1="150" x2="1050" y2="150" stroke="oklch(0.78 0.10 80)" stroke-width="6" stroke-opacity="0.85"/>
  <circle cx="780" cy="150" r="5" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="915" y="120" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">Bluetooth added, board by board</text>

  <!-- ══ ROW 2: ZMK ══════════════════════════════════════════ -->
  <text x="110" y="290" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600" letter-spacing="0.06em">ZMK</text>

  <!-- Full-length wireless segment, amber the whole way -->
  <line x1="150" y1="310" x2="1050" y2="310" stroke="oklch(0.78 0.10 80)" stroke-width="6" stroke-opacity="0.85"/>
  <circle cx="150" cy="310" r="6" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="150" y="340" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="start" opacity="0.95">Bluetooth + Zephyr origin, 2018</text>
  <text x="850" y="280" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">wireless-native the whole length of the bar</text>

  <!-- Caption -->
  <text x="600" y="395" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">same destination, different starting assumption</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
