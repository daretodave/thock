<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Four labeled panels showing the decision points unique to wireless and split builds — split pairing, Bluetooth profiles, power management, and Studio versus devicetree configuration</title>

  <text x="600" y="45" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">four decision points a wired build never has to make</text>

  <!-- Panel dividers -->
  <g stroke-opacity="0.2" stroke-dasharray="4 6">
    <line x1="300" y1="90" x2="300" y2="380"/>
    <line x1="600" y1="90" x2="600" y2="380"/>
    <line x1="900" y1="90" x2="900" y2="380"/>
  </g>

  <!-- Panel 1: split pairing -->
  <rect x="60" y="150" width="42" height="60" rx="6" stroke-opacity="0.85"/>
  <rect x="140" y="150" width="42" height="60" rx="6" stroke-opacity="0.85"/>
  <line x1="102" y1="180" x2="140" y2="180" stroke-dasharray="3 5" stroke-opacity="0.6"/>
  <circle cx="121" cy="140" r="4" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="150" y="255" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">split pairing</text>
  <text x="150" y="278" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">central + peripheral</text>

  <!-- Panel 2: Bluetooth profiles -->
  <rect x="365" y="165" width="46" height="60" rx="6" stroke-opacity="0.85"/>
  <circle cx="490" cy="150" r="16" stroke-opacity="0.7"/>
  <circle cx="490" cy="195" r="16" stroke-opacity="0.7"/>
  <circle cx="490" cy="240" r="16" stroke-opacity="0.7"/>
  <line x1="411" y1="195" x2="474" y2="150" stroke-opacity="0.4"/>
  <line x1="411" y1="195" x2="474" y2="195" stroke-opacity="0.4"/>
  <line x1="411" y1="195" x2="474" y2="240" stroke-opacity="0.4"/>
  <circle cx="411" cy="195" r="4" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="450" y="285" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Bluetooth profiles</text>
  <text x="450" y="308" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">one board, several hosts</text>

  <!-- Panel 3: power management -->
  <rect x="710" y="155" width="34" height="60" rx="5" stroke-opacity="0.85"/>
  <rect x="717" y="146" width="20" height="9" rx="2" stroke-opacity="0.85"/>
  <line x1="710" y1="185" x2="744" y2="185" stroke-opacity="0.4"/>
  <path d="M 780 155 A 30 30 0 1 0 810 205" stroke-opacity="0.75"/>
  <circle cx="780" cy="145" r="4" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="770" y="255" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">power management</text>
  <text x="770" y="278" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">idle + sleep tuning</text>

  <!-- Panel 4: configuration method fork -->
  <rect x="1000" y="140" width="70" height="42" rx="6" stroke-opacity="0.85"/>
  <text x="1035" y="166" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">GUI</text>
  <line x1="1035" y1="182" x2="1035" y2="205" stroke-opacity="0.5"/>
  <line x1="1000" y1="230" x2="1035" y2="205" stroke-opacity="0.5"/>
  <line x1="1070" y1="230" x2="1035" y2="205" stroke-opacity="0.5"/>
  <rect x="960" y="230" width="70" height="42" rx="6" stroke-opacity="0.85"/>
  <text x="995" y="256" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">Studio</text>
  <rect x="1045" y="230" width="80" height="42" rx="6" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.85"/>
  <text x="1085" y="256" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">devicetree</text>
  <circle cx="1035" cy="130" r="4" fill="oklch(0.78 0.10 80)" stroke="none"/>
  <text x="1043" y="320" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">configuration method</text>
  <text x="1043" y="343" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">Studio or raw config</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
