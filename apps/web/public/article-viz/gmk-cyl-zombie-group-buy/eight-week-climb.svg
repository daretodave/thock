<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>An eight-point line chart of GMK CYL Zombie's trends tracker score, rising left to right from 0 to 70 across eight consecutive weekly reads, plotted in coral against a warm-grey baseline grid. The final point is marked and labeled 70, direction up, with no flat or declining week anywhere along the line.</title>

  <!-- Title -->
