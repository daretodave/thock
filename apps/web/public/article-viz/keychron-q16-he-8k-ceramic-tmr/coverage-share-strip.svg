<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Three-glyph strip sized by this week's coverage dominance per the tracker note. A large coral circle labelled Keychron ceramic-TMR Q16 HE. A medium coral-outlined circle labelled Gateron magnetic lineup. A small warm-red circle labelled Cherry MX plus XTRFY, shown shrinking relative to the other two.</title>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="30" r="6" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>

  <text x="600" y="44" font-family="Newsreader, serif" font-style="italic" font-size="19" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">Who's dominating this week's keyboard-news coverage</text>

  <!-- Baseline -->
  <line x1="90" y1="330" x2="1110" y2="330" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Glyph 1: Keychron ceramic-TMR Q16 HE — largest, filled coral -->
  <circle cx="300" cy="240" r="90" fill="oklch(0.68 0.165 28 / 0.85)" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
  <text x="300" y="380" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">Keychron ceramic-TMR</text>
  <text x="300" y="400" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">Q16 HE</text>

  <!-- Glyph 2: Gateron magnetic lineup — medium, coral outline -->
  <circle cx="620" cy="255" r="62" fill="oklch(0.68 0.165 28 / 0.15)" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
  <text x="620" y="380" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">Gateron magnetic</text>
  <text x="620" y="400" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.8">lineup</text>

  <!-- Glyph 3: Cherry (MX + XTRFY) — smallest, warm-red -->
  <circle cx="890" cy="292" r="32" fill="oklch(0.62 0.13 25 / 0.18)" stroke="oklch(0.62 0.13 25)" stroke-width="2"/>
  <text x="890" y="380" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle" opacity="0.9">Cherry (MX +</text>
  <text x="890" y="400" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.62 0.13 25)" stroke="none" text-anchor="middle" opacity="0.9">XTRFY)</text>
</svg>
