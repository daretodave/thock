<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Annotated cross-section of a Gateron Ink V2 Yellow switch showing an RGB LED at the base, light rays passing upward through the semi-translucent plum PC housing and diffusing around the switch body, with a dashed line showing the same light stopping at the underside of an opaque GMK Laser keycap rather than passing through its legend.</title>

  <text x="60" y="50" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6" letter-spacing="0.08em">GATERON INK V2 YELLOW — GLOW PATH</text>

  <!-- PCB + LED -->
  <line x1="150" y1="420" x2="550" y2="420" stroke-width="4" stroke-opacity="0.8"/>
  <text x="150" y="445" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">PCB</text>
  <circle cx="350" cy="410" r="10" fill="oklch(0.70 0.14 45)" fill-opacity="0.3" stroke="oklch(0.70 0.14 45)" stroke-opacity="0.95"/>
  <text x="370" y="414" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="oklch(0.70 0.14 45)" stroke="none" opacity="0.95">per-key RGB LED</text>

  <!-- switch housing, semi-translucent -->
  <rect x="260" y="200" width="180" height="200" rx="14" stroke-opacity="0.85" fill="oklch(0.70 0.14 45)" fill-opacity="0.08"/>
  <text x="260" y="188" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">semi-translucent plum PC housing</text>

  <!-- stem -->
  <line x1="350" y1="180" x2="350" y2="380" stroke-width="6" stroke-opacity="0.9"/>

  <!-- light rays diffusing through housing -->
  <g stroke="oklch(0.70 0.14 45)" stroke-opacity="0.75" stroke-dasharray="2 6">
    <path d="M 350 405 L 290 240"/>
    <path d="M 350 405 L 350 210"/>
    <path d="M 350 405 L 410 240"/>
  </g>
  <text x="620" y="300" font-family="Newsreader, serif" font-style="italic" font-size="19" fill="oklch(0.70 0.14 45)" stroke="none">diffuse glow</text>
  <text x="620" y="322" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">spreads through the housing wall</text>

  <!-- keycap above, opaque -->
  <path d="M 230 175 L 470 175 L 450 110 L 250 110 Z" stroke-opacity="0.9"/>
  <text x="620" y="130" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8">GMK Laser keycap</text>
  <text x="620" y="150" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8">opaque doubleshot — not shine-through</text>

  <!-- light stopping at the cap underside -->
  <path d="M 350 175 L 350 150" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.55" stroke-dasharray="3 6"/>
  <path d="M 330 150 L 350 130 L 370 150" stroke-opacity="0.55"/>
  <text x="400" y="175" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">light stops here —</text>
  <text x="400" y="192" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6">legend doesn't light up</text>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
