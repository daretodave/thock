<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Three-panel numbered process strip: confirm stem type, check hot-swap support per board, then decide if the flatter profile is worth a smaller keycap and switch catalog</title>

  <text x="600" y="44" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">three checks, in order</text>

  <!-- Arrows between panels -->
  <path d="M 408 240 L 436 240" stroke-opacity="0.4"/>
  <path d="M 428 232 L 436 240 L 428 248" stroke-opacity="0.4"/>
  <path d="M 808 240 L 836 240" stroke-opacity="0.4"/>
  <path d="M 828 232 L 836 240 L 828 248" stroke-opacity="0.4"/>

  <!-- ===================== PANEL 1 — confirm stem type ===================== -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="360" height="320" rx="12" stroke-opacity="0.5"/>
    <circle cx="36" cy="36" r="18" fill="oklch(0.78 0.10 80 / 0.18)" stroke="oklch(0.78 0.10 80)"/>
    <text x="36" y="42" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">1</text>
    <text x="68" y="42" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none">Confirm the stem type</text>

    <!-- Two stem icons marked not-interchangeable -->
    <g transform="translate(110,120)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.7">
      <circle r="24" fill="oklch(0.78 0.005 90 / 0.06)"/>
      <line x1="-7" y1="-12" x2="-7" y2="12"/>
      <line x1="7" y1="-12" x2="7" y2="12"/>
    </g>
    <text x="110" y="165" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">Choc</text>

    <g transform="translate(250,120)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.7">
      <circle r="24" fill="oklch(0.78 0.005 90 / 0.06)"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
    <text x="250" y="165" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">Cherry MX-LP</text>

    <!-- X mark between them, warm-red caution -->
    <g stroke="oklch(0.62 0.13 25)" transform="translate(180,120)">
      <line x1="-8" y1="-8" x2="8" y2="8"/>
      <line x1="8" y1="-8" x2="-8" y2="8"/>
    </g>

    <text x="24" y="220" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">Before buying any keycap or</text>
    <text x="24" y="240" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">switch, not after.</text>
    <text x="24" y="276" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.85">Not interchangeable.</text>
  </g>

  <!-- ===================== PANEL 2 — check hot-swap ===================== -->
  <g transform="translate(436,80)">
    <rect x="0" y="0" width="360" height="320" rx="12" stroke-opacity="0.5"/>
    <circle cx="36" cy="36" r="18" fill="oklch(0.78 0.10 80 / 0.18)" stroke="oklch(0.78 0.10 80)"/>
    <text x="36" y="42" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">2</text>
    <text x="68" y="42" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none">Check hot-swap, per board</text>

    <!-- Socket icon with question mark -->
    <g transform="translate(180,130)">
      <rect x="-34" y="-24" width="68" height="48" rx="8" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.6" fill="oklch(0.78 0.005 90 / 0.05)"/>
      <text x="0" y="10" font-family="IBM Plex Sans, sans-serif" font-size="26" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">?</text>
    </g>

    <text x="24" y="224" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">Never assume it from the</text>
    <text x="24" y="244" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">switch family alone.</text>
    <text x="24" y="280" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.85">Confirm per listing.</text>
  </g>

  <!-- ===================== PANEL 3 — decide the tradeoff ===================== -->
  <g transform="translate(832,80)">
    <rect x="0" y="0" width="360" height="320" rx="12" stroke-opacity="0.5"/>
    <circle cx="36" cy="36" r="18" fill="oklch(0.78 0.10 80 / 0.18)" stroke="oklch(0.78 0.10 80)"/>
    <text x="36" y="42" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">3</text>
    <text x="68" y="42" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="oklch(0.78 0.005 90)" stroke="none">Weigh profile vs. catalog</text>

    <!-- Small stack (low-profile) vs tall stack (standard MX) -->
    <g transform="translate(110,185)">
      <rect x="-20" y="-20" width="40" height="14" rx="3" stroke="oklch(0.78 0.10 80)" fill="oklch(0.78 0.10 80 / 0.14)"/>
      <rect x="-20" y="-2" width="40" height="14" rx="3" stroke="oklch(0.78 0.10 80)" fill="oklch(0.78 0.10 80 / 0.14)"/>
    </g>
    <text x="110" y="222" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle">low-profile catalog</text>

    <g transform="translate(250,175)">
      <rect x="-22" y="-56" width="44" height="14" rx="3" stroke-opacity="0.55"/>
      <rect x="-22" y="-38" width="44" height="14" rx="3" stroke-opacity="0.55"/>
      <rect x="-22" y="-20" width="44" height="14" rx="3" stroke-opacity="0.55"/>
      <rect x="-22" y="-2" width="44" height="14" rx="3" stroke-opacity="0.55"/>
      <rect x="-22" y="16" width="44" height="14" rx="3" stroke-opacity="0.55"/>
    </g>
    <text x="250" y="222" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">standard MX catalog</text>

    <text x="24" y="264" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">Flatter case and angle, against</text>
    <text x="24" y="284" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">a far smaller parts market.</text>
  </g>

  <!-- Bronze theme dot -->
  <circle cx="1160" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
