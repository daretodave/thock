<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Three-column strip naming the three stabilizer rattle sources — wire-in-stem slop, stem-in-housing play, housing-to-plate or PCB movement — each with its sound name and a vertical travel bar shaded in coral where in the keystroke the sound lands.">
  <title>Three rattle sources, three sounds — where in the stroke each one lands</title>

  <!-- Title -->
  <text x="600" y="70" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle">where it sounds tells you which gap</text>

  <!-- Column separators -->
  <line x1="425" y1="110" x2="425" y2="460" stroke-opacity="0.3"/>
  <line x1="775" y1="110" x2="775" y2="460" stroke-opacity="0.3"/>

  <!-- ===== Column 1: wire-in-stem slop ===== -->
  <text x="250" y="130" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">① wire-in-stem slop</text>
  <text x="250" y="166" font-family="Newsreader, serif" font-size="26" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">rattle</text>
  <text x="250" y="190" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">steel on plastic · bright, metallic</text>

  <!-- glyph: wire leg in stem slot, gap above and below -->
  <g transform="translate(250 230)">
    <rect x="-30" y="-14" width="60" height="28" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="7" stroke-opacity="0.95"/>
    <path d="M -14 -22 Q 0 -30 14 -22" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.85"/>
    <path d="M -14 22 Q 0 30 14 22" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.85"/>
  </g>

  <!-- travel bar -->
  <g transform="translate(250 0)">
    <line x1="0" y1="290" x2="0" y2="440" stroke-opacity="0.55"/>
    <line x1="-8" y1="290" x2="8" y2="290" stroke-opacity="0.55"/>
    <line x1="-8" y1="440" x2="8" y2="440" stroke-opacity="0.55"/>
    <rect x="-6" y="290" width="12" height="24" fill="oklch(0.68 0.165 28 / 0.55)" stroke="none"/>
    <rect x="-6" y="416" width="12" height="24" fill="oklch(0.68 0.165 28 / 0.55)" stroke="none"/>
    <text x="16" y="296" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">top-out</text>
    <text x="16" y="444" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">bottom-out</text>
  </g>
  <text x="250" y="470" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">both reversals · throughout the stroke</text>

  <!-- ===== Column 2: stem-in-housing play ===== -->
  <text x="600" y="130" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">② stem-in-housing play</text>
  <text x="600" y="166" font-family="Newsreader, serif" font-size="26" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">tick / scrape</text>
  <text x="600" y="190" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">plastic on plastic · stem cocks, catches, snaps square</text>

  <!-- glyph: stem cocked in bore -->
  <g transform="translate(600 230)">
    <path d="M -32 -30 L -32 30 L 32 30 L 32 -30" stroke-opacity="0.7"/>
    <rect x="-18" y="-36" width="36" height="60" transform="rotate(6)" stroke-opacity="0.95"/>
    <circle cx="20" cy="-20" r="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
  </g>

  <!-- travel bar: single point near bottom-out -->
  <g transform="translate(600 0)">
    <line x1="0" y1="290" x2="0" y2="440" stroke-opacity="0.55"/>
    <line x1="-8" y1="290" x2="8" y2="290" stroke-opacity="0.55"/>
    <line x1="-8" y1="440" x2="8" y2="440" stroke-opacity="0.55"/>
    <rect x="-6" y="392" width="12" height="12" fill="oklch(0.68 0.165 28 / 0.8)" stroke="none"/>
    <text x="16" y="296" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">top-out</text>
    <text x="16" y="444" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">bottom-out</text>
  </g>
  <text x="600" y="470" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">one point in the stroke · discrete</text>

  <!-- ===== Column 3: housing-to-plate / PCB ===== -->
  <text x="950" y="130" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">③ housing-to-plate / PCB movement</text>
  <text x="950" y="166" font-family="Newsreader, serif" font-size="26" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">clunk</text>
  <text x="950" y="190" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">low, hollow · under the keystroke</text>

  <!-- glyph: housing lifted fractionally off PCB -->
  <g transform="translate(950 230)">
    <line x1="-50" y1="30" x2="50" y2="30" stroke-opacity="0.8"/>
    <path d="M -30 -30 L -30 22 L 30 22 L 30 -30" stroke-opacity="0.95"/>
    <rect x="-30" y="22" width="60" height="8" fill="oklch(0.68 0.165 28 / 0.35)" stroke="none"/>
    <text x="56" y="34" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.45">PCB</text>
  </g>

  <!-- travel bar: bottom-out only -->
  <g transform="translate(950 0)">
    <line x1="0" y1="290" x2="0" y2="440" stroke-opacity="0.55"/>
    <line x1="-8" y1="290" x2="8" y2="290" stroke-opacity="0.55"/>
    <line x1="-8" y1="440" x2="8" y2="440" stroke-opacity="0.55"/>
    <rect x="-6" y="424" width="12" height="16" fill="oklch(0.68 0.165 28 / 0.55)" stroke="none"/>
    <text x="16" y="296" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">top-out</text>
    <text x="16" y="444" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">bottom-out</text>
  </g>
  <text x="950" y="470" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">bottom-out only · survives wire and stem lube</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
