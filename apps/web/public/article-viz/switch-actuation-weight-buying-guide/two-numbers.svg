<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Actuation force versus bottom-out force for five catalog switches, with the gram gap between the two bracketed per switch</title>

  <!-- Axis -->
  <line x1="300" y1="80" x2="300" y2="500" stroke-opacity="0.3"/>
  <line x1="300" y1="500" x2="1120" y2="500" stroke-opacity="0.3"/>
  <!-- gridlines every 20g, scale 10px/g from x=300 -->
  <g stroke-opacity="0.15">
    <line x1="500" y1="80" x2="500" y2="500"/>
    <line x1="700" y1="80" x2="700" y2="500"/>
    <line x1="900" y1="80" x2="900" y2="500"/>
    <line x1="1100" y1="80" x2="1100" y2="500"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55" text-anchor="middle">
    <text x="300" y="518">0g</text>
    <text x="500" y="518">20g</text>
    <text x="700" y="518">40g</text>
    <text x="900" y="518">60g</text>
    <text x="1100" y="518">80g</text>
  </g>

  <!-- Legend -->
  <g font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none">
    <rect x="300" y="36" width="26" height="12" rx="2" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <text x="334" y="46" opacity="0.75">actuation force</text>
    <rect x="490" y="36" width="26" height="12" rx="2" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="524" y="46" opacity="0.75">bottom-out force</text>
  </g>

  <!-- Row: Gateron Magnetic Jade — 30 / 50 -->
  <g>
    <text x="90" y="104" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">Gateron Magnetic Jade</text>
    <rect x="300" y="88" width="300" height="16" rx="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <rect x="300" y="110" width="500" height="16" rx="3" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="610" y="101" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none">30g</text>
    <text x="810" y="123" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">50g</text>
    <text x="300" y="140" font-family="Newsreader, serif" font-style="italic" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">gap 20g</text>
  </g>

  <!-- Row: Cherry MX2A Red — 45 / 75 -->
  <g>
    <text x="90" y="192" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">Cherry MX2A Red</text>
    <rect x="300" y="176" width="450" height="16" rx="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <rect x="300" y="198" width="750" height="16" rx="3" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="760" y="189" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none">45g</text>
    <text x="1060" y="211" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">75g</text>
    <text x="300" y="228" font-family="Newsreader, serif" font-style="italic" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">gap 30g — widest of the five</text>
  </g>

  <!-- Row: Durock T1 — 55 / 67 -->
  <g>
    <text x="90" y="280" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">Durock T1</text>
    <rect x="300" y="264" width="550" height="16" rx="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <rect x="300" y="286" width="670" height="16" rx="3" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="860" y="277" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none">55g</text>
    <text x="980" y="299" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">67g</text>
    <text x="300" y="316" font-family="Newsreader, serif" font-style="italic" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">gap 12g — tactile bump sits near actuation</text>
  </g>

  <!-- Row: Kailh Box Jade — 50 / 70 -->
  <g>
    <text x="90" y="368" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">Kailh Box Jade</text>
    <rect x="300" y="352" width="500" height="16" rx="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <rect x="300" y="374" width="700" height="16" rx="3" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="810" y="365" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none">50g</text>
    <text x="1010" y="387" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">70g</text>
    <text x="300" y="404" font-family="Newsreader, serif" font-style="italic" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">gap 20g — click leaf fires at actuation</text>
  </g>

  <!-- Row: C3 Equalz Tangerine R2 — 67 / 72 -->
  <g>
    <text x="90" y="456" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">C3 Equalz Tangerine R2</text>
    <rect x="300" y="440" width="670" height="16" rx="3" fill="oklch(0.68 0.165 28)" stroke="none"/>
    <rect x="300" y="462" width="720" height="16" rx="3" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2"/>
    <text x="980" y="453" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.68 0.165 28)" stroke="none">67g</text>
    <text x="1030" y="475" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">72g</text>
    <text x="300" y="492" font-family="Newsreader, serif" font-style="italic" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">gap 5g — tightest spread, almost no cushion</text>
  </g>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
