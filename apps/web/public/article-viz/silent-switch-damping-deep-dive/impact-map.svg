<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Where the two impacts happen inside an MX-style switch — top-out at the rail shoulders, bottom-out at the leg feet, with the leaf between them reached by neither pad</title>

  <!-- ══════════════════ SWITCH CROSS-SECTION (left) ══════════════════ -->

  <!-- Top housing: plate with stem hole, walls descending -->
  <path d="M 280 90 L 395 90 L 395 130 L 300 130 L 300 230 L 280 230 Z"/>
  <path d="M 560 90 L 445 90 L 445 130 L 540 130 L 540 230 L 560 230 Z"/>
  <!-- Housing seam -->
  <line x1="280" y1="230" x2="300" y2="230"/>
  <line x1="540" y1="230" x2="560" y2="230"/>

  <!-- Bottom housing: walls + thick floor -->
  <path d="M 280 230 L 280 440 L 560 440 L 560 230"/>
  <line x1="300" y1="230" x2="300" y2="390"/>
  <line x1="540" y1="230" x2="540" y2="390"/>
  <line x1="300" y1="390" x2="540" y2="390"/>

  <!-- Stem: cross mount through the hole, body mid-stroke, center pole, two legs -->
  <path d="M 405 60 L 435 60 L 435 160 L 405 160"/>
  <rect x="370" y="160" width="100" height="140" rx="3"/>
  <rect x="410" y="300" width="20" height="40"/>
  <!-- Legs -->
  <rect x="378" y="300" width="18" height="60"/>
  <rect x="444" y="300" width="18" height="60"/>

  <!-- Spring under the pole -->
  <path d="M 420 340 L 428 348 L 412 356 L 428 364 L 412 372 L 428 380 L 420 390" stroke-opacity="0.7"/>

  <!-- Leaf: bent contact on the right, touching the stem's side -->
  <path d="M 505 240 L 505 300 L 490 330 L 505 360 L 505 400" stroke-opacity="0.8"/>
  <line x1="505" y1="400" x2="505" y2="440" stroke-opacity="0.5"/>

  <!-- Stem travel ghost: dashed line through the centre -->
  <line x1="420" y1="130" x2="420" y2="160" stroke-opacity="0.45" stroke-dasharray="3 5"/>
  <line x1="420" y1="360" x2="420" y2="390" stroke-opacity="0.45" stroke-dasharray="3 5"/>

  <!-- ══════════════════ PADS (dusty rose / bordeaux) ══════════════════ -->
  <g stroke="oklch(0.62 0.13 25)" fill="oklch(0.62 0.13 25 / 0.35)">
    <!-- Top-out pads on the rail shoulders -->
    <rect x="372" y="152" width="20" height="8" rx="2"/>
    <rect x="448" y="152" width="20" height="8" rx="2"/>
    <!-- Bottom-out pads on the leg feet -->
    <rect x="378" y="360" width="18" height="8" rx="2"/>
    <rect x="444" y="360" width="18" height="8" rx="2"/>
  </g>

  <!-- Impact markers: small contained arcs at ceiling and floor -->
  <g stroke="oklch(0.62 0.13 25)" stroke-opacity="0.55">
    <path d="M 372 140 A 10 10 0 0 1 392 140"/>
    <path d="M 448 140 A 10 10 0 0 1 468 140"/>
    <path d="M 378 380 A 9 9 0 0 0 396 380"/>
    <path d="M 444 380 A 9 9 0 0 0 462 380"/>
  </g>

  <!-- ══════════════════ LEADERS + LABELS (right) ══════════════════ -->

  <!-- Top-out -->
  <g stroke="oklch(0.62 0.13 25)">
    <line x1="470" y1="145" x2="640" y2="145"/>
    <circle cx="640" cy="145" r="3" fill="oklch(0.62 0.13 25)"/>
  </g>
  <text x="660" y="140" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="oklch(0.62 0.13 25)" stroke="none">top-out</text>
  <text x="660" y="162" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">upstroke, spring-driven — rail shoulders meet the ceiling</text>

  <!-- Leaf -->
  <g stroke="oklch(0.78 0.005 90)" stroke-opacity="0.6">
    <line x1="510" y1="330" x2="640" y2="330" stroke-dasharray="3 5"/>
    <circle cx="640" cy="330" r="3" fill="oklch(0.78 0.005 90)"/>
  </g>
  <text x="660" y="325" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">leaf</text>
  <text x="660" y="347" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">reached by neither pad — the tactile snap lives here</text>

  <!-- Bottom-out -->
  <g stroke="oklch(0.62 0.13 25)">
    <line x1="470" y1="385" x2="640" y2="385"/>
    <circle cx="640" cy="385" r="3" fill="oklch(0.62 0.13 25)"/>
  </g>
  <text x="660" y="380" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="oklch(0.62 0.13 25)" stroke="none">bottom-out</text>
  <text x="660" y="402" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.75">downstroke, finger-driven — leg feet meet the floor</text>

  <!-- Component labels, left of the switch -->
  <text x="255" y="115" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.55">top housing</text>
  <text x="255" y="340" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.55">bottom housing</text>
  <text x="355" y="235" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.55">stem</text>

  <!-- Footer -->
  <text x="600" y="500" font-family="Newsreader, serif" font-style="italic" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">one moving part touches both surfaces — so one part carries both pads</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
