<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Mirrored branch diagram. Left half: one unaddressed complaint, Lumina Brown, branches downward into two declining boxes, Cherry brand -2 to -20 and Cherry MX2A -46 to -54. Right half: one Kickstarter launch, V6 Ultra Hybrid, branches upward into two climbing boxes, Keychron brand 97 to 100 and Hall Effect / Rapid Trigger category 97 to 98.</title>

  <!-- Title -->
  <text x="600" y="50" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">One cause, two rows — each side of the tracker</text>

  <!-- Center divider -->
  <line x1="600" y1="80" x2="600" y2="480" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- LEFT SIDE: Cherry -->
  <rect x="120" y="90" width="330" height="66" rx="6" fill="none" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.7" stroke-width="2"/>
  <text x="285" y="118" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">one unaddressed complaint</text>
  <text x="285" y="140" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">Lumina Brown, since W34</text>

  <!-- Branch lines down -->
  <line x1="285" y1="156" x2="285" y2="200" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="180" y1="200" x2="390" y2="200" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="180" y1="200" x2="180" y2="230" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="390" y1="200" x2="390" y2="230" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Left leaf boxes -->
  <rect x="90" y="230" width="180" height="72" rx="6" fill="none" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="2"/>
  <text x="180" y="258" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Cherry brand</text>
  <text x="180" y="280" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">-2 &#8594; -20</text>
  <text x="180" y="296" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">W33 &#8594; W36</text>

  <rect x="300" y="230" width="180" height="72" rx="6" fill="none" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="2"/>
  <text x="390" y="252" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Cherry MX2A</text>
  <text x="390" y="266" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">switch row</text>
  <text x="390" y="286" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">-46 &#8594; -54</text>

  <text x="285" y="340" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">both falling, four weeks running</text>

  <!-- RIGHT SIDE: Keychron -->
  <rect x="750" y="90" width="330" height="66" rx="6" fill="none" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.7" stroke-width="2"/>
  <text x="915" y="118" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">one Kickstarter launch</text>
  <text x="915" y="140" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">V6 Ultra Hybrid, Aug 18</text>

  <!-- Branch lines down -->
  <line x1="915" y1="156" x2="915" y2="200" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="810" y1="200" x2="1020" y2="200" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="810" y1="200" x2="810" y2="230" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="1020" y1="200" x2="1020" y2="230" stroke="oklch(0.68 0.165 28)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Right leaf boxes -->
  <rect x="720" y="230" width="180" height="72" rx="6" fill="none" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="2"/>
  <text x="810" y="258" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Keychron brand</text>
  <text x="810" y="280" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">97 &#8594; 100</text>
  <text x="810" y="296" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">W33 &#8594; W36</text>

  <rect x="930" y="230" width="180" height="72" rx="6" fill="none" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.5" stroke-width="2"/>
  <text x="1020" y="252" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">HE / Rapid Trigger</text>
  <text x="1020" y="266" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">category row</text>
  <text x="1020" y="286" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" font-weight="600">97 &#8594; 98</text>

  <text x="915" y="340" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">both climbing, one launch behind both</text>

  <!-- Bottom summary line -->
  <text x="600" y="420" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">Same tracker, same four weeks, opposite arithmetic</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
