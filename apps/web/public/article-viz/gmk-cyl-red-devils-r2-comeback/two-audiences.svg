<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>One keycap set, GMK CYL Red Devils, splitting into two labeled buyer streams — a nostalgia stream of 2020 original-run buyers feeding an early tracker read, and a crossover stream of football-fandom buyers feeding a later, larger tracker read — both streams merging into the September 14 to October 10 2026 group buy window</title>

  <!-- Top node: the set itself -->
  <circle cx="600" cy="70" r="34" fill="oklch(0.68 0.165 28 / 0.12)" stroke="oklch(0.68 0.165 28)" stroke-width="3"/>
  <text x="600" y="68" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">GMK CYL</text>
  <text x="600" y="83" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">Red Devils</text>
  <text x="600" y="128" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.55">one set, two buyer pools arriving on different timelines</text>

  <!-- Fan lines to each card -->
  <g stroke-opacity="0.5">
    <line x1="576" y1="92" x2="330" y2="168"/>
    <line x1="624" y1="92" x2="870" y2="168"/>
  </g>

  <!-- LEFT card: nostalgia stream -->
  <rect x="140" y="170" width="380" height="210" rx="10" stroke-opacity="0.85"/>
  <text x="330" y="204" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">nostalgia stream</text>
  <line x1="160" y1="218" x2="500" y2="218" stroke-opacity="0.25"/>

  <circle cx="170" cy="246" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="182" y="250" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">2020 original-run buyers</text>

  <circle cx="170" cy="278" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="182" y="282" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">already collect Cherry-profile sets</text>

  <circle cx="170" cy="310" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="182" y="314" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">find the listing the day it opens</text>
  <text x="182" y="336" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.9">early tracker read: W33–W34, 10 → 15</text>

  <!-- RIGHT card: crossover stream -->
  <rect x="680" y="170" width="380" height="210" rx="10" stroke-opacity="0.85"/>
  <text x="870" y="204" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">crossover stream</text>
  <line x1="700" y1="218" x2="1040" y2="218" stroke-opacity="0.25"/>

  <circle cx="710" cy="246" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="722" y="250" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">football-fandom buyers</text>

  <circle cx="710" cy="278" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="722" y="282" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">discover it via supporter channels</text>

  <circle cx="710" cy="310" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6"/>
  <text x="722" y="314" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.85">arrive steadily across the window</text>
  <text x="722" y="336" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.68 0.165 28)" stroke="none" opacity="0.9">later tracker read: W37–W40, 52 → 68</text>

  <!-- Converging lines down to the group-buy bar -->
  <g stroke-opacity="0.5">
    <line x1="330" y1="380" x2="330" y2="420"/>
    <line x1="330" y1="420" x2="560" y2="450"/>
    <line x1="870" y1="380" x2="870" y2="420"/>
    <line x1="870" y1="420" x2="640" y2="450"/>
  </g>

  <!-- Bottom node: the group-buy window -->
  <rect x="300" y="452" width="600" height="68" rx="8" fill="oklch(0.68 0.165 28 / 0.08)" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
  <text x="600" y="480" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle">Sept 14 – Oct 10, 2026 group buy</text>
  <text x="600" y="500" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">Omnitype + Keebz N Cables</text>

  <text x="600" y="548" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.68 0.165 28)" stroke="none" text-anchor="middle" opacity="0.95">two buyer pools, two arrival times, one order window</text>

  <!-- Bronze theme dot -->
  <circle cx="1170" cy="25" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
