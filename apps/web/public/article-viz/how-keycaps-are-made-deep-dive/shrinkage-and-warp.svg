<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Mold shrinkage, ABS versus unfilled PBT, and what it does to a long spacebar</title>

  <!-- LEFT: shrinkage bars -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55" letter-spacing="1.5">MOLD SHRINKAGE</text>
    <text x="0" y="26" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">how much the part pulls in as it cools</text>

    <!-- axis: 0 to 2.5% across 440px => 176px per 1% -->
    <line x1="110" y1="70" x2="110" y2="230" opacity="0.35"/>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.45">
      <text x="110" y="250" text-anchor="middle">0</text>
      <text x="286" y="250" text-anchor="middle">1%</text>
      <text x="462" y="250" text-anchor="middle">2%</text>
    </g>
    <g opacity="0.18">
      <line x1="286" y1="70" x2="286" y2="232"/>
      <line x1="462" y1="70" x2="462" y2="232"/>
    </g>

    <!-- ABS bar: 0.6% => 106px -->
    <text x="0" y="112" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">ABS</text>
    <rect x="110" y="92" width="106" height="28" stroke="oklch(0.78 0.005 90)" fill="oklch(0.78 0.005 90)" fill-opacity="0.18"/>
    <text x="226" y="112" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none">0.6%</text>
    <text x="226" y="130" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">amorphous · same in every direction</text>

    <!-- PBT bar: 2% => 352px, ochre -->
    <text x="0" y="192" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">PBT</text>
    <text x="0" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.5">unfilled</text>
    <rect x="110" y="172" width="352" height="28" stroke="oklch(0.78 0.10 80)" fill="oklch(0.78 0.10 80)" fill-opacity="0.35"/>
    <text x="472" y="192" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(0.78 0.10 80)" stroke="none" font-weight="600">2%</text>
    <text x="110" y="226" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none">semi-crystalline · shrinks more along the flow than across it</text>
  </g>

  <!-- divider -->
  <line x1="620" y1="70" x2="620" y2="380" opacity="0.2"/>

  <!-- RIGHT: the spacebar -->
  <g transform="translate(670, 60)">
    <text x="0" y="0" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55" letter-spacing="1.5">6.25u SPACEBAR, SIDE VIEW</text>
    <text x="0" y="26" font-family="Newsreader, serif" font-size="20" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">the long axis is where it shows</text>

    <!-- ABS spacebar: straight -->
    <text x="0" y="104" font-family="Newsreader, serif" font-size="16" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">ABS</text>
    <path d="M 60 92 L 70 80 L 440 80 L 450 92 L 450 112 L 60 112 Z"/>
    <!-- stems -->
    <line x1="130" y1="112" x2="130" y2="124" opacity="0.6"/>
    <line x1="255" y1="112" x2="255" y2="124" opacity="0.6"/>
    <line x1="380" y1="112" x2="380" y2="124" opacity="0.6"/>
    <!-- baseline -->
    <line x1="40" y1="126" x2="470" y2="126" stroke-dasharray="3 6" opacity="0.35"/>
    <text x="60" y="146" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">sits flat on the stabiliser stems</text>

    <!-- PBT spacebar: bowed — ends lift off the baseline -->
    <text x="0" y="238" font-family="Newsreader, serif" font-size="16" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none">PBT</text>
    <path d="M 60 208 Q 255 244 450 208 L 450 228 Q 255 264 60 228 Z" stroke="oklch(0.78 0.10 80)"/>
    <!-- gate marker at the centre -->
    <line x1="255" y1="216" x2="255" y2="196" stroke="oklch(0.78 0.10 80)" opacity="0.8"/>
    <text x="255" y="190" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.9">gate</text>
    <!-- flow arrows outward from gate -->
    <g stroke="oklch(0.78 0.10 80)" opacity="0.55">
      <line x1="240" y1="226" x2="150" y2="218"/>
      <path d="M 158 213 L 150 218 L 157 224"/>
      <line x1="270" y1="226" x2="360" y2="218"/>
      <path d="M 352 213 L 360 218 L 353 224"/>
    </g>
    <!-- stems: centre touches, ends float -->
    <line x1="255" y1="246" x2="255" y2="258" opacity="0.6"/>
    <line x1="130" y1="236" x2="130" y2="258" stroke="oklch(0.62 0.13 25)" opacity="0.8" stroke-dasharray="2 3"/>
    <line x1="380" y1="236" x2="380" y2="258" stroke="oklch(0.62 0.13 25)" opacity="0.8" stroke-dasharray="2 3"/>
    <line x1="40" y1="260" x2="470" y2="260" stroke-dasharray="3 6" opacity="0.35"/>

    <text x="60" y="284" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.62 0.13 25)" stroke="none" font-weight="500">banana spacebar</text>
    <text x="60" y="302" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">long axis shrinks more than the short one; thin walls lock in the stress</text>
  </g>

  <!-- footer: the fix -->
  <text x="60" y="400" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.45">The fix was material, not process: glass-filled PBT compounds (Keyreative lists 85% PBT + 15% GF), thicker walls, centre gating.</text>
  <text x="60" y="420" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.35">Shrinkage figures: PlastikCity material shrinkage table. Anisotropy: Plastics Technology.</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
