<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Perceived smoothness against actuation count — a steep early climb that flattens into a plateau</title>

  <!-- Axes -->
  <line x1="120" y1="340" x2="1080" y2="340" stroke-opacity="0.55"/>
  <line x1="120" y1="80" x2="120" y2="340" stroke-opacity="0.4"/>

  <!-- X-axis labels -->
  <text x="120" y="365" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">0</text>
  <text x="330" y="365" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">~50</text>
  <text x="620" y="365" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" text-anchor="middle" opacity="0.95">~300</text>
  <text x="1000" y="365" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">1000+</text>
  <text x="600" y="395" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">actuation count</text>

  <!-- Y-axis label -->
  <text x="100" y="100" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.55">perceived smoothness</text>

  <!-- The curve: steep rise then plateau -->
  <path d="M 130 320 C 220 260 280 170 340 135 C 420 100 520 95 620 100 C 760 108 900 112 1050 114" stroke="oklch(0.78 0.10 80)" stroke-width="3" stroke-opacity="0.95"/>

  <!-- dots at the three stage markers -->
  <circle cx="130" cy="320" r="5" fill="oklch(0.78 0.005 90 / 0.3)" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.8"/>
  <circle cx="330" cy="145" r="6" fill="oklch(0.78 0.10 80 / 0.9)" stroke="oklch(0.78 0.10 80)"/>
  <circle cx="620" cy="100" r="7" fill="oklch(0.78 0.10 80)" stroke="oklch(0.78 0.10 80)"/>
  <circle cx="620" cy="100" r="14" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.4" fill="none"/>

  <!-- Plateau marker -->
  <line x1="620" y1="80" x2="620" y2="340" stroke="oklch(0.78 0.10 80)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="630" y="95" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.10 80)" stroke="none" opacity="0.95">plateau begins here</text>

  <!-- Annotations -->
  <text x="330" y="190" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">burr wear</text>
  <text x="330" y="208" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.75">+ lube spread</text>

  <text x="900" y="150" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">spring settling — smaller, a little later</text>

  <!-- Caption -->
  <text x="600" y="405" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.65">most of what break-in does, it does early</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
