<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Three Trends Tracker rows marked flat this week, compared: Hall Effect/Rapid Trigger at 97 after climbing from 82, Gateron Oil King at 40 after eight weeks near-unchanged, Cherry MX2A at negative 46 after oscillating in a band since negative 36</title>

  <!-- Title -->
  <text x="600" y="54" font-family="Newsreader, serif" font-size="18" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.85">Three rows marked "flat" — W33 Trends Tracker</text>

  <!-- Score axis ticks: -50, 0, 50, 100 mapped at x = 600 + score*5 -->
  <line x1="350" y1="100" x2="350" y2="500" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.1"/>
  <line x1="600" y1="90"  x2="600" y2="500" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="850" y1="100" x2="850" y2="500" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.1"/>
  <line x1="1100" y1="100" x2="1100" y2="500" stroke="oklch(0.78 0.005 90)" stroke-opacity="0.1"/>

  <text x="350"  y="518" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">-50</text>
  <text x="600"  y="518" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.5">0</text>
  <text x="850"  y="518" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">50</text>
  <text x="1100" y="518" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.45">100</text>

  <!-- Row 1: Hall Effect / Rapid Trigger — score 97, bar to x = 600 + 97*5 = 1085 -->
  <text x="120" y="130" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" font-weight="600" opacity="0.9">Hall Effect / Rapid Trigger</text>
  <rect x="600" y="140" width="485" height="50" rx="4" fill="oklch(0.68 0.165 28 / 0.22)" stroke="oklch(0.68 0.165 28)" stroke-width="2"/>
  <text x="1100" y="171" font-family="JetBrains Mono, monospace" font-size="16" fill="oklch(0.68 0.165 28)" stroke="none" font-weight="600">97</text>
  <text x="120" y="152" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">climbed 82 to 97 over seven weeks, now flat</text>

  <!-- Row 2: Gateron Oil King — score 40, bar to x = 600 + 40*5 = 800 -->
  <text x="120" y="290" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" font-weight="600" opacity="0.9">Gateron Oil King</text>
  <rect x="600" y="300" width="200" height="50" rx="4" fill="oklch(0.78 0.005 90 / 0.1)" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-opacity="0.7"/>
  <text x="815" y="331" font-family="JetBrains Mono, monospace" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600" opacity="0.85">40</text>
  <text x="120" y="312" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">steady near 39-40 for eight straight weeks — no news</text>

  <!-- Row 3: Cherry MX2A — score -46, bar from x = 600 - 46*5 = 370 to x = 600 -->
  <text x="120" y="450" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="start" font-weight="600" opacity="0.9">Cherry MX2A</text>
  <rect x="370" y="460" width="230" height="50" rx="4" fill="oklch(0.78 0.005 90 / 0.1)" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-opacity="0.7"/>
  <text x="355" y="491" font-family="JetBrains Mono, monospace" font-size="16" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" font-weight="600" opacity="0.85">-46</text>
  <text x="120" y="472" font-family="Newsreader, serif" font-size="13" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.65">oscillating -36 to -50 as TMR pulls attention away</text>

  <!-- Caption annotation -->
  <text x="600" y="546" font-family="Newsreader, serif" font-size="14" font-style="italic" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.6">flat near the ceiling, flat mid-table, and flat near the floor are not the same "flat"</text>

  <!-- Brass theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
