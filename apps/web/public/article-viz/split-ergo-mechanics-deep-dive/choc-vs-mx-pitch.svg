<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>MX key spacing at 19.05 by 19.05 millimetres compared with Choc key spacing at 18 by 17 millimetres, drawn as two three-by-three key grids at the same scale, with the 2 millimetre per-row vertical saving marked on the Choc grid</title>

  <!-- Scale: 4.4 px per mm. MX pitch 19.05mm = 83.8px, cap 18mm = 79.2px. Choc pitch 18x17mm = 79.2x74.8px, cap 17.5x16.5mm = 77x72.6px. -->

  <!-- ══ LEFT: MX SPACING ══════════════════════════════════════════ -->
  <text x="180" y="70" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.78 0.005 90)" stroke="none" font-weight="600" letter-spacing="0.06em">MX SPACING</text>
  <text x="180" y="92" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">19.05 × 19.05 mm pitch</text>

  <g transform="translate(180 130)" stroke-opacity="0.85">
    <!-- row 1 -->
    <rect x="0"     y="0"     width="79.2" height="79.2" rx="6"/>
    <rect x="83.8"  y="0"     width="79.2" height="79.2" rx="6"/>
    <rect x="167.6" y="0"     width="79.2" height="79.2" rx="6"/>
    <!-- row 2 -->
    <rect x="0"     y="83.8"  width="79.2" height="79.2" rx="6"/>
    <rect x="83.8"  y="83.8"  width="79.2" height="79.2" rx="6"/>
    <rect x="167.6" y="83.8"  width="79.2" height="79.2" rx="6"/>
    <!-- row 3 -->
    <rect x="0"     y="167.6" width="79.2" height="79.2" rx="6"/>
    <rect x="83.8"  y="167.6" width="79.2" height="79.2" rx="6"/>
    <rect x="167.6" y="167.6" width="79.2" height="79.2" rx="6"/>
  </g>

  <!-- MX horizontal pitch dimension (top, centre to centre of first two keys) -->
  <g stroke-opacity="0.5">
    <line x1="219.6" y1="112" x2="303.4" y2="112"/>
    <line x1="219.6" y1="106" x2="219.6" y2="118"/>
    <line x1="303.4" y1="106" x2="303.4" y2="118"/>
  </g>
  <text x="261.5" y="104" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">19.05</text>

  <!-- MX vertical pitch dimension (left, three rows, centre to centre) -->
  <g stroke-opacity="0.5">
    <line x1="160" y1="169.6" x2="160" y2="337.2"/>
    <line x1="154" y1="169.6" x2="166" y2="169.6"/>
    <line x1="154" y1="337.2" x2="166" y2="337.2"/>
  </g>
  <text x="150" y="258" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="end" opacity="0.7">38.1</text>

  <!-- divider -->
  <line x1="600" y1="70" x2="600" y2="420" stroke-opacity="0.2" stroke-dasharray="4 6"/>

  <!-- ══ RIGHT: CHOC SPACING ═══════════════════════════════════════ -->
  <text x="720" y="70" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="oklch(0.70 0.09 18)" stroke="none" font-weight="600" letter-spacing="0.06em">CHOC SPACING</text>
  <text x="720" y="92" font-family="JetBrains Mono, monospace" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">18 × 17 mm pitch</text>

  <g transform="translate(720 130)" stroke-opacity="0.85">
    <!-- row 1 -->
    <rect x="0"     y="0"     width="77" height="72.6" rx="5"/>
    <rect x="79.2"  y="0"     width="77" height="72.6" rx="5"/>
    <rect x="158.4" y="0"     width="77" height="72.6" rx="5"/>
    <!-- row 2 -->
    <rect x="0"     y="74.8"  width="77" height="72.6" rx="5"/>
    <rect x="79.2"  y="74.8"  width="77" height="72.6" rx="5"/>
    <rect x="158.4" y="74.8"  width="77" height="72.6" rx="5"/>
    <!-- row 3 -->
    <rect x="0"     y="149.6" width="77" height="72.6" rx="5"/>
    <rect x="79.2"  y="149.6" width="77" height="72.6" rx="5"/>
    <rect x="158.4" y="149.6" width="77" height="72.6" rx="5"/>
  </g>

  <!-- Choc horizontal pitch dimension -->
  <g stroke-opacity="0.5">
    <line x1="758.5" y1="112" x2="837.7" y2="112"/>
    <line x1="758.5" y1="106" x2="758.5" y2="118"/>
    <line x1="837.7" y1="106" x2="837.7" y2="118"/>
  </g>
  <text x="798" y="104" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" text-anchor="middle" opacity="0.7">18</text>

  <!-- Choc vertical pitch dimension (three rows, centre to centre) — in splash colour -->
  <g stroke="oklch(0.70 0.09 18)" stroke-opacity="0.9">
    <line x1="700" y1="166.3" x2="700" y2="315.9"/>
    <line x1="694" y1="166.3" x2="706" y2="166.3"/>
    <line x1="694" y1="315.9" x2="706" y2="315.9"/>
  </g>
  <text x="690" y="245" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.70 0.09 18)" stroke="none" text-anchor="end">34</text>

  <!-- Ghost of MX row-3 bottom edge over the Choc grid to show the vertical saving -->
  <line x1="720" y1="376.8" x2="955.4" y2="376.8" stroke-opacity="0.3" stroke-dasharray="3 5"/>
  <text x="962" y="381" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.55">MX row 3 would end here</text>

  <!-- Splash bracket marking the per-row saving -->
  <g stroke="oklch(0.70 0.09 18)">
    <path d="M 965 352.2 L 975 352.2 L 975 376.8 L 965 376.8"/>
  </g>
  <circle cx="975" cy="364.5" r="4" fill="oklch(0.70 0.09 18)" stroke="none"/>
  <text x="988" y="360" font-family="Newsreader, serif" font-style="italic" font-size="16" fill="oklch(0.70 0.09 18)" stroke="none">about 2 mm shorter</text>
  <text x="988" y="378" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">per row, down the column</text>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
