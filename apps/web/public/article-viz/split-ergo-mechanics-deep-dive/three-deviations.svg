<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" preserveAspectRatio="xMidYMid meet" fill="none" stroke="oklch(0.78 0.005 90)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Three wrist deviations a flat row-staggered keyboard forces — ulnar deviation, pronation, extension — each paired with the one geometry that corrects it: split opening angle, tenting gable, and zero or negative slope with a low profile</title>

  <!-- Column headers -->
  <text x="60" y="52" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.6" letter-spacing="0.08em">DEVIATION</text>
  <text x="700" y="52" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.70 0.09 18)" stroke="none" opacity="0.95" letter-spacing="0.08em">CORRECTION</text>

  <!-- Row dividers -->
  <g stroke-opacity="0.2" stroke-dasharray="4 6">
    <line x1="60" y1="215" x2="1140" y2="215"/>
    <line x1="60" y1="375" x2="1140" y2="375"/>
  </g>

  <!-- ══ ROW 1: ULNAR DEVIATION ═══════════════════════════════════ -->
  <text x="60" y="105" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.78 0.005 90)" stroke="none">Ulnar deviation</text>
  <text x="60" y="132" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">wrists bend toward the pinky to meet a narrow board</text>

  <!-- glyph: top-down forearm + hand, bent outward -->
  <g transform="translate(440 80)">
    <!-- forearm -->
    <path d="M 0 70 L 70 70" stroke-opacity="0.85"/>
    <path d="M 0 96 L 70 96" stroke-opacity="0.85"/>
    <!-- wrist hinge -->
    <circle cx="76" cy="83" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8"/>
    <!-- hand, angled outward (ulnar) -->
    <path d="M 76 70 L 140 40 L 150 52 L 98 92 L 76 96 Z" stroke-opacity="0.85"/>
    <!-- angle arc -->
    <path d="M 110 83 A 34 34 0 0 0 108 66" stroke="oklch(0.62 0.13 25)" stroke-opacity="0.8"/>
    <text x="118" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.62 0.13 25)" stroke="none">~12°</text>
  </g>

  <!-- correction -->
  <text x="700" y="105" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.70 0.09 18)" stroke="none">Split</text>
  <text x="700" y="132" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">opening angle 12–15° between halves</text>
  <!-- glyph: two halves angled apart -->
  <g transform="translate(1000 80)">
    <rect x="0" y="50" width="56" height="40" rx="4" transform="rotate(-7 28 70)" stroke-opacity="0.85"/>
    <rect x="74" y="50" width="56" height="40" rx="4" transform="rotate(7 102 70)" stroke-opacity="0.85"/>
    <circle cx="65" cy="40" r="4" fill="oklch(0.70 0.09 18)" stroke="none"/>
  </g>

  <!-- ══ ROW 2: PRONATION ═════════════════════════════════════════ -->
  <text x="60" y="265" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.78 0.005 90)" stroke="none">Pronation</text>
  <text x="60" y="292" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">forearm rotates so the palm faces the desk</text>

  <!-- glyph: end-on forearm cross-section, palm flat -->
  <g transform="translate(440 240)">
    <line x1="0" y1="100" x2="160" y2="100" stroke-opacity="0.35"/>
    <ellipse cx="80" cy="78" rx="52" ry="20" stroke-opacity="0.85"/>
    <path d="M 40 96 A 44 44 0 0 1 120 96" stroke="oklch(0.62 0.13 25)" stroke-opacity="0.8"/>
    <text x="128" y="92" font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(0.62 0.13 25)" stroke="none">flat</text>
  </g>

  <!-- correction -->
  <text x="700" y="265" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.70 0.09 18)" stroke="none">Tenting</text>
  <text x="700" y="292" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">gable of about 14° in the studies</text>
  <!-- glyph: two halves tented, inner edges raised -->
  <g transform="translate(1000 240)">
    <line x1="-10" y1="100" x2="150" y2="100" stroke-opacity="0.35"/>
    <path d="M 0 100 L 60 76" stroke-opacity="0.9"/>
    <path d="M 140 100 L 80 76" stroke-opacity="0.9"/>
    <path d="M 20 100 A 20 20 0 0 0 18 92" stroke-opacity="0.5"/>
    <circle cx="70" cy="58" r="4" fill="oklch(0.70 0.09 18)" stroke="none"/>
  </g>

  <!-- ══ ROW 3: EXTENSION ═════════════════════════════════════════ -->
  <text x="60" y="425" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.78 0.005 90)" stroke="none">Extension</text>
  <text x="60" y="452" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">wrist bends upward to climb onto a tall or back-raised board</text>

  <!-- glyph: side view, forearm flat, hand bent up onto a sloped board -->
  <g transform="translate(440 400)">
    <line x1="0" y1="100" x2="160" y2="100" stroke-opacity="0.35"/>
    <!-- sloped board (back higher) -->
    <path d="M 90 100 L 160 100 L 160 78 L 90 92 Z" stroke-opacity="0.85"/>
    <!-- forearm -->
    <path d="M 0 80 L 60 80" stroke-opacity="0.85"/>
    <circle cx="66" cy="80" r="3" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.8"/>
    <!-- hand bent upward -->
    <path d="M 66 80 L 106 58" stroke-opacity="0.85"/>
    <path d="M 84 80 A 20 20 0 0 0 80 72" stroke="oklch(0.62 0.13 25)" stroke-opacity="0.8"/>
  </g>

  <!-- correction -->
  <text x="700" y="425" font-family="Newsreader, serif" font-style="italic" font-size="22" fill="oklch(0.70 0.09 18)" stroke="none">Slope and profile</text>
  <text x="700" y="452" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="oklch(0.78 0.005 90)" stroke="none" opacity="0.7">0° or −7° slope; low profile (20 mm to keycap top)</text>
  <!-- glyph: side view, thin flat board, straight wrist -->
  <g transform="translate(1000 400)">
    <line x1="-10" y1="100" x2="150" y2="100" stroke-opacity="0.35"/>
    <rect x="80" y="88" width="60" height="12" rx="2" stroke-opacity="0.85"/>
    <path d="M 0 82 L 110 82" stroke-opacity="0.85"/>
    <circle cx="66" cy="82" r="3" fill="oklch(0.70 0.09 18)" stroke="none"/>
    <circle cx="70" cy="58" r="4" fill="oklch(0.70 0.09 18)" stroke="none"/>
  </g>

  <!-- Brass-bronze theme dot -->
  <circle cx="1170" cy="42" r="3" fill="oklch(0.80 0.135 75)" stroke="oklch(0.80 0.135 75)"/>
</svg>
