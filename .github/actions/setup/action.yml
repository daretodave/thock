name: setup
description: >-
  The project's toolchain for a cloud tick: one place for it, used
  by march.yml's owner job and its pull-request build job alike
  (and night.yml). Adjust for your stack; keep it free of secrets.

runs:
  using: composite
  steps:
    # Moved from the v1 march.yml by nexus upgrade: the job's toolchain steps, verbatim.
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers (chromium only)
      # @playwright/test is only installed under apps/e2e in the
      # workspace, so `pnpm exec playwright` from root can't find
      # it. Run the e2e package's own install script instead.
      shell: bash
      run: pnpm --filter "@thock/e2e" e2e:install
